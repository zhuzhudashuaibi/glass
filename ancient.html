<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D64533">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>古诗文</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--ink:#1F2328;--sub:#8A9099;--line:#ECEEF2;
  --brand:#D64533;--brand-w:#FDEDEB;--ok:#12A05C;--ok-w:#E7F6EE;--warn:#E0952C;
  --bar:56px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.6;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{position:relative;height:100dvh;height:100vh;overflow:hidden}

/* ---------- 页面栈与转场 ---------- */
.page{
  position:absolute;inset:0;background:var(--bg);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 12px);
  transform:translateX(100%);opacity:0;visibility:hidden;
  transition:transform .30s cubic-bezier(.22,.61,.36,1),opacity .30s ease,visibility .30s;
  will-change:transform;
}
.page.active{transform:translateX(0);opacity:1;visibility:visible}
.page.behind{transform:translateX(-26%);opacity:.4;visibility:visible}
.page.fade{transform:scale(.985);opacity:0}
.page.fade.active{transform:none;opacity:1}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
}
.topbar .row{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:.5px}
.topbar .sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.iconbtn{
  width:36px;height:36px;border:none;background:var(--card);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);flex:none;
}
.spacer{flex:1}

/* ---------- 通用组件 ---------- */
.tap{position:relative;overflow:hidden;transition:transform .12s ease,background .15s}
.tap:active{transform:scale(.965)}
.ripple{position:absolute;border-radius:50%;background:rgba(214,69,51,.16);transform:scale(0);
  animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--sub);
  font-size:13.5px;border:1px solid var(--line);font-weight:600;
}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.search{
  margin:0 16px 10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);font-size:15px;width:calc(100% - 32px);font-family:inherit;outline:none;color:var(--ink)
}
.search:focus{border-color:var(--brand)}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:16px 16px 8px;letter-spacing:.5px}

/* ---------- 篇目卡片 ---------- */
.listwrap{padding:0 16px 20px}
.pcard{
  background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  animation:up .34s cubic-bezier(.22,.61,.36,1) backwards;
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pcard .t{font-size:16.5px;font-weight:700;letter-spacing:.3px}
.pcard .a{font-size:12.5px;color:var(--sub);margin-top:1px}
.pcard .arrow{color:#C8CDD4;font-size:16px;flex:none}
.tagx{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;flex:none}
.tagx.诗,.tagx.民歌{background:#FDF1E5;color:#B96A16}
.tagx.词{background:#F3EDFB;color:#7A55A8}
.tagx.曲{background:#FDECEA;color:var(--brand)}
.tagx.文言文{background:var(--ok-w);color:var(--ok)}
.grow{flex:1;min-width:0}

/* ---------- 详情 ---------- */
.detail-body{padding:0 16px 24px}
.dtitle{font-size:24px;font-weight:800;letter-spacing:1px}
.dmeta{font-size:13px;color:var(--sub);margin-top:3px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:16px;margin-bottom:12px}
.card .h{font-size:13.5px;font-weight:800;color:var(--brand);margin-bottom:8px;letter-spacing:.5px}
.poem{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:17.5px;line-height:2.05;
  white-space:pre-wrap;letter-spacing:.4px;text-align:center}
.prose{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:16.5px;line-height:2.05;
  white-space:pre-wrap;text-align:justify;text-indent:2em;letter-spacing:.3px}
.theme{font-size:14.5px;color:#2F6B4F;background:var(--ok-w);border-radius:12px;padding:10px 13px;margin-bottom:12px}
.notes{margin:0;padding-left:18px;font-size:14px;color:#5A616B}
.notes li{margin-bottom:4px}
ol.dl{margin:0;padding-left:20px}
ol.dl li{margin-bottom:12px;font-size:15px}
.ans{display:none;margin-top:6px;padding:8px 11px;background:#FFF8E8;border:1px dashed #E8C88A;
  border-radius:10px;font-size:15px;color:#8A5A12;white-space:pre-line}
.ans.show{display:block;animation:up .25s ease}
.mini{font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--sub);font-weight:600;margin-top:6px}
.mini:active{background:var(--brand-w)}

/* ---------- 题目首页 ---------- */
.qentry{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 16px 12px;
  display:flex;align-items:center;gap:14px;
  animation:up .36s cubic-bezier(.22,.61,.36,1) backwards;
}
.qentry .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex:none}
.qentry .n{font-size:16.5px;font-weight:800}
.qentry .d{font-size:12.5px;color:var(--sub);margin-top:2px}
.badge{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-w);
  padding:3px 9px;border-radius:999px}

/* ---------- 设置 / 答题 ---------- */
.block{margin:6px 16px 16px}
.block .lb{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:8px;letter-spacing:.5px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{
  flex:1;min-width:calc(50% - 5px);background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;
}
.opt.on{border-color:var(--brand);background:var(--brand-w)}
.opt .n{font-size:15px;font-weight:700}
.opt .d{font-size:12px;color:var(--sub);margin-top:2px}
.opt.on .n{color:var(--brand)}
.start{
  margin:8px 16px 0;width:calc(100% - 32px);background:var(--brand);color:#fff;border:none;
  border-radius:16px;padding:15px;font-size:16.5px;font-weight:800;font-family:inherit;
}
.start:active{transform:scale(.98)}

.playhead{display:flex;align-items:center;gap:12px;padding:0 16px}
.bar{flex:1;height:6px;background:#E7E9EE;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .35s cubic-bezier(.22,.61,.36,1)}
.pno{font-size:13px;font-weight:800;color:var(--sub);flex:none}
.qbox{margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.qfrom{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:8px}
.qtext{font-size:17.5px;line-height:1.85;font-weight:600}
.qsub{font-family:"Songti SC",serif;font-size:16.5px;line-height:1.9;color:#4A515B;margin-top:10px;
  background:#F7F8FA;border-radius:12px;padding:10px 13px;white-space:pre-line}
.choices{margin:12px 16px 0}
.choice{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;margin-bottom:10px;font-size:15.5px;font-family:inherit;color:var(--ink);
  line-height:1.7;animation:up .28s ease backwards;
}
.choice.right{background:var(--ok-w);border-color:var(--ok);color:#0B7A45;font-weight:700;animation:pop .35s}
.choice.wrong{background:#FDECEA;border-color:var(--brand);color:#B5341F;animation:shake .4s}
@keyframes pop{0%{transform:scale(.97)}55%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.typed{margin:12px 16px 0}
.typed input{
  width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;font-size:16.5px;
  font-family:inherit;background:var(--card);outline:none;color:var(--ink)
}
.typed input:focus{border-color:var(--brand)}
.fb{margin:12px 16px 0;border-radius:14px;padding:13px 15px;font-size:15px;display:none;line-height:1.8}
.fb.show{display:block;animation:up .3s ease}
.fb.ok{background:var(--ok-w);color:#0B7A45;border:1px solid #BFE5D0}
.fb.no{background:#FDECEA;color:#B5341F;border:1px solid #F3C4BC}
.fb .rightans{font-family:"Songti SC",serif;font-size:16px;font-weight:700;margin-top:4px;display:block}
.actbar{display:flex;gap:10px;margin:14px 16px 0}
.actbar button{flex:1;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:15px;font-weight:700;font-family:inherit;color:var(--ink)}
.actbar button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------- 结果 ---------- */
.rescore{text-align:center;padding:26px 16px 8px;animation:pop .5s}
.rescore .big{font-size:56px;font-weight:800;color:var(--brand);line-height:1.1;letter-spacing:-1px}
.rescore .lb{font-size:13px;color:var(--sub);font-weight:700}
.resrow{display:flex;justify-content:center;gap:26px;margin-top:14px}
.resrow div{text-align:center}
.resrow b{display:block;font-size:20px;font-weight:800}
.resrow span{font-size:12px;color:var(--sub)}
.wronglist{margin:0 16px 20px}
.witem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.witem .q{font-size:14px;color:var(--sub);line-height:1.6}
.witem .a{font-family:"Songti SC",serif;font-size:15.5px;font-weight:700;color:#0B7A45;margin-top:5px}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:60;height:calc(var(--bar) + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--sub);font-weight:700}
.tabbar .tab.on{color:var(--brand)}
.tabbar .tab .ic{font-size:20px;line-height:1}
.tabbar .tab.on .ic{animation:pop .35s}

.empty{text-align:center;color:var(--sub);font-size:14px;padding:50px 20px}
.hide{display:none !important}
</style>
</head>
<body>
<div id="app">

  <!-- 古诗列表 -->
  <section class="page active" id="p-poem">
    <div class="topbar">
      <div class="row"><h1>古诗文</h1><div class="spacer"></div>
        <div class="sub" id="poemCount"></div></div>
      <div class="sub" style="margin-top:2px">统编版 7-9 年级 · 全 6 册</div>
    </div>
    <input class="search" id="poemSearch" placeholder="搜索篇名、作者或名句…">
    <div class="chips" id="bookChips"></div>
    <div class="listwrap" id="poemList"></div>
  </section>

  <!-- 详情 -->
  <section class="page" id="p-detail">
    <div class="topbar">
      <div class="row">
        <button class="iconbtn tap" data-back>←</button>
        <div class="grow" style="font-size:14px;font-weight:800" id="dTop">原文</div>
        <button class="iconbtn tap" id="dQuiz" style="font-size:13px;width:auto;padding:0 12px">做题</button>
      </div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </section>

  <!-- 题目首页 -->
  <section class="page" id="p-quiz">
    <div class="topbar">
      <div class="row"><h1>练习</h1></div>
      <div class="sub" style="margin-top:2px">三种题型 · 简单 / 困难两种模式</div>
    </div>
    <div style="height:6px"></div>
    <div class="qentry tap" data-type="dict">
      <div class="ico" style="background:#FDEDEB;color:#D64533">✍️</div>
      <div class="grow"><div class="n">理解性默写</div><div class="d">给情境、手法、情感提示，写出原句</div></div>
      <div class="badge" id="cntDict"></div>
    </div>
    <div class="qentry tap" data-type="seq">
      <div class="ico" style="background:#EAF3FF;color:#2C6BED">🔗</div>
      <div class="grow"><div class="n">上下句默写</div><div class="d">给出上句补下句（或反之）</div></div>
      <div class="badge" id="cntSeq"></div>
    </div>
    <div class="qentry tap" data-type="trans">
      <div class="ico" style="background:#E7F6EE;color:#12A05C">🈶</div>
      <div class="grow"><div class="n">翻译</div><div class="d">原句 ↔ 现代汉语译文互译</div></div>
      <div class="badge" id="cntTrans"></div>
    </div>
    <div style="height:10px"></div>
    <div class="card" style="margin:0 16px;background:#FFF8E8;border-color:#F0DCB4">
      <div style="font-size:13.5px;font-weight:800;color:#8A5A12;margin-bottom:6px">模式说明</div>
      <div style="font-size:13px;color:#8A6A2A;line-height:1.8">
        <b>简单模式</b>：四选一选择题，适合初学与快速过题。<br>
        <b>困难模式</b>：手动打字填空，判分时自动忽略标点与空格。
      </div>
    </div>
  </section>

  <!-- 设置 -->
  <section class="page" id="p-setup">
    <div class="topbar">
      <div class="row"><button class="iconbtn tap" data-back>←</button>
        <div style="font-size:18px;font-weight:800" id="sTitle">练习设置</div></div>
    </div>
    <div class="block">
      <div class="lb">模式</div>
      <div class="opts">
        <div class="opt tap on" data-mode="easy"><div class="n">简单 · 选择题</div><div class="d">四选一，点选即判</div></div>
        <div class="opt tap" data-mode="hard"><div class="n">困难 · 打字填空</div><div class="d">自己输入原句</div></div>
      </div>
    </div>
    <div class="block">
      <div class="lb">范围</div>
      <div class="chips" id="scopeChips" style="padding:0;flex-wrap:wrap;overflow:visible"></div>
    </div>
    <div class="block">
      <div class="lb">题量</div>
      <div class="chips" id="numChips" style="padding:0;flex-wrap:wrap;overflow:visible"></div>
    </div>
    <button class="start tap" id="btnStart">开始练习</button>
    <div style="height:20px"></div>
  </section>

  <!-- 答题 -->
  <section class="page" id="p-play">
    <div class="topbar">
      <div class="row">
        <button class="iconbtn tap" id="pExit">✕</button>
        <div class="bar"><i id="pBar"></i></div>
        <div class="pno" id="pNo">1/10</div>
      </div>
      <div class="row" style="margin-top:6px">
        <div class="sub" style="font-size:12px" id="pType"></div>
        <div class="spacer"></div>
        <div class="sub" style="font-size:12px">答对 <b id="pRight" style="color:var(--brand)">0</b></div>
      </div>
    </div>
    <div class="qbox">
      <div class="qfrom" id="qFrom"></div>
      <div class="qtext" id="qText"></div>
      <div class="qsub hide" id="qSub"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="typed hide" id="typedBox">
      <input id="typedInput" placeholder="输入原句，标点可省略" autocomplete="off">
    </div>
    <div class="fb" id="fb"></div>
    <div class="actbar" id="actbar"></div>
  </section>

  <!-- 结果 -->
  <section class="page" id="p-result">
    <div class="topbar"><div class="row">
      <button class="iconbtn tap" id="rExit">←</button>
      <div style="font-size:18px;font-weight:800">练习结果</div></div></div>
    <div class="rescore">
      <div class="lb">正确率</div>
      <div class="big"><span id="rRate">0</span>%</div>
      <div class="resrow">
        <div><b id="rRight">0</b><span>答对</span></div>
        <div><b id="rTotal">0</b><span>总题数</span></div>
        <div><b id="rTime">0s</b><span>用时</span></div>
      </div>
    </div>
    <div class="sec" id="rWrongTitle">错题回顾</div>
    <div class="wronglist" id="rWrong"></div>
    <div class="actbar" style="margin-bottom:20px">
      <button class="tap" id="rAgain">再来一轮</button>
      <button class="pri tap" id="rWrongOnly">只练错题</button>
    </div>
  </section>

  <nav class="tabbar">
    <div class="tab tap on" data-tab="p-poem"><span class="ic">📖</span><span>古诗</span></div>
    <div class="tab tap" data-tab="p-quiz"><span class="ic">🎯</span><span>题目</span></div>
  </nav>
</div>

<script>
const DATA = [{"title": "观沧海", "author": "曹操", "dynasty": "东汉", "genre": "诗", "source": "课内", "unit": "第一单元 第4课 古代诗歌四首", "text": "东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。", "theme": "借登山观海所见的壮阔景象，抒发诗人吞吐宇宙的博大胸襟与统一天下的雄心。", "notes": ["碣石：山名，在今河北昌黎，诗人北征乌桓登临处。", "澹澹：水波荡漾的样子；竦峙：高高地耸立。", "萧瑟：风吹树木的声音，此处形容秋风吹拂。", "星汉：银河。", "“幸甚至哉，歌以咏志”是合乐时所加，与正文内容无直接关系。", "名句“日月之行，若出其中；星汉灿烂，若出其里”以夸张想象写大海，属虚写，最能体现诗人博大胸怀。"], "dict": [{"q": "曹操《观沧海》中交代观海地点、并统领全篇的两句诗是？", "a": "东临碣石，以观沧海。"}, {"q": "《观沧海》中描写海水起伏动荡、山岛高高耸立的诗句是？", "a": "水何澹澹，山岛竦峙。"}, {"q": "《观沧海》中写岛上草木繁茂、充满勃勃生机的诗句是？", "a": "树木丛生，百草丰茂。"}, {"q": "《观沧海》中描写秋风呼啸、大海涌起巨大波涛的诗句是？", "a": "秋风萧瑟，洪波涌起。"}, {"q": "《观沧海》中诗人借助奇特想象，表现大海吞吐日月星辰的气概，借以抒发自己博大胸襟和远大抱负的诗句是？", "a": "日月之行，若出其中；\n星汉灿烂，若出其里。"}, {"q": "《观沧海》中属合乐时所加、与正文内容无关的两句附文是？", "a": "幸甚至哉，歌以咏志。"}], "trans": [{"q": "东临碣石，以观沧海。", "a": "向东登上碣石山，来观赏那苍茫辽阔的大海。"}, {"q": "水何澹澹，山岛竦峙。", "a": "海水多么宽阔浩荡，山岛高高地挺立在海边。"}, {"q": "树木丛生，百草丰茂。", "a": "岛上树木郁郁葱葱地生长，百草长得丰美茂盛。"}, {"q": "秋风萧瑟，洪波涌起。", "a": "秋风吹得草木萧瑟作响，海中涌起巨大的波涛。"}, {"q": "日月之行，若出其中；星汉灿烂，若出其里。", "a": "太阳月亮的运行，好像出自大海之中；银河星光灿烂，好像也从大海里涌现。"}], "book": "7a", "grade": "七年级上册", "id": 0}, {"title": "闻王昌龄左迁龙标遥有此寄", "author": "李白", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第一单元 第4课 古代诗歌四首", "text": "杨花落尽子规啼，\n闻道龙标过五溪。\n我寄愁心与明月，\n随君直到夜郎西。", "theme": "借暮春景物与明月，抒发对被贬远行的友人的深切同情、思念与关切。", "notes": ["左迁：降职，古以右为尊；龙标：唐代县名，在今湖南黔阳。", "杨花：柳絮，飘零无定，暗喻友人漂泊的身世。", "子规：即杜鹃鸟，啼声凄厉，传说其声似“不如归去”。", "五溪：今湖南西部、贵州东部五条溪流的总称，指荒远之地。", "夜郎：唐代县名，在今湖南沅陵西，非贵州古夜郎国。", "名句“我寄愁心与明月”运用拟人手法，把明月人格化为传递愁心的使者，构思奇绝。"], "dict": [{"q": "李白《闻王昌龄左迁龙标遥有此寄》中，以“杨花”“子规”两个意象渲染暮春飘零离恨、奠定全诗悲惋基调的诗句是？", "a": "杨花落尽子规啼"}, {"q": "诗中交代友人被贬之地偏远荒远、路途艰难的诗句是？", "a": "闻道龙标过五溪。"}, {"q": "李白在诗中把明月人格化，托明月把自己的“愁心”带给远方友人，表达对友人深切同情与思念的千古名句是？", "a": "我寄愁心与明月，\n随君直到夜郎西。"}, {"q": "诗中紧承“我寄愁心与明月”，写愁心伴友人远抵贬所的一句是？", "a": "随君直到夜郎西。"}, {"q": "诗中融情入景、借暮春之景烘托凄凉悲惋气氛的两句是？", "a": "杨花落尽子规啼，\n闻道龙标过五溪。"}], "trans": [{"q": "杨花落尽子规啼，", "a": "柳絮已经飘落干净，只有杜鹃鸟在不住地啼叫。"}, {"q": "闻道龙标过五溪。", "a": "听说你被贬往龙标，一路上要经过迢迢五溪。"}, {"q": "我寄愁心与明月，", "a": "我把为你忧愁的心思托付给天上的明月。"}, {"q": "随君直到夜郎西。", "a": "让它一路伴随着你，一直到夜郎的西边。"}], "book": "7a", "grade": "七年级上册", "id": 1}, {"title": "次北固山下", "author": "王湾", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第一单元 第4课 古代诗歌四首", "text": "客路青山外，\n行舟绿水前。\n潮平两岸阔，\n风正一帆悬。\n海日生残夜，\n江春入旧年。\n乡书何处达？\n归雁洛阳边。", "theme": "写冬末春初舟泊北固山下的所见所感，抒发淡淡的羁旅乡思，并蕴含时序交替的乐观理趣。", "notes": ["次：停宿、停泊；北固山在今江苏镇江。", "客路：旅人前行的路。", "潮平：潮水上涨，与江岸齐平。", "残夜：夜将尽未尽之时。", "“海日生残夜，江春入旧年”中“生”“入”二字用拟人手法定格景物，蕴含新事物必将取代旧事物的哲理。", "尾联借“雁足传书”典故表达思乡之情。"], "dict": [{"q": "《次北固山下》中点明诗人客游在外、舟行于青山绿水之间的诗句是？", "a": "客路青山外，\n行舟绿水前。"}, {"q": "《次北固山下》中描写春潮涌涨、江面开阔、和风顺畅、船帆高悬的名句是？", "a": "潮平两岸阔，\n风正一帆悬。"}, {"q": "王湾在《次北固山下》中描写夜色将尽红日已升、旧年未去新春已至，蕴含新事物必将代替旧事物这一哲理的诗句是？", "a": "海日生残夜，\n江春入旧年。"}, {"q": "《次北固山下》中诗人借“鸿雁传书”的典故，表达思乡之情的一联是？", "a": "乡书何处达？\n归雁洛阳边。"}], "trans": [{"q": "客路青山外，行舟绿水前。", "a": "我要走的路还在青山之外，小船正行驶在碧绿的江水之上。"}, {"q": "潮平两岸阔，风正一帆悬。", "a": "潮水涨满，两岸之间显得格外宽阔；顺风行船，一面白帆高高地悬挂。"}, {"q": "海日生残夜，江春入旧年。", "a": "夜色还未褪尽，海上的红日已经升起；旧年尚未过去，江上已透出春意。"}, {"q": "乡书何处达？归雁洛阳边。", "a": "家信要送到哪里呢？希望北归的大雁把它带到洛阳边。"}], "book": "7a", "grade": "七年级上册", "id": 2}, {"title": "天净沙·秋思", "author": "马致远", "dynasty": "元", "genre": "曲", "source": "课内", "unit": "第一单元 第4课 古代诗歌四首", "text": "枯藤老树昏鸦，\n小桥流水人家，\n古道西风瘦马。\n夕阳西下，\n断肠人在天涯。", "theme": "以秋郊夕照图烘托天涯游子羁旅漂泊的孤寂凄凉与浓重的思乡之痛。", "notes": ["天净沙：曲牌名；秋思：题目，属散曲小令。", "昏鸦：黄昏时将要回巢的乌鸦。", "古道：已经荒废、不堪再用的古老驿道。", "断肠：形容悲痛到极点；天涯：远离家乡的地方。", "前三句纯用名词性词组白描，并置九种景物，被赞为“秋思之祖”。", "“小桥流水人家”以温馨恬静的画面反衬游子的孤苦，属以乐景写哀情。"], "dict": [{"q": "《天净沙·秋思》中并置九种景物、白描出一幅萧瑟苍凉的深秋晚景图的句子是？", "a": "枯藤老树昏鸦，\n小桥流水人家，\n古道西风瘦马。"}, {"q": "《天净沙·秋思》中以温馨恬静的乡村图景反衬游子漂泊之苦、属以乐景写哀情的一句是？", "a": "小桥流水人家"}, {"q": "《天净沙·秋思》中描写荒凉古道上秋风萧瑟、瘦马驮着游子的一句是？", "a": "古道西风瘦马。"}, {"q": "马致远在《天净沙·秋思》中点明时间、直抒天涯游子肝肠寸断的思乡之痛、被誉为全曲点睛之笔的句子是？", "a": "夕阳西下，\n断肠人在天涯。"}, {"q": "《天净沙·秋思》中直接揭示主旨、点出漂泊异乡、思念故乡的游子形象的一句是？", "a": "断肠人在天涯。"}], "trans": [{"q": "枯藤老树昏鸦，小桥流水人家，古道西风瘦马。", "a": "枯藤缠绕着老树，黄昏时乌鸦栖息枝头；小桥流水旁有几户人家；古道上西风里走着一匹瘦马。"}, {"q": "小桥流水人家，", "a": "小桥下溪水潺潺流淌，旁边坐落着几户人家。"}, {"q": "夕阳西下，", "a": "夕阳已经缓缓从西边落下，天色渐渐暗了下来。"}, {"q": "断肠人在天涯。", "a": "伤心断肠的游子，还独自漂泊在遥远的天涯。"}], "book": "7a", "grade": "七年级上册", "id": 3}, {"title": "咏雪", "author": "刘义庆", "dynasty": "南朝宋", "genre": "文言文", "source": "课内", "unit": "第二单元 第8课《世说新语》二则", "text": "谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。即公大兄无奕女，左将军王凝之妻也。", "theme": "记述谢家子侄咏雪联句的故事，表现谢道韫的聪慧才情与家庭生活的雅趣。", "notes": ["内集：把家里人聚集在一起。", "儿女：古义指子侄辈，今义指子女。", "俄而：不久，一会儿；骤：急。", "差可拟：大体可以相比；差，大体；拟，相比。", "未若：不如、不及；因：趁、乘。", "“柳絮”之喻妙在意蕴：既有形似又有神似，给人以春天将至的联想，故谢道韫被誉为“咏絮之才”。"], "dict": [{"q": "《咏雪》中交代咏雪的时间、地点、人物与事件的句子是？", "a": "谢太傅寒雪日内集，与儿女讲论文义。"}, {"q": "《咏雪》中谢太傅出的题目，即问纷纷白雪像什么的一句是？", "a": "白雪纷纷何所似？"}, {"q": "《咏雪》中谢朗（胡儿）以盐喻雪的比喻句是？", "a": "撒盐空中差可拟。"}, {"q": "《咏雪》中谢道韫以柳絮喻雪、被誉为千古咏雪名句的一句是？", "a": "未若柳絮因风起。"}, {"q": "《咏雪》结尾交代谢道韫身份、暗示作者对其才华赞赏的句子是？", "a": "即公大兄无奕女，左将军王凝之妻也。"}], "trans": [{"q": "谢太傅寒雪日内集，与儿女讲论文义。", "a": "谢太傅在一个寒冷的雪天把家里人聚集在一起，跟子侄辈讲解谈论文章的义理。"}, {"q": "俄而雪骤，公欣然曰：“白雪纷纷何所似？”", "a": "一会儿雪下得急了，太傅高兴地说：“这纷纷扬扬的白雪像什么呢？”"}, {"q": "撒盐空中差可拟。", "a": "把盐撒在空中，大体上可以拿来相比。"}, {"q": "未若柳絮因风起。", "a": "不如比作柳絮乘着风在空中漫天飞舞。"}, {"q": "即公大兄无奕女，左将军王凝之妻也。", "a": "她就是太傅大哥谢无奕的女儿，左将军王凝之的妻子。"}], "book": "7a", "grade": "七年级上册", "id": 4}, {"title": "陈太丘与友期行", "author": "刘义庆", "dynasty": "南朝宋", "genre": "文言文", "source": "课内", "unit": "第二单元 第8课《世说新语》二则", "text": "陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。", "theme": "记述七岁元方驳斥友人无信无礼的故事，表现其聪慧方正，倡导守信重礼。", "notes": ["期行：相约同行；期，约定。", "日中：正午时分；舍去：丢下（他）而离开。", "尊君：对别人父亲的尊称；家君：对人谦称自己的父亲。", "不：同“否”，句末语气词，表询问。", "委：舍弃；引：拉，牵拉；顾：回头看。", "元方以“无信”“无礼”两点据理反驳，层次分明，义正词严。"], "dict": [{"q": "《陈太丘与友期行》中交代陈太丘不再等候而离开、友人随后才到的句子是？", "a": "过中不至，太丘舍去，去后乃至。"}, {"q": "《陈太丘与友期行》中友人得知陈太丘已走后发怒，指责其“非人”的句子是？", "a": "非人哉！与人期行，相委而去。"}, {"q": "《陈太丘与友期行》中元方从“信”和“礼”两方面据理反驳友人的句子是？", "a": "日中不至，则是无信；对子骂父，则是无礼。"}, {"q": "《陈太丘与友期行》中写友人知错惭愧、下车示好，而元方头也不回径直入门的句子是？", "a": "友人惭，下车引之。元方入门不顾。"}], "trans": [{"q": "陈太丘与友期行，期日中。", "a": "陈太丘和朋友相约一同出行，约定的时间是正午。"}, {"q": "过中不至，太丘舍去，去后乃至。", "a": "过了正午朋友还没到，太丘就丢下他先走了，太丘走后朋友才来。"}, {"q": "客问元方：“尊君在不？”", "a": "客人问元方：“你父亲在家不在？”"}, {"q": "非人哉！与人期行，相委而去。", "a": "真不是人啊！和别人约好同行，却丢下我自己走了。"}, {"q": "日中不至，则是无信；对子骂父，则是无礼。", "a": "正午不到就是不讲信用，对着儿子骂父亲就是没有礼貌。"}, {"q": "友人惭，下车引之。元方入门不顾。", "a": "朋友感到惭愧，下车来拉元方，元方头也不回地走进门去。"}], "book": "7a", "grade": "七年级上册", "id": 5}, {"title": "《论语》十二章", "author": "孔子弟子及其再传弟子", "dynasty": "春秋", "genre": "文言文", "source": "课内", "unit": "第三单元 第11课《论语》十二章", "text": "子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”（《学而》）\n曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”（《学而》）\n子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”（《为政》）\n子曰：“温故而知新，可以为师矣。”（《为政》）\n子曰：“学而不思则罔，思而不学则殆。”（《为政》）\n子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”（《雍也》）\n子曰：“知之者不如好之者，好之者不如乐之者。”（《雍也》）\n子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”（《述而》）\n子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”（《述而》）\n子在川上曰：“逝者如斯夫，不舍昼夜。”（《子罕》）\n子曰：“三军可夺帅也，匹夫不可夺志也。”（《子罕》）\n子夏曰：“博学而笃志，切问而近思，仁在其中矣。”（《子张》）", "theme": "集中记录孔子及其弟子关于修身、为学、立志的言论，倡导勤学善思、安贫乐道、坚守志向。", "notes": ["说：同“悦”，愉快；愠：生气，恼怒。", "三省：多次进行自我检查；省，自我检查、反省。", "罔：迷惑，感到迷茫而无所适从；殆：疑惑。", "箪：古代盛饭用的圆形竹器；堪：能忍受。", "肱：胳膊上从肩到肘的部分，这里指胳膊；笃：坚定。", "“三人行，必有我师焉”强调虚心向他人学习、取长补短的学习态度。"], "dict": [{"q": "《论语》中阐述学习与思考辩证关系、指出二者不可偏废的名句是？", "a": "学而不思则罔，思而不学则殆。"}, {"q": "《论语》中强调复习旧知识能有新收获、凭此可以为师的一句是？", "a": "温故而知新，可以为师矣。"}, {"q": "《论语》中表达要虚心向周围人学习、择善而从、见不善而内自省的名句是？", "a": "三人行，必有我师焉。择其善者而从之，其不善者而改之。"}, {"q": "孔子在河边感叹时光流逝、劝人珍惜时间的句子是？", "a": "逝者如斯夫，不舍昼夜。"}, {"q": "《论语》中强调人应坚守志向、志向不可被强夺的名句是？", "a": "三军可夺帅也，匹夫不可夺志也。"}], "trans": [{"q": "学而时习之，不亦说乎？", "a": "学习了知识然后按时温习它，不也是很愉快吗？"}, {"q": "吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？", "a": "我每天多次反省自己：替人办事是否尽心？与朋友交往是否诚信？老师传授的知识是否温习？"}, {"q": "温故而知新，可以为师矣。", "a": "温习旧知识从而得到新的理解和体会，就可以凭这一点做老师了。"}, {"q": "学而不思则罔，思而不学则殆。", "a": "只读书却不思考就会迷茫无所得，只空想却不读书就会疑惑不解。"}, {"q": "三人行，必有我师焉。", "a": "几个人一起走路，其中一定有可以做我老师的人。"}, {"q": "逝者如斯夫，不舍昼夜。", "a": "时光像这流水一样消逝，日夜都不停息。"}], "book": "7a", "grade": "七年级上册", "id": 6}, {"title": "峨眉山月歌", "author": "李白", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "峨眉山月半轮秋，\n影入平羌江水流。\n夜发清溪向三峡，\n思君不见下渝州。", "theme": "写秋夜乘舟远行、月随江流的情景，抒发对故乡友人的思念与初次离蜀的眷恋。", "notes": ["半轮秋：半圆的秋月，即上弦月或下弦月。", "平羌：即青衣江，在峨眉山东北。", "清溪：即青溪驿，在今四川犍为；渝州：今重庆一带。", "全诗二十八字连用峨眉山、平羌、清溪、三峡、渝州五个地名而不见堆砌之痕。", "“思君”的“君”一说指月，一说指友人，以月寄情，构思精巧。"], "dict": [{"q": "李白《峨眉山月歌》中描写半轮秋月高悬、月影倒映并随江水流动的句子是？", "a": "峨眉山月半轮秋，\n影入平羌江水流。"}, {"q": "《峨眉山月歌》中写月影随江水流动、暗写舟行的一句是？", "a": "影入平羌江水流。"}, {"q": "《峨眉山月歌》中点明夜间出发、交代行程路线的一句是？", "a": "夜发清溪向三峡"}, {"q": "李白在《峨眉山月歌》中连用五个地名，抒发对友人（或故乡月）依依惜别之情的两句是？", "a": "夜发清溪向三峡，\n思君不见下渝州。"}, {"q": "《峨眉山月歌》中直抒思念之情、写行舟愈远而思念愈浓的一句是？", "a": "思君不见下渝州。"}], "trans": [{"q": "峨眉山月半轮秋，影入平羌江水流。", "a": "半轮秋月高悬在峨眉山头，月影倒映在平羌江中，随江水奔流。"}, {"q": "夜发清溪向三峡，思君不见下渝州。", "a": "夜里从清溪驿出发驶向三峡，思念你却见不到，只好顺江直下渝州。"}, {"q": "影入平羌江水流。", "a": "月亮的影子投入平羌江，随着江水缓缓地流淌。"}, {"q": "夜发清溪向三峡，", "a": "夜里从清溪驿出发，乘船奔向遥远的三峡。"}], "book": "7a", "grade": "七年级上册", "id": 7}, {"title": "江南逢李龟年", "author": "杜甫", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "岐王宅里寻常见，\n崔九堂前几度闻。\n正是江南好风景，\n落花时节又逢君。", "theme": "以江南暮春与故人重逢，寄寓对开元盛世的怀念与时代由盛转衰、身世飘零的深沉感慨。", "notes": ["李龟年：唐玄宗时著名乐师，深受玄宗赏识。", "岐王：唐玄宗之弟李范；崔九：崔涤，玄宗宠臣，殿中监。", "寻常：经常。", "落花时节：一语双关，既指暮春时节，又暗喻二人晚年飘零、唐王朝由盛转衰。", "全诗以乐景写哀情，二十八字蕴含深沉的今昔盛衰之叹。"], "dict": [{"q": "杜甫《江南逢李龟年》中追忆当年在岐王宅、崔九堂与李龟年频繁相见的诗句是？", "a": "岐王宅里寻常见，\n崔九堂前几度闻。"}, {"q": "《江南逢李龟年》中以江南暮春美景反衬乱离之悲、属以乐景写哀情的诗句是？", "a": "正是江南好风景，\n落花时节又逢君。"}, {"q": "《江南逢李龟年》中“落花时节”一语双关，既点明暮春时令，又暗喻二人晚年飘零与国运衰微的一句是？", "a": "落花时节又逢君。"}, {"q": "杜甫在诗中看似写江南风景依旧、实则暗含今昔沧桑巨变的一句是？", "a": "正是江南好风景"}], "trans": [{"q": "岐王宅里寻常见，崔九堂前几度闻。", "a": "当年在岐王的宅第里经常见到你，在崔九的厅堂前也多次听到你的歌声。"}, {"q": "正是江南好风景，落花时节又逢君。", "a": "如今正是江南风景美好的时节，在落花飘零的时候又与你相逢。"}, {"q": "岐王宅里寻常见，", "a": "从前在岐王的府第里，我常常能够见到你的身影。"}, {"q": "落花时节又逢君。", "a": "在这暮春落花纷纷的时节，我又与你意外重逢。"}], "book": "7a", "grade": "七年级上册", "id": 8}, {"title": "行军九日思长安故园", "author": "岑参", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "强欲登高去，\n无人送酒来。\n遥怜故园菊，\n应傍战场开。", "theme": "写重阳行军途中登高怀乡，寄托对国事的忧念、对饱受战乱之苦的人民的同情以及早日平乱的渴望。", "notes": ["九日：指农历九月初九重阳节。", "强：勉强，写出了行军途中过节的凄凉心境。", "送酒：化用陶渊明重阳日江州刺史王弘派人送酒的典故。", "遥怜：远远地怜惜；傍：靠近。", "“应傍战场开”为想象之辞，突破一般登高怀乡，寄托了忧国忧民之情。"], "dict": [{"q": "岑参《行军九日思长安故园》中写重阳节勉强登高、却无人送酒、暗寓军旅特殊环境的诗句是？", "a": "强欲登高去，\n无人送酒来。"}, {"q": "《行军九日思长安故园》中表现诗人勉强登高的一句是？", "a": "强欲登高去"}, {"q": "岑参在《行军九日思长安故园》中遥想故园菊花寂寞地开在战场旁，寄托对战乱中人民的同情和对早日平定安史之乱的渴望的诗句是？", "a": "遥怜故园菊，\n应傍战场开。"}, {"q": "《行军九日思长安故园》中以想象之笔、紧扣题目“行军”二字的一句是？", "a": "应傍战场开。"}], "trans": [{"q": "强欲登高去，无人送酒来。", "a": "勉强想要登高去赏菊，却没有人给我送酒来。"}, {"q": "遥怜故园菊，应傍战场开。", "a": "我在远方怜惜长安故园的菊花，它们大概正傍着战场寂寞地开放。"}, {"q": "无人送酒来。", "a": "没有人给我送来一壶消愁解闷的酒。"}, {"q": "遥怜故园菊，", "a": "我远远地怜惜着长安故园中那些菊花。"}], "book": "7a", "grade": "七年级上册", "id": 9}, {"title": "夜上受降城闻笛", "author": "李益", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "回乐烽前沙似雪，\n受降城外月如霜。\n不知何处吹芦管，\n一夜征人尽望乡。", "theme": "写登城闻笛的边塞夜景，抒发戍边将士浓重而急切的思乡之情。", "notes": ["回乐烽：烽火台名，在西受降城附近。", "受降城：唐时为防御突厥所筑，在今内蒙古境内。", "芦管：一种管乐器，笛子之类。", "前两句以“沙似雪”“月如霜”两个比喻写色，营造凄清冷寂的边塞氛围。", "“尽”字写尽征人无一例外、彻夜望乡的深重愁绪，末句为全诗点睛之笔。"], "dict": [{"q": "李益《夜上受降城闻笛》中运用比喻，把沙比作雪、把月色比作秋霜，营造凄清冷寂边塞氛围的诗句是？", "a": "回乐烽前沙似雪，\n受降城外月如霜。"}, {"q": "《夜上受降城闻笛》中写笛声飘忽不定、烘托诗人闻笛时迷惘心情的一句是？", "a": "不知何处吹芦管"}, {"q": "李益在《夜上受降城闻笛》中由芦笛声引发，写戍边将士无一例外彻夜望乡、点明主旨的诗句是？", "a": "不知何处吹芦管，\n一夜征人尽望乡。"}, {"q": "《夜上受降城闻笛》中一个“尽”字写尽征人思乡之深重急切的一句是？", "a": "一夜征人尽望乡。"}], "trans": [{"q": "回乐烽前沙似雪，受降城外月如霜。", "a": "回乐烽前的沙地白得像雪，受降城外的月色清冷如霜。"}, {"q": "不知何处吹芦管，一夜征人尽望乡。", "a": "不知从哪里吹起了芦笛，整夜里出征的将士都在遥望故乡。"}, {"q": "回乐烽前沙似雪，", "a": "回乐烽前的沙地在月光下白得像雪一样。"}, {"q": "一夜征人尽望乡。", "a": "整整一夜，出征的将士都在思念着家乡。"}], "book": "7a", "grade": "七年级上册", "id": 10}, {"title": "诫子书", "author": "诸葛亮", "dynasty": "三国", "genre": "文言文", "source": "课内", "unit": "第四单元 第15课 诫子书", "text": "夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！", "theme": "劝勉儿子修身养性、勤学立志要从淡泊宁静中下功夫，切忌怠惰险躁、虚度年华。", "notes": ["诫：告诫、劝勉；书：书信。", "淡泊：内心恬淡，不慕名利；无以：没有什么可以用来，没法。", "明志：明确志向；致远：达到远大目标。", "淫慢：放纵懈怠；励精：振奋精神。", "险躁：轻薄浮躁；治性：修养性情。", "穷庐：穷困潦倒之人住的陋室；全文以“静”字为核心，与“躁”字对比立论。"], "dict": [{"q": "《诫子书》中概括做人治学的经验、提出修身养德总纲的名句是？", "a": "静以修身，俭以养德。"}, {"q": "诸葛亮在《诫子书》中用双重否定句强调不恬淡寡欲就无法明确志向、不宁静专一就无法达到远大目标的千古名句是？", "a": "非淡泊无以明志，非宁静无以致远。"}, {"q": "《诫子书》中论述“才”“学”“志”三者关系，指出不学习无法增长才干、没有志向无法学有所成的句子是？", "a": "非学无以广才，非志无以成学。"}, {"q": "《诫子书》中从反面论述放纵懈怠与轻薄浮躁危害的句子是？", "a": "淫慢则不能励精，险躁则不能治性。"}, {"q": "《诫子书》中告诫儿子若虚度光阴、意志消沉，最终将悲守穷庐、追悔莫及的句子是？", "a": "年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！"}], "trans": [{"q": "静以修身，俭以养德。", "a": "用宁静专一来修养身心，用节俭朴素来培养品德。"}, {"q": "非淡泊无以明志，非宁静无以致远。", "a": "不内心恬淡就无法明确志向，不宁静专一就不能达到远大目标。"}, {"q": "非学无以广才，非志无以成学。", "a": "不学习就无法增长才干，没有志向就不能使学习有所成就。"}, {"q": "淫慢则不能励精，险躁则不能治性。", "a": "放纵懈怠就不能振奋精神，轻薄浮躁就不能修养性情。"}, {"q": "年与时驰，意与日去，遂成枯落，多不接世，", "a": "年华随同时光飞驰，意志随岁月消磨，最终凋落衰残，大多不能为社会所用。"}, {"q": "悲守穷庐，将复何及！", "a": "到那时悲哀地守着穷困的屋舍，再后悔又怎么来得及呢！"}], "book": "7a", "grade": "七年级上册", "id": 11}, {"title": "狼", "author": "蒲松龄", "dynasty": "清", "genre": "文言文", "source": "课内", "unit": "第五单元 第18课 狼", "text": "一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。\n屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。\n屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。\n少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。\n狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "theme": "写屠户由惧狼、御狼到奋起杀狼的故事，讽喻恶势力虽狡诈终将失败，赞颂人的机智勇敢。", "notes": ["止：仅，只；缀行甚远：紧跟着走了很远。", "窘：处境困迫，为难；敌：敌对，这里是胁迫、攻击的意思。", "苫蔽：覆盖、遮盖；弛：解除，卸下；眈眈：凶狠注视的样子。", "犬坐：像狗似的蹲坐，名词作状语；瞑：闭上眼睛；暇：从容、悠闲。", "洞：洞穴，这里用作动词，指挖洞；隧：通道，这里用作状语，意为“从通道”。", "黠：狡猾；变诈：巧变诡诈；末段议论点明主旨，嘲讽狼的狡诈。"], "dict": [{"q": "《狼》中交代故事起因、写屠户晚归遇狼并被两狼紧追不舍的句子是？", "a": "一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。"}, {"q": "《狼》中写屠户占据有利地形、与狼相持对峙的句子是？", "a": "屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。"}, {"q": "《狼》中描写前狼假装闭目悠闲、迷惑屠户的句子是？", "a": "久之，目似瞑，意暇甚。"}, {"q": "《狼》中揭示后狼在柴草堆中打洞、企图从背后偷袭屠户的句子是？", "a": "一狼洞其中，意将隧入以攻其后也。"}, {"q": "《狼》中点明主旨、嘲讽狼的狡诈不过徒增笑料的句子是？", "a": "狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。"}], "trans": [{"q": "途中两狼，缀行甚远。", "a": "路上遇到两只狼，紧跟着他走了很远的路。"}, {"q": "骨已尽矣，而两狼之并驱如故。", "a": "骨头已经扔完了，可两只狼仍然像原来一样一起追赶。"}, {"q": "屠大窘，恐前后受其敌。", "a": "屠户非常窘迫，担心身前身后都受到狼的攻击。"}, {"q": "少时，一狼径去，其一犬坐于前。", "a": "过了一会儿，一只狼径直走开，另一只像狗似的蹲坐在他面前。"}, {"q": "一狼洞其中，意将隧入以攻其后也。", "a": "另一只狼正在柴草堆里打洞，打算从通道钻进去攻击屠户的背后。"}, {"q": "狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "a": "狼也算狡猾了，可一会儿两只都被杀死，禽兽的诡诈手段能有多少呢？只是增添笑料罢了。"}], "book": "7a", "grade": "七年级上册", "id": 12}, {"title": "穿井得一人", "author": "《吕氏春秋》", "dynasty": "战国", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 寓言四则", "text": "宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏。丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。", "theme": "借穿井得人的讹传，告诫人们对待传闻不可轻信盲从，应审慎考察、实事求是。", "notes": ["穿：挖掘、开凿；溉汲：打水浇田；溉，浇灌；汲，从井里取水。", "及：待，等到；国人：指居住在国都中的人。", "道：讲述；闻之于宋君：向宋国国君报告，使宋君听到这件事。", "对：应答，回答。", "使：使唤，指劳力。", "末句“求闻之若此，不若无闻也”点明寓意：道听途说不如不听。"], "dict": [{"q": "《穿井得一人》中交代丁氏家因无水井而常需一人在外打水浇田的句子是？", "a": "家无井而出溉汲，常一人居外。"}, {"q": "《穿井得一人》中写国人争相传说、最终惊动国君的句子是？", "a": "国人道之，闻之于宋君。"}, {"q": "《穿井得一人》中丁氏澄清传闻、说明真相的句子是？", "a": "得一人之使，非得一人于井中也。"}, {"q": "《穿井得一人》中点明寓意、告诫人们轻信传闻不如不听的句子是？", "a": "求闻之若此，不若无闻也。"}], "trans": [{"q": "家无井而出溉汲，常一人居外。", "a": "家里没有水井，要出门去打水浇田，常常有一个人住在外面。"}, {"q": "及其家穿井，告人曰：“吾穿井得一人。”", "a": "等到他家挖了井，告诉别人说：“我家挖井得到了一个人。”"}, {"q": "国人道之，闻之于宋君。", "a": "国都的人都在谈论这件事，被宋国国君听到了。"}, {"q": "宋君令人问之于丁氏。", "a": "宋国国君派人向丁家询问这件事。"}, {"q": "得一人之使，非得一人于井中也。", "a": "是得到了一个人的劳力，并不是在井里挖出了一个人。"}, {"q": "求闻之若此，不若无闻也。", "a": "像这样听信传闻，还不如什么都没有听到。"}], "book": "7a", "grade": "七年级上册", "id": 13}, {"title": "杞人忧天", "author": "《列子》", "dynasty": "战国", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 寓言四则", "text": "杞国有人忧天地崩坠，身亡所寄，废寝食者。\n又有忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”\n其人曰：“天果积气，日月星宿，不当坠耶？”\n晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”\n其人曰：“奈地坏何？”\n晓之者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？”\n其人舍然大喜，晓之者亦舍然大喜。", "theme": "借杞人忧天地崩坠的故事，讽刺不必要的忧虑，也启发人以理性认识消除无谓的恐惧。", "notes": ["崩坠：崩塌坠落；身亡所寄：自己无处容身；亡，无，没有。", "晓：告知，开导；积气：聚积的气体。", "若：你；行止：行动，活动。", "只使：即使；中伤：伤害。", "四虚：四方；躇步跐蹈：这四个字都是踩、踏的意思。", "舍然：消除疑虑的样子；舍，同“释”，解除、消除。"], "dict": [{"q": "《杞人忧天》中写杞人担忧天地崩塌、无处容身而寝食不安的句子是？", "a": "杞国有人忧天地崩坠，身亡所寄，废寝食者。"}, {"q": "《杞人忧天》中开导者以天为聚积的气体、人的呼吸行动都在其中，说明天不会崩坠的句子是？", "a": "天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？"}, {"q": "《杞人忧天》中开导者说明日月星宿即使坠落也不会伤人的句子是？", "a": "日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。"}, {"q": "《杞人忧天》中开导者以地为聚积的土块、充满四方，说明地不会塌陷的句子是？", "a": "地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？"}, {"q": "《杞人忧天》中写杞人与开导者疑虑尽释、皆大欢喜的句子是？", "a": "其人舍然大喜，晓之者亦舍然大喜。"}], "trans": [{"q": "杞国有人忧天地崩坠，身亡所寄，废寝食者。", "a": "杞国有个人担忧天会塌地会陷，自己无处存身，因而睡不着觉吃不下饭。"}, {"q": "天，积气耳，亡处亡气。", "a": "天不过是聚积的气体罢了，没有一个地方没有气体。"}, {"q": "若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？", "a": "你一屈一伸一呼一吸，整天都在天中活动，为什么还要担心天塌下来呢？"}, {"q": "日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。", "a": "日月星辰也是气体中发光的东西，即使掉下来，也不会伤着什么。"}, {"q": "地，积块耳，充塞四虚，亡处亡块。", "a": "地不过是聚积的土块罢了，填满了四方的空虚之处，没有一处没有土块。"}, {"q": "其人舍然大喜，晓之者亦舍然大喜。", "a": "那个杞国人消除了疑虑非常高兴，开导他的人也放下心来非常高兴。"}], "book": "7a", "grade": "七年级上册", "id": 14}, {"title": "秋词（其一）", "author": "刘禹锡", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "自古逢秋悲寂寥，\n我言秋日胜春朝。\n晴空一鹤排云上，\n便引诗情到碧霄。", "theme": "一反前人悲秋传统，热情赞美秋日的爽朗明丽，抒发豪迈乐观、奋发进取的情怀。", "notes": ["寂寥：冷清萧条。", "春朝：春天；朝，早晨，这里指春天。", "排：推开、冲破，写出孤鹤搏击长空的矫健气势。", "碧霄：蓝天。", "诗人以“鹤”自喻，托物言志，表现不屈不挠、昂扬向上的精神。", "与马致远《天净沙·秋思》的悲秋形成鲜明对比，属议论兼抒情。"], "dict": [{"q": "刘禹锡《秋词（其一）》中一反前人悲秋传统、直抒胸臆赞美秋天胜过春天的诗句是？", "a": "自古逢秋悲寂寥，\n我言秋日胜春朝。"}, {"q": "《秋词（其一）》中表达诗人“秋日胜春朝”这一独到见解的一句是？", "a": "我言秋日胜春朝。"}, {"q": "刘禹锡在《秋词（其一）》中借一只白鹤排云直上、冲霄而起的形象，抒发豪迈乐观情怀与昂扬诗情的名句是？", "a": "晴空一鹤排云上，\n便引诗情到碧霄。"}, {"q": "《秋词（其一）》中“排”字写出白鹤推开云层、矫健凌厉气势的一句是？", "a": "晴空一鹤排云上"}], "trans": [{"q": "自古逢秋悲寂寥，我言秋日胜春朝。", "a": "自古以来文人一到秋天就悲叹寂寥，我却说秋天远远胜过春天的早晨。"}, {"q": "晴空一鹤排云上，便引诗情到碧霄。", "a": "万里晴空中一只白鹤推开云层直上，把我的诗情也带到了碧蓝的云霄。"}, {"q": "我言秋日胜春朝。", "a": "我却要说秋天的景色远胜过明媚的春天。"}, {"q": "晴空一鹤排云上，", "a": "晴朗的天空中，一只白鹤推开云层向上奋飞。"}], "book": "7a", "grade": "七年级上册", "id": 15}, {"title": "夜雨寄北", "author": "李商隐", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "君问归期未有期，\n巴山夜雨涨秋池。\n何当共剪西窗烛，\n却话巴山夜雨时。", "theme": "写秋雨之夜羁旅巴山、归期无定的孤寂，抒发对远方亲友的深切思念与对团聚的期盼。", "notes": ["寄北：寄给北方（或指在北方的妻子）的诗。", "巴山：泛指巴蜀一带的山。", "秋池：秋天的池塘；涨秋池既写实景，又暗喻愁思绵绵。", "何当：何时将要；却话：回头说，追述。", "“巴山夜雨”两次出现，虚实相生、时空交错，构成回环往复之美。", "后两句由实写转入想象中的未来重逢，属虚写。"], "dict": [{"q": "李商隐《夜雨寄北》中写归期未定、秋雨绵绵涨满池塘，烘托羁旅孤寂与绵绵愁思的诗句是？", "a": "君问归期未有期，\n巴山夜雨涨秋池。"}, {"q": "《夜雨寄北》中以秋雨涨池的实景暗喻诗人愁思深重的一句是？", "a": "巴山夜雨涨秋池。"}, {"q": "李商隐在《夜雨寄北》中跨越时空、想象来日西窗剪烛、共话今宵思念之苦的名句是？", "a": "何当共剪西窗烛，\n却话巴山夜雨时。"}, {"q": "《夜雨寄北》中写诗人设想未来重逢、再叙今日巴山夜雨相思情景的一句是？", "a": "却话巴山夜雨时。"}], "trans": [{"q": "君问归期未有期，巴山夜雨涨秋池。", "a": "你问我回家的日子，我却还没有定下归期，今夜巴山的秋雨已涨满了池塘。"}, {"q": "何当共剪西窗烛，却话巴山夜雨时。", "a": "什么时候才能和你一起在西窗下剪烛夜谈，再叙说今夜巴山夜雨的情景。"}, {"q": "君问归期未有期，", "a": "你问我何时才能回去，归期还没有确定下来。"}, {"q": "巴山夜雨涨秋池。", "a": "今夜巴山秋雨绵绵，已经涨满了这秋天的池塘。"}], "book": "7a", "grade": "七年级上册", "id": 16}, {"title": "十一月四日风雨大作（其二）", "author": "陆游", "dynasty": "宋", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "僵卧孤村不自哀，\n尚思为国戍轮台。\n夜阑卧听风吹雨，\n铁马冰河入梦来。", "theme": "写诗人年老闲居孤村却仍心系边关，借风雨入梦抒写渴望杀敌报国的赤诚爱国情怀。", "notes": ["僵卧：躺卧不起，形容老病；不自哀：不为自己哀伤。", "戍：守卫；轮台：古地名，在今新疆境内，汉代边防重地，此代指边关。", "夜阑：夜深，夜将尽。", "铁马：披着铁甲的战马；冰河：冰封的河流，泛指北方战场。", "“僵卧孤村”与“尚思为国”形成强烈对比，突出诗人不以己悲、心忧国事的胸襟。", "全诗由现实的风雨自然过渡到梦中的战场，虚实结合。"], "dict": [{"q": "陆游《十一月四日风雨大作（其二）》中写自己虽年老体衰、困居孤村却不为自身哀伤，仍想着为国戍边的诗句是？", "a": "僵卧孤村不自哀，\n尚思为国戍轮台。"}, {"q": "《十一月四日风雨大作（其二）》中表现诗人不以己悲、心忧国事的一句是？", "a": "尚思为国戍轮台。"}, {"q": "陆游在诗中由深夜听到的风雨之声联想到战场，借梦境抒写杀敌报国壮志的诗句是？", "a": "夜阑卧听风吹雨，\n铁马冰河入梦来。"}, {"q": "《十一月四日风雨大作（其二）》中将现实风雨与梦中战场自然勾连的一句是？", "a": "夜阑卧听风吹雨"}], "trans": [{"q": "僵卧孤村不自哀，尚思为国戍轮台。", "a": "我僵直地躺在孤寂的乡村里并不为自己悲哀，还想为国家守卫轮台边关。"}, {"q": "夜阑卧听风吹雨，铁马冰河入梦来。", "a": "夜深了躺在床上听那风吹雨打的声音，披甲的战马和冰封的河流闯入梦中。"}, {"q": "僵卧孤村不自哀，", "a": "我年老体衰卧在孤寂的村庄里，并不为自己感到悲哀。"}, {"q": "铁马冰河入梦来。", "a": "披着铁甲的战马和冰封的河流，都闯进了我的梦境。"}], "book": "7a", "grade": "七年级上册", "id": 17}, {"title": "潼关", "author": "谭嗣同", "dynasty": "清", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "终古高云簇此城，\n秋风吹散马蹄声。\n河流大野犹嫌束，\n山入潼关不解平。", "theme": "描绘潼关一带雄浑壮阔的山河气象，折射诗人冲决一切罗网、追求个性解放的少年意气。", "notes": ["终古：久远，自古以来；簇：簇拥、聚集。", "河流：指奔腾而过的黄河；大野：辽阔的原野。", "束：束缚、拘束；不解平：不知道什么是平坦。", "“犹嫌束”“不解平”用拟人手法，赋予黄河、群山以人的情感与意志。", "全诗托物言志，是诗人十八岁时所作，洋溢着傲岸不羁、勇于进取的豪情。"], "dict": [{"q": "谭嗣同《潼关》中描写高云自古簇拥着险峻关城、秋风里传来哒哒马蹄声的诗句是？", "a": "终古高云簇此城，\n秋风吹散马蹄声。"}, {"q": "《潼关》中写潼关历史悠久、自古为雄关的一句是？", "a": "终古高云簇此城"}, {"q": "谭嗣同在《潼关》中运用拟人手法，写黄河奔涌原野仍嫌受束缚、群山入关更不知平坦，寄寓冲决一切罗网的少年意气的名句是？", "a": "河流大野犹嫌束，\n山入潼关不解平。"}, {"q": "《潼关》中以“犹嫌束”赋予黄河人的情感、表现其不甘束缚的一句是？", "a": "河流大野犹嫌束"}], "trans": [{"q": "终古高云簇此城，秋风吹散马蹄声。", "a": "自古至今高高的云团簇拥着这座城，秋风把清脆的马蹄声吹得四散飘远。"}, {"q": "河流大野犹嫌束，山入潼关不解平。", "a": "黄河在广阔的原野上奔流还嫌受束缚，群山一入潼关便再也不知什么是平坦。"}, {"q": "秋风吹散马蹄声。", "a": "一阵秋风把清脆的马蹄声吹得无影无踪。"}, {"q": "河流大野犹嫌束，", "a": "黄河奔流在广阔的原野上，还嫌河床把它束缚得太紧。"}], "book": "7a", "grade": "七年级上册", "id": 18}, {"title": "孙权劝学", "author": "司马光（选自《资治通鉴》）", "dynasty": "北宋", "genre": "文言文", "source": "课内", "unit": "第一单元 第4课 孙权劝学", "text": "初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”蒙乃始就学。\n及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。", "theme": "记孙权劝吕蒙读书而吕蒙学有所成，说明读书学习大有长进，勉励后学。", "notes": ["当涂：当道，当权；辞：推托；务：事务", "博士：专掌经学传授的学官；邪：语气词，同“耶”", "涉猎：粗略地阅读；见往事：了解历史", "才略：才干和谋略；刮目相待：用新的眼光看待", "成语：吴下阿蒙、刮目相待", "写法：以对话为主，寥寥数语见人物性格，以鲁肃叹服侧面烘托"], "dict": [{"q": "《孙权劝学》中孙权指出吕蒙身居要职、不可不学的句子是：", "a": "卿今当涂掌事，不可不学！"}, {"q": "文中表明孙权劝学的目的并非要吕蒙钻研经书做博士，只是粗略阅读、了解历史的句子：", "a": "但当涉猎，见往事耳。"}, {"q": "孙权以自身为例，说明读书大有好处的句子是：", "a": "孤常读书，自以为大有所益。"}, {"q": "文中鲁肃赞叹吕蒙才略大进、已不再是当年吴下阿蒙的句子：", "a": "卿今者才略，非复吴下阿蒙！"}, {"q": "成语“刮目相待”出自文中吕蒙的答语：", "a": "士别三日，即更刮目相待，大兄何见事之晚乎！"}], "trans": [{"q": "卿今当涂掌事，不可不学！", "a": "你现在当权掌管事务，不可以不读书学习！"}, {"q": "蒙辞以军中多务。", "a": "吕蒙用军营里事务繁多来加以推辞。"}, {"q": "孤岂欲卿治经为博士邪！但当涉猎，见往事耳。", "a": "我难道要你研究儒家经典成为博士吗！只是应当粗略阅读，了解历史罢了。"}, {"q": "孤常读书，自以为大有所益。", "a": "我经常读书，自己觉得大有好处。"}, {"q": "卿今者才略，非复吴下阿蒙！", "a": "你如今的才干和谋略，不再是当年那个吴下的阿蒙了！"}, {"q": "士别三日，即更刮目相待，大兄何见事之晚乎！", "a": "读书人分别几天，就要用新的眼光看待他，长兄你认清事物怎么这么晚呢！"}], "book": "7b", "grade": "七年级下册", "id": 19}, {"title": "木兰诗", "author": "佚名（选自《乐府诗集》）", "dynasty": "南北朝", "genre": "民歌", "source": "课内", "unit": "第二单元 第9课 木兰诗", "text": "唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。\n东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。\n归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。\n爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？", "theme": "叙木兰女扮男装代父从军、征战十年、辞官还乡之事，歌颂其孝勇与不慕荣利。", "notes": ["当户织：对着门织布；机杼：织布机；唯：只", "军帖：军中文告；可汗：古代西北民族对君主的称呼；市：买", "鞍鞯：马鞍及垫子；辔头：嚼子和缰绳；戎机：战事", "朔气传金柝：北风中传来打更声；铁衣：铠甲", "策勋十二转：记功很多次（策勋，记功；转，勋位升一等）", "互文、对偶、排比、顶真等民歌手法；“扑朔迷离”出处"], "dict": [{"q": "《木兰诗》中描写木兰出征前紧张、周密准备的排比句是：", "a": "东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。"}, {"q": "诗中写木兰奔赴战场、行军神速（夸张）的诗句：", "a": "万里赴戎机，关山度若飞。"}, {"q": "诗中描写边塞军营苦寒、烘托木兰勇敢坚强的名句：", "a": "朔气传金柝，寒光照铁衣。"}, {"q": "诗中概述战争旷日持久、战斗激烈悲壮（互文）的名句：", "a": "将军百战死，壮士十年归。"}, {"q": "诗中表现木兰不慕功名富贵、只愿回乡的句子：", "a": "可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。"}, {"q": "成语“扑朔迷离”出自篇末的妙喻句是：", "a": "雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？"}], "trans": [{"q": "万里赴戎机，关山度若飞。", "a": "不远万里奔赴战场，像飞一样跨过一道道关塞山岭。"}, {"q": "朔气传金柝，寒光照铁衣。", "a": "北方的寒气传送着打更的声音，清冷的月光映照在将士的铠甲上。"}, {"q": "将军百战死，壮士十年归。", "a": "将军和壮士身经百战，有的为国战死，有的多年之后凯旋归来。"}, {"q": "当窗理云鬓，对镜帖花黄。", "a": "对着窗户梳理柔美的鬓发，照着镜子在额头上贴好花黄。"}, {"q": "雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？", "a": "雄兔前脚时时动弹，雌兔双眼时常眯着；两只兔子贴地奔跑时，怎能分辨出我是雄是雌呢？"}], "book": "7b", "grade": "七年级下册", "id": 20}, {"title": "卖油翁", "author": "欧阳修", "dynasty": "北宋", "genre": "文言文", "source": "课内", "unit": "第三单元 第13课 卖油翁", "text": "陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。\n康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。", "theme": "借陈尧咨射箭与卖油翁酌油之事，说明熟能生巧，告诫人不可恃技自矜。", "notes": ["自矜：自夸；圃：园子；释担：放下担子", "睨：斜着眼看，不在意的样子；颔：点头", "忿然：气愤的样子；安：怎么；轻：轻视", "覆：盖；徐：慢慢地；沥：下滴；遣：打发", "尔：同“耳”，相当于“罢了”；成语：熟能生巧", "写法：对比衬托，先抑后扬，以小事明大理"], "dict": [{"q": "文中写陈尧咨因善射而自夸的句子：", "a": "陈康肃公善射，当世无双，公亦以此自矜。"}, {"q": "文中写卖油翁对陈尧咨射技只略表赞许的句子：", "a": "见其发矢十中八九，但微颔之。"}, {"q": "文中描写卖油翁自钱孔沥油而钱不湿、技艺高超的句子：", "a": "乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。"}, {"q": "文中揭示全文主旨（熟能生巧）的句子：", "a": "我亦无他，惟手熟尔。"}], "trans": [{"q": "陈康肃公善射，当世无双，公亦以此自矜。", "a": "陈康肃公擅长射箭，当世没有第二个人能比，他也因此自夸。"}, {"q": "有卖油翁释担而立，睨之久而不去。", "a": "有个卖油的老翁放下担子站着，斜着眼睛看他射箭，很久都不离开。"}, {"q": "见其发矢十中八九，但微颔之。", "a": "老翁见他射出的箭十支能中八九支，只是微微点了点头。"}, {"q": "康肃忿然曰：“尔安敢轻吾射！”", "a": "康肃公气愤地说：“你怎么敢轻视我射箭的本领！”"}, {"q": "徐以杓酌油沥之，自钱孔入，而钱不湿。", "a": "慢慢地用勺子舀油往葫芦里滴，油从铜钱的小孔进去，铜钱却没有被沾湿。"}, {"q": "我亦无他，惟手熟尔。", "a": "我也没有别的奥妙，只不过是手法熟练罢了。"}], "book": "7b", "grade": "七年级下册", "id": 21}, {"title": "竹里馆", "author": "王维", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "独坐幽篁里，弹琴复长啸。\n深林人不知，明月来相照。", "theme": "写月夜独坐竹林弹琴长啸，表现清幽绝俗、宁静淡泊的隐逸情怀。", "notes": ["幽篁：幽深的竹林；长啸：撮口发出清脆悠长的声音", "深林：幽深的竹林；相照：相伴照耀（“相”偏指一方）", "以动衬静：弹琴、长啸之声反衬竹林的幽静", "情景交融，意境清幽，体现“诗中有画”", "名句“深林人不知，明月来相照”写明月似解人意，传达孤高"], "dict": [{"q": "《竹里馆》中写诗人独坐幽深竹林、弹琴长啸的诗句：", "a": "独坐幽篁里，弹琴复长啸。"}, {"q": "诗中用“弹琴”“长啸”之声反衬竹林幽静（以动衬静）的诗句：", "a": "独坐幽篁里，弹琴复长啸。"}, {"q": "诗中写夜深人寂、唯有明月相伴，表现诗人宁静淡泊心境的名句：", "a": "深林人不知，明月来相照。"}, {"q": "王维《竹里馆》中写诗人隐居生活中孤独却不寂寞的诗句：", "a": "深林人不知，明月来相照。"}], "trans": [{"q": "独坐幽篁里，弹琴复长啸。", "a": "我独自坐在幽深的竹林里，一边弹琴一边高声长啸。"}, {"q": "深林人不知，明月来相照。", "a": "幽深的竹林里没有人知道我，只有明亮的月光来照耀我。"}, {"q": "独坐幽篁里，", "a": "我一个人静坐在幽深寂静的竹林之中。"}, {"q": "明月来相照。", "a": "只有那天上的明月，来与我相伴相照。"}], "book": "7b", "grade": "七年级下册", "id": 22}, {"title": "春夜洛城闻笛", "author": "李白", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "谁家玉笛暗飞声，散入春风满洛城。\n此夜曲中闻折柳，何人不起故园情。", "theme": "写春夜闻笛而动乡思，抒发客居洛阳的游子对故乡的深切思念。", "notes": ["玉笛：精美的笛；暗飞声：笛声不知不觉传来", "满洛城：夸张，写笛声随春风传遍全城", "折柳：指《折杨柳》曲，古人折柳送别，寓惜别怀远之意", "故园：故乡，家乡", "全诗紧扣“闻”字，由景入情，想象与夸张并用"], "dict": [{"q": "诗中写不知谁家笛声随春风传遍洛阳城（夸张）的诗句：", "a": "谁家玉笛暗飞声，散入春风满洛城。"}, {"q": "诗中由听觉写笛声悄然而起、营造迷离氛围的句子：", "a": "谁家玉笛暗飞声，散入春风满洛城。"}, {"q": "诗中点出《折杨柳》曲、引出思乡之情的句子：", "a": "此夜曲中闻折柳，何人不起故园情。"}, {"q": "李白《春夜洛城闻笛》中以反问语气抒发游子思乡之情的名句：", "a": "此夜曲中闻折柳，何人不起故园情。"}], "trans": [{"q": "谁家玉笛暗飞声，散入春风满洛城。", "a": "是谁家的玉笛暗暗传出悠扬的笛声，随着春风飘散传遍了整个洛阳城。"}, {"q": "此夜曲中闻折柳，何人不起故园情。", "a": "今夜听到这支《折杨柳》的曲子，谁能不涌起思念故乡的情感呢？"}, {"q": "散入春风满洛城。", "a": "笛声随着春风飘散，传遍了洛阳城的每一个角落。"}, {"q": "何人不起故园情。", "a": "又有谁不会因此涌起思念故乡的情怀呢？"}], "book": "7b", "grade": "七年级下册", "id": 23}, {"title": "逢入京使", "author": "岑参", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "故园东望路漫漫，双袖龙钟泪不干。\n马上相逢无纸笔，凭君传语报平安。", "theme": "写赴边途中偶遇京使托其传语报平安，抒发思乡与报国难以两全之情。", "notes": ["故园：指诗人在长安的家；漫漫：路途遥远的样子", "龙钟：泪流纵横的样子（沾湿的样子）", "凭：请求、烦劳；传语：捎口信", "无纸笔：写不成书信，只好口头相托", "语言质朴，脱口而成，感情真挚"], "dict": [{"q": "诗中写回望长安家园、路途遥远、泪水沾湿双袖的诗句：", "a": "故园东望路漫漫，双袖龙钟泪不干。"}, {"q": "诗中夸张地写思乡之泪流淌不止的句子：", "a": "双袖龙钟泪不干。"}, {"q": "诗中写途中仓促相逢、无纸笔写信，只好口头相托的诗句：", "a": "马上相逢无纸笔，凭君传语报平安。"}, {"q": "岑参《逢入京使》中表达思念亲人又不愿让亲人挂念的复杂情感的名句：", "a": "马上相逢无纸笔，凭君传语报平安。"}], "trans": [{"q": "故园东望路漫漫，双袖龙钟泪不干。", "a": "回头向东遥望故乡，路途遥远漫长，两只衣袖被泪水打湿还没有干。"}, {"q": "马上相逢无纸笔，凭君传语报平安。", "a": "在马上与你相逢没有纸和笔，只好请你捎个口信向家人报个平安。"}, {"q": "故园东望路漫漫，", "a": "向东遥望长安故园，路途是那样遥远漫长。"}, {"q": "凭君传语报平安。", "a": "就拜托你捎句话回去，向家人报告我一切平安。"}], "book": "7b", "grade": "七年级下册", "id": 24}, {"title": "晚春", "author": "韩愈", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "草树知春不久归，百般红紫斗芳菲。\n杨花榆荚无才思，惟解漫天作雪飞。", "theme": "借草木争春、杨花榆荚漫天飞舞写惜春之情，蕴含惜时进取的意趣。", "notes": ["不久归：即将结束；芳菲：花草的芳香", "杨花：柳絮；榆荚：榆钱；才思：才气、才情", "惟解：只知道；作雪飞：像雪花一样漫天飞舞", "拟人手法：草木“知”“斗”“解”", "杨花榆荚虽无芬芳仍尽情飞舞，寓意平凡者亦当珍惜春光"], "dict": [{"q": "诗中用拟人手法写草木知春将归、争相绽放的诗句：", "a": "草树知春不久归，百般红紫斗芳菲。"}, {"q": "诗中写暮春百花争奇斗艳、挽留春天的句子：", "a": "草树知春不久归，百般红紫斗芳菲。"}, {"q": "诗中写杨花榆荚虽无才情却也化作飞雪尽情飞舞的诗句：", "a": "杨花榆荚无才思，惟解漫天作雪飞。"}, {"q": "诗中借“杨花榆荚”告诉人们即便平凡也应珍惜大好时光的句子：", "a": "杨花榆荚无才思，惟解漫天作雪飞。"}], "trans": [{"q": "草树知春不久归，百般红紫斗芳菲。", "a": "花草树木知道春天即将归去，都争着开出万紫千红的花朵争芳斗艳。"}, {"q": "杨花榆荚无才思，惟解漫天作雪飞。", "a": "就连那没有才思的杨花和榆钱，也只知道像雪花一样漫天飞舞。"}, {"q": "百般红紫斗芳菲。", "a": "各种花儿争相开放，万紫千红竞相吐露芬芳。"}, {"q": "惟解漫天作雪飞。", "a": "只知道化作雪花漫天飞舞，来装点这即将逝去的晚春。"}], "book": "7b", "grade": "七年级下册", "id": 25}, {"title": "陋室铭", "author": "刘禹锡", "dynasty": "唐", "genre": "文言文", "source": "课内", "unit": "第四单元 第17课 短文两篇·陋室铭", "text": "山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？", "theme": "借“陋室不陋”抒写安贫乐道、高洁傲岸的情操与不慕名利的生活态度。", "notes": ["名：出名，有名；灵：灵验", "德馨：品德高尚（馨，香气，此指品德高尚）", "鸿儒：博学的人；白丁：平民，此指没有学问的人", "调素琴：弹琴；金经：指佛经", "丝竹：弦乐、管乐，代指世俗乐曲；案牍：官府文书；劳形：使身体劳累", "托物言志，比兴开头，以诸葛庐、子云亭类比"], "dict": [{"q": "《陋室铭》中统领全篇、点明陋室不陋原因的主旨句：", "a": "斯是陋室，惟吾德馨。"}, {"q": "文中描写陋室环境清幽的句子：", "a": "苔痕上阶绿，草色入帘青。"}, {"q": "文中表现室主人交往之雅、往来皆博学之士的句子：", "a": "谈笑有鸿儒，往来无白丁。"}, {"q": "文中从反面写主人不受世俗音乐与官场公务搅扰的句子：", "a": "无丝竹之乱耳，无案牍之劳形。"}, {"q": "文末引孔子之言作结、画龙点睛的句子：", "a": "孔子云：何陋之有？"}], "trans": [{"q": "山不在高，有仙则名。水不在深，有龙则灵。", "a": "山不一定要高，有仙人居住就出名了；水不一定要深，有龙就显出灵验了。"}, {"q": "斯是陋室，惟吾德馨。", "a": "这是简陋的屋舍，只因我的品德美好，就不觉得简陋了。"}, {"q": "苔痕上阶绿，草色入帘青。", "a": "苔痕蔓延到台阶上，使台阶一片碧绿；草色映入竹帘，使室内染上青色。"}, {"q": "谈笑有鸿儒，往来无白丁。", "a": "谈笑往来的都是博学的人，没有一个是没什么学问的平民。"}, {"q": "无丝竹之乱耳，无案牍之劳形。", "a": "没有世俗的乐曲扰乱双耳，没有官府的公文使身体劳累。"}, {"q": "孔子云：何陋之有？", "a": "孔子说过：君子住在这里，又有什么简陋的呢？"}], "book": "7b", "grade": "七年级下册", "id": 26}, {"title": "爱莲说", "author": "周敦颐", "dynasty": "北宋", "genre": "文言文", "source": "课内", "unit": "第四单元 第17课 短文两篇·爱莲说", "text": "水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。\n予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣！", "theme": "借赞美莲的高洁品格，表达洁身自好、不与世俗同流合污的君子之志。", "notes": ["蕃：多；濯：洗；妖：美丽而不端庄", "不蔓不枝：不横生藤蔓，不旁生枝茎；益：更加", "亭亭净植：洁净地挺立；亵玩：靠近赏玩（亵，亲近而不庄重）", "隐逸：隐居避世；鲜：少；宜：应当", "托物言志，以菊正衬、以牡丹反衬莲", "“出淤泥而不染”常用来赞美人不同流合污"], "dict": [{"q": "文中写莲出于污泥而不被污染、经清水洗涤而不妖艳（生长环境）的名句：", "a": "出淤泥而不染，濯清涟而不妖"}, {"q": "文中写莲通达正直、不攀附（体态）的句子：", "a": "中通外直，不蔓不枝"}, {"q": "文中写莲香气远播、洁净挺立、只可远观的句子：", "a": "香远益清，亭亭净植，可远观而不可亵玩焉。"}, {"q": "《爱莲说》中高度概括莲的品格、点明主旨的句子：", "a": "莲，花之君子者也。"}, {"q": "文末慨叹与作者同好者稀少、世人追逐富贵者众多的句子：", "a": "莲之爱，同予者何人？牡丹之爱，宜乎众矣！"}], "trans": [{"q": "水陆草木之花，可爱者甚蕃。", "a": "水上陆地上各种草木的花，值得喜爱的非常多。"}, {"q": "出淤泥而不染，濯清涟而不妖，", "a": "从淤泥里生长出来却不被沾染，经过清水洗涤却不显得妖艳，"}, {"q": "中通外直，不蔓不枝，香远益清，亭亭净植，", "a": "茎中间贯通外形挺直，不生藤蔓不长枝节，香气远播越发清芬，笔直洁净地立在水中，"}, {"q": "可远观而不可亵玩焉。", "a": "可以在远处观赏，却不能靠近去轻慢地玩弄它啊。"}, {"q": "莲之爱，同予者何人？", "a": "对于莲花的喜爱，像我一样的还有什么人呢？"}, {"q": "牡丹之爱，宜乎众矣！", "a": "对于牡丹的喜爱，那当然是有很多人了！"}], "book": "7b", "grade": "七年级下册", "id": 27}, {"title": "登幽州台歌", "author": "陈子昂", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第五单元 第21课 古代诗歌五首·登幽州台歌", "text": "前不见古人，后不见来者。\n念天地之悠悠，独怆然而涕下！", "theme": "登台远眺，感叹天地无穷而人生有限，抒发怀才不遇、孤独悲怆之情。", "notes": ["古人：古代礼贤下士的贤君；来者：后世的贤明君主", "悠悠：形容时间的久远和空间的广大", "怆然：悲伤的样子；涕：眼泪", "直抒胸臆，古今对比、天地对比，意境苍凉", "语言苍劲古朴，句式长短错落"], "dict": [{"q": "《登幽州台歌》中表达诗人生不逢时、怀才不遇的诗句：", "a": "前不见古人，后不见来者。"}, {"q": "诗中写诗人独立于悠悠天地之间、孤独落泪的名句：", "a": "念天地之悠悠，独怆然而涕下！"}, {"q": "诗中写空间辽阔、抒发悲哀苦闷心情的诗句：", "a": "念天地之悠悠，独怆然而涕下！"}, {"q": "屈原《远游》“惟天地之无穷兮，哀人生之长勤”与本诗意境相似的诗句：", "a": "念天地之悠悠，独怆然而涕下！"}], "trans": [{"q": "前不见古人，后不见来者。", "a": "往前看不见古代的贤明君主，往后看不见后世的贤才。"}, {"q": "念天地之悠悠，独怆然而涕下！", "a": "想到天地悠悠无穷无尽，我禁不住独自悲伤地流下眼泪！"}, {"q": "念天地之悠悠，", "a": "想到天地的广阔辽远与时间的无穷无尽，"}, {"q": "独怆然而涕下！", "a": "我独自一人满怀悲伤，禁不住泪流满面！"}], "book": "7b", "grade": "七年级下册", "id": 28}, {"title": "望岳", "author": "杜甫", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第五单元 第21课 古代诗歌五首·望岳", "text": "岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。", "theme": "描绘泰山雄伟神奇的景象，抒发不怕困难、敢攀顶峰、俯视一切的壮志。", "notes": ["岱宗：泰山的别名；未了：不尽", "造化：天地、大自然；钟：聚集", "阴阳：山北为阴，山南为阳；割：分", "曾：同“层”；决眦：睁裂眼眶（眦，眼角）", "会当：终当，终要；凌：登上", "由远及近，虚实结合，托物言志"], "dict": [{"q": "诗中借齐鲁大地烘托泰山拔地而起、参天耸立的诗句：", "a": "岱宗夫如何？齐鲁青未了。"}, {"q": "诗中写泰山神奇秀丽、巍峨高大（虚实结合）的诗句：", "a": "造化钟神秀，阴阳割昏晓。"}, {"q": "诗中写细望泰山、层云激荡心胸、目送归鸟的诗句：", "a": "荡胸生曾云，决眦入归鸟。"}, {"q": "诗中表达诗人敢于攀登绝顶、俯视一切的雄心壮志的千古名句：", "a": "会当凌绝顶，一览众山小。"}, {"q": "与“欲穷千里目，更上一层楼”意境相近、蕴含站高望远哲理的诗句：", "a": "会当凌绝顶，一览众山小。"}], "trans": [{"q": "岱宗夫如何？齐鲁青未了。", "a": "泰山到底是什么样的呢？那青翠的山色在齐鲁大地上绵延不尽。"}, {"q": "造化钟神秀，阴阳割昏晓。", "a": "大自然把神奇和秀丽都汇聚于泰山，山南山北明暗不同，如同清晨与黄昏。"}, {"q": "荡胸生曾云，决眦入归鸟。", "a": "山中升腾的层云使人心胸激荡，睁大眼睛远望那归巢的飞鸟。"}, {"q": "会当凌绝顶，一览众山小。", "a": "总有一天我要登上泰山的顶峰，一眼看尽周围那些矮小的群山。"}], "book": "7b", "grade": "七年级下册", "id": 29}, {"title": "登飞来峰", "author": "王安石", "dynasty": "北宋", "genre": "诗", "source": "课内", "unit": "第五单元 第21课 古代诗歌五首·登飞来峰", "text": "飞来山上千寻塔，闻说鸡鸣见日升。\n不畏浮云遮望眼，自缘身在最高层。", "theme": "借登高所见抒发高瞻远瞩的政治抱负与不惧阻挠的信念，蕴含站高望远之理。", "notes": ["千寻塔：很高的塔（寻，古代长度单位，八尺为一寻）", "闻说：听说；日升：太阳升起", "浮云：比喻奸邪小人，也指眼前的困难与障碍", "缘：因为；望眼：远望的视线", "借景说理，寓哲理于形象之中"], "dict": [{"q": "诗中用夸张（千寻）与传闻（鸡鸣见日升）表现塔极高的诗句：", "a": "飞来山上千寻塔，闻说鸡鸣见日升。"}, {"q": "诗中蕴含“站得高才能看得远”哲理的名句：", "a": "不畏浮云遮望眼，自缘身在最高层。"}, {"q": "诗中表明诗人不惧奸邪小人阻挠、锐意革新的句子：", "a": "不畏浮云遮望眼，自缘身在最高层。"}, {"q": "与王之涣“欲穷千里目，更上一层楼”有异曲同工之妙的诗句：", "a": "不畏浮云遮望眼，自缘身在最高层。"}], "trans": [{"q": "飞来山上千寻塔，闻说鸡鸣见日升。", "a": "飞来峰上有一座极高的塔，听说鸡鸣时分登塔就能看见太阳升起。"}, {"q": "不畏浮云遮望眼，自缘身在最高层。", "a": "不怕浮云遮住我远望的视线，只因为我站在塔的最高层上。"}, {"q": "闻说鸡鸣见日升。", "a": "听说在雄鸡报晓的时候，登塔就能望见太阳升起。"}, {"q": "自缘身在最高层。", "a": "只因为我的身子站在最高的一层上面。"}], "book": "7b", "grade": "七年级下册", "id": 30}, {"title": "游山西村", "author": "陆游", "dynasty": "南宋", "genre": "诗", "source": "课内", "unit": "第五单元 第21课 古代诗歌五首·游山西村", "text": "莫笑农家腊酒浑，丰年留客足鸡豚。\n山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。\n从今若许闲乘月，拄杖无时夜叩门。", "theme": "写山西村风光与农家淳朴好客，表达对田园生活的热爱，蕴含绝处逢生之理。", "notes": ["腊酒：腊月所酿之酒；浑：浑浊；豚：小猪，代指猪肉", "箫鼓：吹箫打鼓；春社：立春后祭祀土地神的节日", "若许：如果可以；无时：随时；叩门：敲门", "名句“山重水复疑无路，柳暗花明又一村”含困境转机之理", "写景、叙事、抒情结合，对仗工整"], "dict": [{"q": "诗中写农家盛情待客、民风淳朴的句子：", "a": "莫笑农家腊酒浑，丰年留客足鸡豚。"}, {"q": "诗中描写山村曲折幽深、豁然开朗，并蕴含绝处逢生哲理的名句：", "a": "山重水复疑无路，柳暗花明又一村。"}, {"q": "诗中描摹南宋农村风俗画卷（春社将近、衣冠简朴）的诗句：", "a": "箫鼓追随春社近，衣冠简朴古风存。"}, {"q": "诗中写诗人但愿今后趁月闲游、随时拄杖叩门的句子：", "a": "从今若许闲乘月，拄杖无时夜叩门。"}, {"q": "比喻人在困境中忽然出现转机时常用的诗句：", "a": "山重水复疑无路，柳暗花明又一村。"}], "trans": [{"q": "莫笑农家腊酒浑，丰年留客足鸡豚。", "a": "不要笑话农家腊月酿的酒浑浊，丰收之年待客的鸡肉猪肉十分丰足。"}, {"q": "山重水复疑无路，柳暗花明又一村。", "a": "山峦重叠水流曲折，正担心无路可走，忽然柳色浓绿花光红艳，又出现一个村庄。"}, {"q": "箫鼓追随春社近，衣冠简朴古风存。", "a": "箫声鼓声此起彼伏，春社的日子已经临近；村民衣帽简朴，还保留着古老的风俗。"}, {"q": "从今若许闲乘月，拄杖无时夜叩门。", "a": "今后若有机会趁着月色闲游，我一定拄着拐杖随时在夜里来敲门。"}], "book": "7b", "grade": "七年级下册", "id": 31}, {"title": "己亥杂诗（其五）", "author": "龚自珍", "dynasty": "清", "genre": "诗", "source": "课内", "unit": "第五单元 第21课 古代诗歌五首·己亥杂诗（其五）", "text": "浩荡离愁白日斜，吟鞭东指即天涯。\n落红不是无情物，化作春泥更护花。", "theme": "以落花自喻，写辞官离京之愁，表达仍愿为国效力、无私奉献的情怀。", "notes": ["浩荡：形容愁绪广阔无边；吟鞭：诗人的马鞭", "东指：马鞭向东一挥；天涯：指离京都极远", "落红：落花，诗人自喻；花：比喻国家、朝廷", "以“落红”“春泥”设喻，托物言志", "“落红不是无情物，化作春泥更护花”常用来赞美奉献精神"], "dict": [{"q": "诗中写诗人辞官离京、愁绪浩荡而夕阳西斜的句子：", "a": "浩荡离愁白日斜，吟鞭东指即天涯。"}, {"q": "诗中写马鞭东指、离京路途遥远（叙事抒情）的句子：", "a": "浩荡离愁白日斜，吟鞭东指即天涯。"}, {"q": "龚自珍《己亥杂诗（其五）》中以落花自喻、表达虽辞官仍关心国家前途的名句：", "a": "落红不是无情物，化作春泥更护花。"}, {"q": "现在常用来赞美教师等无私奉献精神的诗句：", "a": "落红不是无情物，化作春泥更护花。"}], "trans": [{"q": "浩荡离愁白日斜，吟鞭东指即天涯。", "a": "离愁浩浩荡荡，夕阳已经西斜，我挥鞭向东一指，便远去天涯。"}, {"q": "落红不是无情物，化作春泥更护花。", "a": "落花并不是没有感情的东西，它化作春天的泥土还能滋养新开的花朵。"}, {"q": "浩荡离愁白日斜，", "a": "离别的愁绪浩浩荡荡，此时夕阳正向西边斜落。"}, {"q": "化作春泥更护花。", "a": "它愿化作春天的泥土，去更好地呵护滋养新花。"}], "book": "7b", "grade": "七年级下册", "id": 32}, {"title": "活板", "author": "沈括（选自《梦溪笔谈》）", "dynasty": "北宋", "genre": "文言文", "source": "课内", "unit": "第六单元 第25课 活板", "text": "板印书籍，唐人尚未盛为之。自冯瀛王始印五经，已后典籍皆为板本。\n庆历中，有布衣毕昇，又为活板。其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。先设一铁板，其上以松脂、蜡和纸灰之类冒之。欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火炀之；药稍镕，则以一平板按其面，则字平如砥。若止印三二本，未为简易；若印数十百千本，则极为神速。常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。每一字皆有数印，如“之”“也”等字，每字有二十余印，以备一板内有重复者。不用，则以纸帖之，每韵为一帖，木格贮之。有奇字素无备者，旋刻之，以草火烧，瞬息可成。不以木为之者，木理有疏密，沾水则高下不平，兼与药相粘，不可取；不若燔土，用讫再火令药镕，以手拂之，其印自落，殊不沾污。\n昇死，其印为余群从所得，至今宝藏。", "theme": "介绍毕昇发明活字印刷的方法与神速功效，赞颂古代劳动人民的智慧与创造。", "notes": ["板印：雕版印刷；“板”同“版”；已：同“以”；止：同“只”", "布衣：平民；钱唇：铜钱的边缘；范：模子", "炀：烘烤；镕：同“熔”；砥：磨刀石", "燔土：烧过的胶泥（燔，烧）；讫：完毕；殊：根本", "帖：用标签标出；贮：贮存；奇字：生僻字", "按印刷程序（时间顺序）说明，与雕版对比，处处突出“活”"], "dict": [{"q": "文中交代活字印刷的发明者与发明时间的句子：", "a": "庆历中，有布衣毕昇，又为活板。"}, {"q": "文中说明印数极多时活板印刷效率极高的句子：", "a": "若印数十百千本，则极为神速。"}, {"q": "文中写两板交替使用、排版印刷极快的句子：", "a": "常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。"}, {"q": "文中写胶泥字印用毕火烤即自行脱落、洁净不沾污的句子：", "a": "用讫再火令药镕，以手拂之，其印自落，殊不沾污。"}, {"q": "文中交代毕昇死后其字印下落（被作者堂兄弟及子侄珍藏）的句子：", "a": "昇死，其印为余群从所得，至今宝藏。"}], "trans": [{"q": "庆历中，有布衣毕昇，又为活板。", "a": "庆历年间，有个平民叫毕昇，又发明了活字印刷。"}, {"q": "用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。", "a": "用胶泥刻字，字模薄得像铜钱的边缘，每个字刻一个印，用火烧使它坚硬。"}, {"q": "先设一铁板，其上以松脂、蜡和纸灰之类冒之。", "a": "先准备一块铁板，在它上面用松脂、蜡混合纸灰一类的东西覆盖住。"}, {"q": "药稍镕，则以一平板按其面，则字平如砥。", "a": "待药物稍稍熔化，就用一块平板按压它的表面，字印便平整得像磨刀石一样。"}, {"q": "有奇字素无备者，旋刻之，以草火烧，瞬息可成。", "a": "遇到平时没有准备的生僻字，就随即刻制，用草火烧硬，很快就做成了。"}, {"q": "昇死，其印为余群从所得，至今宝藏。", "a": "毕昇死后，他的字印被我的堂兄弟和侄儿们得到，到现在还珍藏着。"}], "book": "7b", "grade": "七年级下册", "id": 33}, {"title": "河中石兽", "author": "纪昀（选自《阅微草堂笔记》）", "dynasty": "清", "genre": "文言文", "source": "课内", "unit": "第六单元 第24课 河中石兽（2017年版教材篇目，2022年起已换为《活板》）", "text": "沧州南一寺临河干，山门圮于河，二石兽并沉焉。阅十余岁，僧募金重修，求二石兽于水中，竟不可得。以为顺流下矣，棹数小舟，曳铁钯，寻十余里无迹。\n一讲学家设帐寺中，闻之笑曰：“尔辈不能究物理，是非木杮，岂能为暴涨携之去？乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。沿河求之，不亦颠乎？”众服为确论。\n一老河兵闻之，又笑曰：“凡河中失石，当求之于上流。盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴，渐激渐深，至石之半，石必倒掷坎穴中。如是再啮，石又再转。转转不已，遂反溯流逆上矣。求之下流，固颠；求之地中，不更颠乎？”如其言，果得于数里外。然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？", "theme": "记寻找石兽的三种方法，说明天下事不可只知其一不知其二，不可主观臆断。", "notes": ["临：靠近；河干：河岸；圮：倒塌；阅：经过，经历", "棹：划（船）；曳：拖；铁钯：农具，同“耙”", "湮：埋没；颠：颠倒、错乱（同“癫”，荒唐）", "啮：侵蚀、冲刷；坎穴：坑洞；溯流：逆流", "臆断：主观地判断；物理：事物的道理、规律", "讲学家“据理臆断”与老河兵实践经验对比，篇末议论点旨"], "dict": [{"q": "文中老河兵判断河中失石应当在上游寻找的句子：", "a": "凡河中失石，当求之于上流。"}, {"q": "文中说明石兽向上游移动原因（水反激之力冲刷成穴）的句子：", "a": "必于石下迎水处啮沙为坎穴，渐激渐深，至石之半，石必倒掷坎穴中。"}, {"q": "文中嘲讽讲学家之类只知其一不知其二、主观判断的议论句：", "a": "然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？"}, {"q": "文中写讲学家认为石兽不会被暴涨的河水冲走的句子：", "a": "是非木杮，岂能为暴涨携之去？"}], "trans": [{"q": "沧州南一寺临河干，山门圮于河，二石兽并沉焉。", "a": "沧州南面有一座寺庙靠近河岸，寺门倒塌在河中，两尊石兽一起沉没了。"}, {"q": "棹数小舟，曳铁钯，寻十余里无迹。", "a": "划着几只小船，拖着铁钯，向下游找了十多里也没有发现踪迹。"}, {"q": "尔辈不能究物理，是非木杮，岂能为暴涨携之去？", "a": "你们这些人不能推究事物的道理，这不是木片，怎么能被暴涨的洪水带走呢？"}, {"q": "乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。", "a": "石头的性质坚硬沉重，沙子的性质疏松轻浮，石兽埋没在沙里，越沉越深罢了。"}, {"q": "其反激之力，必于石下迎水处啮沙为坎穴，", "a": "水流反冲的力量，一定会在石头下面迎水的地方冲刷沙子形成坑洞。"}, {"q": "然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？", "a": "既然这样，天下的事只知道其一不知其二的太多了，怎能根据常理主观判断呢？"}], "book": "7b", "grade": "七年级下册", "id": 34}, {"title": "泊秦淮", "author": "杜牧", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "烟笼寒水月笼沙，夜泊秦淮近酒家。\n商女不知亡国恨，隔江犹唱后庭花。", "theme": "借夜泊秦淮所见所闻，讽刺统治者沉溺声色、不恤国事，抒发忧国伤时之情。", "notes": ["笼：笼罩；寒水：清冷的江水；沙：沙滩", "商女：以卖唱为生的歌女", "后庭花：即《玉树后庭花》，陈后主所作，世称亡国之音", "两个“笼”字写出朦胧凄清的水上夜景", "借古讽今，用典抒怀，含蓄深沉"], "dict": [{"q": "诗中描写烟雾月色笼罩寒水沙滩、凄清迷蒙的诗句：", "a": "烟笼寒水月笼沙，夜泊秦淮近酒家。"}, {"q": "诗中点明夜泊地点并为下文抒怀作铺垫的句子：", "a": "烟笼寒水月笼沙，夜泊秦淮近酒家。"}, {"q": "杜牧《泊秦淮》中讽刺统治者不恤国事、沉溺声色的名句：", "a": "商女不知亡国恨，隔江犹唱后庭花。"}, {"q": "诗中借《玉树后庭花》典故抒发忧国伤时之感的诗句：", "a": "商女不知亡国恨，隔江犹唱后庭花。"}], "trans": [{"q": "烟笼寒水月笼沙，夜泊秦淮近酒家。", "a": "烟雾笼罩着寒冷的水面，月光笼罩着沙滩，夜里把船停泊在秦淮河畔靠近酒家的地方。"}, {"q": "商女不知亡国恨，隔江犹唱后庭花。", "a": "歌女不懂得亡国的悲恨，隔着江水还在唱着《玉树后庭花》。"}, {"q": "烟笼寒水月笼沙，", "a": "烟雾笼罩着清冷的江水，月光笼罩着岸边的沙滩。"}, {"q": "隔江犹唱后庭花。", "a": "隔着江水还在唱那支亡国之音《后庭花》。"}], "book": "7b", "grade": "七年级下册", "id": 35}, {"title": "贾生", "author": "李商隐", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "宣室求贤访逐臣，贾生才调更无伦。\n可怜夜半虚前席，不问苍生问鬼神。", "theme": "借汉文帝宣室召见贾谊之事，讽刺统治者求贤而不用其才，寄寓怀才不遇之慨。", "notes": ["宣室：汉代未央宫前殿正室；逐臣：被贬谪之臣，指贾谊", "才调：才华，此指贾谊的政治才能；无伦：无人能比", "可怜：可惜；虚：徒然，空自；前席：移坐向前", "苍生：百姓", "欲扬先抑（先扬后抑），以“不问苍生问鬼神”收束，讽刺辛辣"], "dict": [{"q": "诗中写汉文帝求贤、召见被贬之臣贾谊的诗句：", "a": "宣室求贤访逐臣，贾生才调更无伦。"}, {"q": "诗中高度评价贾谊才华无人能及的诗句：", "a": "宣室求贤访逐臣，贾生才调更无伦。"}, {"q": "诗中揭示统治者虽求贤却不问国计民生、只问鬼神的名句：", "a": "可怜夜半虚前席，不问苍生问鬼神。"}, {"q": "诗中对贾谊空受前席之遇表示惋惜的句子：", "a": "可怜夜半虚前席，不问苍生问鬼神。"}], "trans": [{"q": "宣室求贤访逐臣，贾生才调更无伦。", "a": "汉文帝在宣室召见被贬逐的臣子，贾谊的才华风度更是无人能比。"}, {"q": "可怜夜半虚前席，不问苍生问鬼神。", "a": "可惜谈到半夜文帝空自向前挪动座席，不问百姓生计却问起鬼神之事。"}, {"q": "贾生才调更无伦。", "a": "贾谊的才华和风度，更没有人能够比得上。"}, {"q": "不问苍生问鬼神。", "a": "不询问治国安民的道理，却问起虚妄的鬼神之事。"}], "book": "7b", "grade": "七年级下册", "id": 36}, {"title": "过松源晨炊漆公店（其五）", "author": "杨万里", "dynasty": "南宋", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "莫言下岭便无难，赚得行人错喜欢。\n政入万山围子里，一山放出一山拦。", "theme": "写下山途中的感受，说明人生路上困难重重，不可因一时顺利而松懈。", "notes": ["莫言：不要说；赚得：骗得", "错喜欢：白白欢喜一场；政：同“正”；围子：圈子", "放出：这里指放行人过去；拦：阻拦", "以山路喻人生，即景说理，语言通俗活泼", "蕴含“不要为一时顺境所迷惑”的哲理"], "dict": [{"q": "诗中提醒人们不要以为下了山就没有困难（莫轻易欢喜）的诗句：", "a": "莫言下岭便无难，赚得行人错喜欢。"}, {"q": "诗中写行人被“骗”得空欢喜一场的句子：", "a": "莫言下岭便无难，赚得行人错喜欢。"}, {"q": "诗中写群山重重、刚过一山又被一山阻拦的名句：", "a": "政入万山围子里，一山放出一山拦。"}, {"q": "诗中蕴含“人生道路困难重重，不可为一时顺境所惑”哲理的诗句：", "a": "政入万山围子里，一山放出一山拦。"}], "trans": [{"q": "莫言下岭便无难，赚得行人错喜欢。", "a": "不要说下了山就没有困难了，它骗得行人白白地欢喜一场。"}, {"q": "政入万山围子里，一山放出一山拦。", "a": "当你进入万山的包围圈里，一座山刚把你放过，另一座山又把你拦住。"}, {"q": "赚得行人错喜欢。", "a": "这话骗得过往的行人空欢喜了一场。"}, {"q": "一山放出一山拦。", "a": "一座山刚刚把你放过去，另一座山又横在前面拦住你。"}], "book": "7b", "grade": "七年级下册", "id": 37}, {"title": "约客", "author": "赵师秀", "dynasty": "南宋", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "黄梅时节家家雨，青草池塘处处蛙。\n有约不来过夜半，闲敲棋子落灯花。", "theme": "写江南梅雨之夜候客不至的情景，表现诗人孤寂无聊与闲适交织的心境。", "notes": ["黄梅时节：江南夏初梅子黄熟的梅雨季节", "家家雨：处处下雨；处处蛙：到处是蛙声", "有约：邀约的客人；过夜半：已过半夜", "灯花：灯芯燃尽结成的花状物", "以声衬静（雨声、蛙声反衬夜静），“闲敲棋子”细节传神"], "dict": [{"q": "诗中描写江南梅雨季节雨声与蛙声交织（以声衬静）的诗句：", "a": "黄梅时节家家雨，青草池塘处处蛙。"}, {"q": "诗中交代时令与环境、为下文候客作铺垫的诗句：", "a": "黄梅时节家家雨，青草池塘处处蛙。"}, {"q": "诗中写友人失约不至、已过夜半的句子：", "a": "有约不来过夜半，闲敲棋子落灯花。"}, {"q": "赵师秀《约客》中含蓄表现诗人候客寂寞心情的细节描写句：", "a": "有约不来过夜半，闲敲棋子落灯花。"}], "trans": [{"q": "黄梅时节家家雨，青草池塘处处蛙。", "a": "黄梅时节处处都在下雨，长满青草的池塘边到处都是青蛙的叫声。"}, {"q": "有约不来过夜半，闲敲棋子落灯花。", "a": "约好的客人过了半夜还没有来，我无聊地轻敲棋子，震落了灯芯结成的灯花。"}, {"q": "青草池塘处处蛙。", "a": "长满青草的池塘边，到处响起青蛙的鸣叫之声。"}, {"q": "闲敲棋子落灯花。", "a": "我无聊地轻轻敲着棋子，震落了灯芯上结成的灯花。"}], "book": "7b", "grade": "七年级下册", "id": 38}, {"title": "三峡", "author": "郦道元", "dynasty": "北魏", "genre": "文言文", "source": "课内", "unit": "第三单元 第10课 三峡", "text": "自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。\n至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。\n春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间。清荣峻茂，良多趣味。\n每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳！”", "theme": "描绘三峡山高岭连、夏水湍急、春冬清幽、秋景凄凉的四季风光，抒发对祖国山河的热爱。", "notes": ["略无阙处：阙同“缺”，空隙、缺口", "自非亭午夜分：如果不是正午和半夜", "沿溯阻绝：沿，顺流而下；溯，逆流而上", "虽乘奔御风，不以疾也：以夸张对比侧面写夏水迅疾", "清荣峻茂：水清、树荣、山高、草盛", "属引凄异：属，连接；引，延长，写猿声连绵凄凉"], "dict": [{"q": "《三峡》中侧面烘托山势高峻、遮天蔽日，只有在正午半夜才见日月的句子是？", "a": "自非亭午夜分，不见曦月。"}, {"q": "文中与李白“朝辞白帝彩云间，千里江陵一日还”意境相近，写夏水迅疾的句子是？", "a": "有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。"}, {"q": "《三峡》中写春冬之时水清树荣、趣味无穷的总括句是？", "a": "清荣峻茂，良多趣味。"}, {"q": "文中引用渔歌渲染三峡秋天萧瑟凄凉气氛的句子是？", "a": "巴东三峡巫峡长，猿鸣三声泪沾裳！"}, {"q": "《三峡》中描写春冬之时江水清澈、景物倒映的句子是？", "a": "素湍绿潭，回清倒影。"}], "trans": [{"q": "自三峡七百里中，两岸连山，略无阙处。", "a": "在三峡七百里当中，两岸都是相连的高山，全然没有中断的地方。"}, {"q": "自非亭午夜分，不见曦月。", "a": "如果不是正午和半夜，就看不见太阳和月亮。"}, {"q": "至于夏水襄陵，沿溯阻绝。", "a": "到了夏天江水漫上山陵的时候，下行和上行的航道都被阻断了。"}, {"q": "虽乘奔御风，不以疾也。", "a": "即使骑着飞奔的骏马，驾着疾风，也没有这样快。"}, {"q": "素湍绿潭，回清倒影。", "a": "白色的急流回旋着清波，碧绿的潭水倒映着两岸景物的影子。"}, {"q": "常有高猿长啸，属引凄异，空谷传响，哀转久绝。", "a": "常常有高处的猿猴拉长声音鸣叫，连续不断凄凉怪异，空谷中传来回声，悲哀婉转，很久才消失。"}], "book": "8a", "grade": "八年级上册", "id": 39}, {"title": "答谢中书书", "author": "陶弘景", "dynasty": "南朝·梁", "genre": "文言文", "source": "课内", "unit": "第三单元 第11课 短文二篇", "text": "山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。", "theme": "描绘江南山川晨昏变化之美，表达娱情山水、与古今知音共赏奇景的得意之情。", "notes": ["五色交辉：石壁色彩斑斓，交相辉映", "四时俱备：四时，四季；俱，都", "晓雾将歇：歇，消散", "夕日欲颓：颓，坠落", "沉鳞竞跃：沉鳞，指水中的鱼", "未复有能与其奇者：与（yù），参与，这里指欣赏"], "dict": [{"q": "《答谢中书书》中总领全文、点明山川之美自古为人共赏的句子是？", "a": "山川之美，古来共谈。"}, {"q": "文中写仰观俯察、山高水清的清新之句是？", "a": "高峰入云，清流见底。"}, {"q": "《答谢中书书》中由静景转入动景，描写晨昏变化、充满生机的句子是？", "a": "晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。"}, {"q": "文中表达知音难觅、自许能与谢灵运比肩共赏奇景的句子是？", "a": "实是欲界之仙都。自康乐以来，未复有能与其奇者。"}], "trans": [{"q": "山川之美，古来共谈。", "a": "山川景色的美丽，自古以来就是文人雅士共同谈论的话题。"}, {"q": "两岸石壁，五色交辉。", "a": "两岸的石壁色彩斑斓，各种颜色交相辉映。"}, {"q": "青林翠竹，四时俱备。", "a": "青葱的林木和翠绿的竹丛，一年四季都长存不衰。"}, {"q": "晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。", "a": "清晨的薄雾将要消散，猿和鸟此起彼伏地鸣叫；夕阳快要坠落，水中的鱼儿争相跳出水面。"}, {"q": "自康乐以来，未复有能与其奇者。", "a": "自从南朝的谢灵运以来，就再也没有人能够欣赏这种奇丽的景色了。"}], "book": "8a", "grade": "八年级上册", "id": 40}, {"title": "记承天寺夜游", "author": "苏轼", "dynasty": "宋", "genre": "文言文", "source": "课内", "unit": "第三单元 第11课 短文二篇", "text": "元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "theme": "以空明月色写贬谪中的悠闲自得，含蓄抒发壮志难酬的苦闷与自我排遣的旷达。", "notes": ["欣然：高兴、愉快的样子", "念无与为乐者：念，考虑、想到", "相与步于中庭：相与，共同、一起", "空明：形容水的澄澈，这里写月色", "盖竹柏影也：盖，大概是", "但少闲人如吾两人者耳：闲人，清闲的人，含被贬自嘲意味"], "dict": [{"q": "《记承天寺夜游》中以水喻月、借竹柏影侧面写月色澄澈的名句是？", "a": "庭下如积水空明，水中藻、荇交横，盖竹柏影也。"}, {"q": "文中写月光入户引发游兴、于是起身夜游的句子是？", "a": "月色入户，欣然起行。"}, {"q": "《记承天寺夜游》中点明主旨、抒发“闲人”感慨（含贬谪自嘲与旷达）的句子是？", "a": "何夜无月？何处无竹柏？但少闲人如吾两人者耳。"}, {"q": "文中写二人默契同游、友情相契的句子是？", "a": "怀民亦未寝，相与步于中庭。"}], "trans": [{"q": "月色入户，欣然起行。", "a": "这时月光照进门里，我高兴地起来出门散步。"}, {"q": "念无与为乐者，遂至承天寺寻张怀民。", "a": "想到没有和我一同游乐的人，就到承天寺去找张怀民。"}, {"q": "怀民亦未寝，相与步于中庭。", "a": "张怀民也还没有睡觉，我们就一起在庭院里散步。"}, {"q": "庭下如积水空明，水中藻、荇交横，盖竹柏影也。", "a": "庭院中的月光如积水一般清澈透明，水中的水藻、荇菜纵横交错，大概是竹子和柏树的影子。"}, {"q": "何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "a": "哪一夜没有月光？哪里没有竹子和柏树？只是缺少像我们两个这样的清闲之人罢了。"}], "book": "8a", "grade": "八年级上册", "id": 41}, {"title": "与朱元思书", "author": "吴均", "dynasty": "南朝·梁", "genre": "文言文", "source": "课内", "unit": "第三单元 第12课 与朱元思书", "text": "风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。\n水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。\n夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。", "theme": "描绘富春江奇山异水，抒发鄙弃功名利禄、向往自然与避世退隐的高洁情怀。", "notes": ["一百许里：许，表示约数，左右", "急湍甚箭：甚，超过", "负势竞上：负，凭借；竞，争着", "互相轩邈：轩，往高处；邈，往远处，均作动词", "鸢飞戾天：戾，至、到达，比喻追求名利", "窥谷忘反：反同“返”"], "dict": [{"q": "《与朱元思书》中总领全文、赞叹富春江山水天下独一无二的句子是？", "a": "奇山异水，天下独绝。"}, {"q": "文中用比喻夸张写江水迅疾、浪涛凶猛的句子是？", "a": "急湍甚箭，猛浪若奔。"}, {"q": "《与朱元思书》中借景抒怀，表达鄙弃功名、向往自然（规劝友人）的句子是？", "a": "鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。"}, {"q": "文中写山林枝密蔽日、明暗交替的句子是？", "a": "横柯上蔽，在昼犹昏；疏条交映，有时见日。"}], "trans": [{"q": "风烟俱净，天山共色。", "a": "风和烟雾都消散尽了，天空和群山呈现出同样的颜色。"}, {"q": "急湍甚箭，猛浪若奔。", "a": "湍急的江流比飞箭还要快，汹涌的巨浪就像奔马一样。"}, {"q": "负势竞上，互相轩邈，争高直指，千百成峰。", "a": "山峦凭依地势争着向上，互相往高处和远处伸展，笔直地向上形成无数山峰。"}, {"q": "鸢飞戾天者，望峰息心", "a": "那些像鹞鹰飞到天上一样极力追求名利的人，看到这些山峰就会平息名利之心。"}, {"q": "经纶世务者，窥谷忘反。", "a": "那些忙于筹划治理国家大事的人，看到这些幽美的山谷也会流连忘返。"}, {"q": "横柯上蔽，在昼犹昏；疏条交映，有时见日。", "a": "横斜的树枝在上面遮蔽着，白天也像黄昏一样昏暗；稀疏的枝条交相掩映，有时还能见到阳光。"}], "book": "8a", "grade": "八年级上册", "id": 42}, {"title": "野望", "author": "王绩", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第三单元 第13课 唐诗五首", "text": "东皋薄暮望，徙倚欲何依。\n树树皆秋色，山山唯落晖。\n牧人驱犊返，猎马带禽归。\n相顾无相识，长歌怀采薇。", "theme": "写秋日山野傍晚的萧瑟景色，抒发诗人彷徨无依、孤独抑郁与追怀隐逸的情怀。", "notes": ["东皋：诗人晚年隐居之地", "薄暮：傍晚", "徙倚：徘徊", "犊：小牛；禽：指猎获的鸟兽", "采薇：典出伯夷、叔齐，比喻隐居不仕", "全诗以“望”字统摄，属五言律诗"], "dict": [{"q": "《野望》中化用曹操“绕树三匝，何枝可依”，表现诗人彷徨无依、孤独苦闷的句子是？", "a": "东皋薄暮望，徙倚欲何依。"}, {"q": "《野望》中描写举目皆秋、层层尽染的秋日山野典型景象（对偶工整）的句子是？", "a": "树树皆秋色，山山唯落晖。"}, {"q": "《野望》中以动衬静、描绘田园晚归图景的句子是？", "a": "牧人驱犊返，猎马带禽归。"}, {"q": "《野望》中用典故表达知音难觅、追怀古代隐士的句子是？", "a": "相顾无相识，长歌怀采薇。"}], "trans": [{"q": "东皋薄暮望，徙倚欲何依。", "a": "傍晚时分在东皋纵目远望，我徘徊不定，不知该归依什么。"}, {"q": "树树皆秋色，山山唯落晖。", "a": "每一棵树都染上秋天的色彩，重重山岭都披着落日的余晖。"}, {"q": "牧人驱犊返，猎马带禽归。", "a": "放牧的人赶着牛犊回来，打猎的人骑着马带着猎物归来。"}, {"q": "相顾无相识，长歌怀采薇。", "a": "我与他们对视却互不相识，只好放声高歌，追怀古代采薇而食的隐士。"}], "book": "8a", "grade": "八年级上册", "id": 43}, {"title": "黄鹤楼", "author": "崔颢", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第三单元 第13课 唐诗五首", "text": "昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。", "theme": "吊古伤今，抒发世事沧桑、岁月难再的感慨与日暮思归的浓浓乡愁。", "notes": ["昔人：指传说中骑鹤飞去的仙人", "悠悠：飘荡的样子，暗含岁月悠远", "历历：分明的样子", "萋萋：草木茂盛的样子", "乡关：故乡", "以“愁”字收束，情景交融"], "dict": [{"q": "《黄鹤楼》中写仙人已去、楼空人杳，抒发岁月不再之叹的句子是？", "a": "昔人已乘黄鹤去，此地空余黄鹤楼。"}, {"q": "《黄鹤楼》中以悠悠白云烘托岁月悠远、世事茫茫的句子是？", "a": "黄鹤一去不复返，白云千载空悠悠。"}, {"q": "《黄鹤楼》中写登楼所见明丽开阔江景、对仗工整的句子是？", "a": "晴川历历汉阳树，芳草萋萋鹦鹉洲。"}, {"q": "《黄鹤楼》中点明主旨、以烟波暮色抒发游子思乡之愁的句子是？", "a": "日暮乡关何处是？烟波江上使人愁。"}], "trans": [{"q": "昔人已乘黄鹤去，此地空余黄鹤楼。", "a": "昔日的仙人早已乘黄鹤飞走，这里只留下一座空荡荡的黄鹤楼。"}, {"q": "黄鹤一去不复返，白云千载空悠悠。", "a": "黄鹤一去就再也没有回来，千百年来只看见白云在空中悠悠飘荡。"}, {"q": "晴川历历汉阳树，芳草萋萋鹦鹉洲。", "a": "晴日里汉阳的树木清晰可数，鹦鹉洲上的芳草长得十分茂盛。"}, {"q": "日暮乡关何处是？烟波江上使人愁。", "a": "天色已晚，哪里是我的故乡？江上的烟波渺茫，更让人涌起愁绪。"}], "book": "8a", "grade": "八年级上册", "id": 44}, {"title": "使至塞上", "author": "王维", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第三单元 第13课 唐诗五首", "text": "单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。", "theme": "记述出使边塞的所见所感，以雄奇壮阔的塞外风光，抒写被排挤的孤寂与慷慨情怀。", "notes": ["单车：轻车简从；问边：慰问边关守军", "属国：典属国，这里借指诗人出使的身份", "征蓬：飘飞的蓬草，诗人自喻", "孤烟：指烽烟；长河：指黄河", "候骑：负责侦察、通信的骑兵", "都护：边疆最高统帅，用燕然勒功典故"], "dict": [{"q": "《使至塞上》中交代轻车简从、出使边塞行程的句子是？", "a": "单车欲问边，属国过居延。"}, {"q": "《使至塞上》中以“蓬”“雁”自比，暗写内心激愤抑郁与漂泊之感的句子是？", "a": "征蓬出汉塞，归雁入胡天。"}, {"q": "王维《使至塞上》中描绘塞外奇特壮丽风光、被王国维称为“千古壮观”的名句是？", "a": "大漠孤烟直，长河落日圆。"}, {"q": "《使至塞上》中用典故暗示前线战事胜利、将军仍在前线坚守的句子是？", "a": "萧关逢候骑，都护在燕然。"}], "trans": [{"q": "单车欲问边，属国过居延。", "a": "我乘一辆车去慰问边关守军，途中已经经过了居延一带。"}, {"q": "征蓬出汉塞，归雁入胡天。", "a": "我像飘飞的蓬草飘出了汉家边塞，又像北归的大雁飞入胡地的天空。"}, {"q": "大漠孤烟直，长河落日圆。", "a": "浩瀚沙漠中一缕烽烟笔直向上，长长的黄河之上落日又圆又红。"}, {"q": "萧关逢候骑，都护在燕然。", "a": "在萧关遇到侦察的骑兵，他告诉我都护正在燕然前线督战。"}], "book": "8a", "grade": "八年级上册", "id": 45}, {"title": "渡荆门送别", "author": "李白", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第三单元 第13课 唐诗五首", "text": "渡远荆门外，来从楚国游。\n山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。\n仍怜故乡水，万里送行舟。", "theme": "写出蜀入楚途中所见壮阔景象，抒发对故乡的眷恋与初出远门的欣喜憧憬。", "notes": ["荆门：荆门山，在今湖北宜都西北", "大荒：辽远无际的原野", "海楼：海市蜃楼，形容江上云霞奇观", "怜：喜爱", "故乡水：指长江水，诗人自幼生长于蜀地", "山随平野尽，江入大荒流：化静为动，境界开阔"], "dict": [{"q": "《渡荆门送别》中交代远渡地点与出蜀目的的句子是？", "a": "渡远荆门外，来从楚国游。"}, {"q": "《渡荆门送别》中化静为动，写船出三峡后视野豁然开阔的壮阔景象的句子是？", "a": "山随平野尽，江入大荒流。"}, {"q": "《渡荆门送别》中以水中月影如明镜、云霞变幻似海楼写江上奇景的句子是？", "a": "月下飞天镜，云生结海楼。"}, {"q": "《渡荆门送别》中运用拟人手法，借故乡水含蓄抒发思乡之情的句子是？", "a": "仍怜故乡水，万里送行舟。"}], "trans": [{"q": "渡远荆门外，来从楚国游。", "a": "我乘船远渡到荆门山之外，来到古老的楚国故地游览。"}, {"q": "山随平野尽，江入大荒流。", "a": "崇山峻岭随着平原的出现渐渐消失，江水奔流进辽远无际的原野。"}, {"q": "月下飞天镜，云生结海楼。", "a": "月亮倒映水中，像天上飞来的一面明镜；云气升腾，变幻出海市蜃楼。"}, {"q": "仍怜故乡水，万里送行舟。", "a": "我依然喜爱这来自故乡的江水，它不远万里一路护送我的行舟。"}], "book": "8a", "grade": "八年级上册", "id": 46}, {"title": "钱塘湖春行", "author": "白居易", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第三单元 第13课 唐诗五首", "text": "孤山寺北贾亭西，水面初平云脚低。\n几处早莺争暖树，谁家新燕啄春泥。\n乱花渐欲迷人眼，浅草才能没马蹄。\n最爱湖东行不足，绿杨阴里白沙堤。", "theme": "描绘西湖早春生机盎然的明媚风光，抒发诗人游春的喜悦与对西湖的喜爱。", "notes": ["云脚低：白云低垂，与湖面波澜连成一片", "暖树：向阳的树", "乱花：各种颜色、品种的花", "没：遮没，读mò；足：够", "以“行”为线索，移步换景", "全诗紧扣“早春”，多用“几处”“谁家”“渐欲”“才能”"], "dict": [{"q": "《钱塘湖春行》中从大处落笔，勾勒西湖早春轮廓（写湖面与云脚）的句子是？", "a": "孤山寺北贾亭西，水面初平云脚低。"}, {"q": "《钱塘湖春行》中以“争”“啄”二字写出早春禽鸟生机的句子是？", "a": "几处早莺争暖树，谁家新燕啄春泥。"}, {"q": "《钱塘湖春行》中写繁花初放、春草初生，体现“早春”特点的句子是？", "a": "乱花渐欲迷人眼，浅草才能没马蹄。"}, {"q": "《钱塘湖春行》中直抒胸臆，表达对西湖春景流连忘返的句子是？", "a": "最爱湖东行不足，绿杨阴里白沙堤。"}], "trans": [{"q": "孤山寺北贾亭西，水面初平云脚低。", "a": "从孤山寺的北面到贾公亭的西面，湖水刚与堤岸齐平，云层低垂。"}, {"q": "几处早莺争暖树，谁家新燕啄春泥。", "a": "几处早出的黄莺争着飞上向阳的枝头，谁家新来的燕子在衔春泥筑巢。"}, {"q": "乱花渐欲迷人眼，浅草才能没马蹄。", "a": "纷繁的花渐渐开放让人眼花缭乱，浅浅的春草刚刚能够遮没马蹄。"}, {"q": "最爱湖东行不足，绿杨阴里白沙堤。", "a": "我最喜爱湖东的景色，怎么也游赏不够，尤其是绿杨浓阴里的白沙堤。"}], "book": "8a", "grade": "八年级上册", "id": 47}, {"title": "庭中有奇树", "author": "《古诗十九首》", "dynasty": "汉", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "庭中有奇树，绿叶发华滋。\n攀条折其荣，将以遗所思。\n馨香盈怀袖，路远莫致之。\n此物何足贵？但感别经时。", "theme": "写思妇折花欲赠远人而不得，抒发对远行丈夫的深切思念与久别之苦。", "notes": ["华滋：花叶繁盛的样子", "荣：花", "遗（wèi）：赠送", "盈：充满；致：送达", "贵：一作“贡”，教材作“贵”", "经时：经历了很长时间，点明久别"], "dict": [{"q": "《庭中有奇树》中由树及人、以繁盛花叶起兴引出相思的句子是？", "a": "庭中有奇树，绿叶发华滋。"}, {"q": "《庭中有奇树》中写思妇折花欲赠远人的痴情举动（动作描写）的句子是？", "a": "攀条折其荣，将以遗所思。"}, {"q": "《庭中有奇树》中写花香盈袖却因路远无法送达、点出相隔之远的句子是？", "a": "馨香盈怀袖，路远莫致之。"}, {"q": "《庭中有奇树》中卒章显志，点明花本不足贵、可贵的是久别之情的句子是？", "a": "此物何足贵？但感别经时。"}], "trans": [{"q": "庭中有奇树，绿叶发华滋。", "a": "庭院里有一株珍奇的树，满树绿叶衬托着繁密的花朵。"}, {"q": "攀条折其荣，将以遗所思。", "a": "我攀着枝条折下一朵花，想把它送给心中思念的人。"}, {"q": "馨香盈怀袖，路远莫致之。", "a": "花香充满了我的衣襟和衣袖，无奈路途遥远，无法送到她手中。"}, {"q": "此物何足贵？但感别经时。", "a": "这花有什么值得珍贵的呢？只是感叹离别太久，借它寄托相思罢了。"}], "book": "8a", "grade": "八年级上册", "id": 48}, {"title": "龟虽寿", "author": "曹操", "dynasty": "东汉末", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "神龟虽寿，犹有竟时；腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里；烈士暮年，壮心不已。\n盈缩之期，不但在天；养怡之福，可得永年。\n幸甚至哉，歌以咏志。", "theme": "以神龟腾蛇为喻说明生命有限，抒发诗人老当益壮、积极进取的豪迈气概。", "notes": ["竟：终结，这里指死亡", "腾蛇：传说中能腾云驾雾的神物", "骥：良马；枥：马槽", "烈士：有远大抱负的人；已：停止", "盈缩：指人寿命的长短；但：仅，只", "幸甚至哉，歌以咏志：乐府诗合乐时的套语，与正文无关"], "dict": [{"q": "《龟虽寿》中以神物终有尽时，说明生命有限这一辩证道理的句子是？", "a": "神龟虽寿，犹有竟时；腾蛇乘雾，终为土灰。"}, {"q": "《龟虽寿》中以老马自喻，表现虽至晚年仍雄心不减的千古名句是？", "a": "老骥伏枥，志在千里；烈士暮年，壮心不已。"}, {"q": "《龟虽寿》中常被用来赞美老年人仍怀远大抱负的句子是？", "a": "烈士暮年，壮心不已。"}, {"q": "《龟虽寿》中强调人的寿命不全由天定、调养身心可益寿延年的句子是？", "a": "盈缩之期，不但在天；养怡之福，可得永年。"}], "trans": [{"q": "神龟虽寿，犹有竟时；腾蛇乘雾，终为土灰。", "a": "神龟虽然长寿，终究还有生命终结的一天；腾蛇能腾云驾雾，最终也会化为尘土。"}, {"q": "老骥伏枥，志在千里；烈士暮年，壮心不已。", "a": "年老的骏马伏在马槽边，心中仍想驰骋千里；有抱负的人到了晚年，雄心也不会停息。"}, {"q": "盈缩之期，不但在天；养怡之福，可得永年。", "a": "人寿命的长短，不只是由上天决定；调养身心、保持愉悦，便能延年益寿。"}, {"q": "幸甚至哉，歌以咏志。", "a": "真是幸运极了，就让我用这首诗歌来抒发自己的志向吧。"}], "book": "8a", "grade": "八年级上册", "id": 49}, {"title": "赠从弟（其二）", "author": "刘桢", "dynasty": "东汉末", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "亭亭山上松，瑟瑟谷中风。\n风声一何盛，松枝一何劲！\n冰霜正惨凄，终岁常端正。\n岂不罹凝寒？松柏有本性。", "theme": "借松柏不畏狂风冰霜自喻，勉励堂弟坚守坚贞高洁的本性而不随波逐流。", "notes": ["亭亭：高耸的样子", "瑟瑟：形容寒风的声音", "一何：多么", "惨凄：凛冽、严酷；端正：挺拔而不歪斜", "罹（lí）：遭受；凝寒：严寒", "全诗咏物言志，以松柏象征坚贞气节"], "dict": [{"q": "《赠从弟（其二）》中开篇即以松之风姿与谷风肃杀形成对比的句子是？", "a": "亭亭山上松，瑟瑟谷中风。"}, {"q": "《赠从弟（其二）》中以两个“一何”突出风之盛与松之劲（对比）的句子是？", "a": "风声一何盛，松枝一何劲！"}, {"q": "《赠从弟（其二）》中写松树终年挺立、经霜不凋的句子是？", "a": "冰霜正惨凄，终岁常端正。"}, {"q": "《赠从弟（其二）》中以设问揭示主旨、点明松柏坚贞本性的名句是？", "a": "岂不罹凝寒？松柏有本性。"}], "trans": [{"q": "亭亭山上松，瑟瑟谷中风。", "a": "高山上的松树挺拔耸立，山谷里的寒风瑟瑟呼啸。"}, {"q": "风声一何盛，松枝一何劲！", "a": "风声是多么猛烈迅疾，松枝又是多么刚劲挺拔！"}, {"q": "冰霜正惨凄，终岁常端正。", "a": "冰霜正严酷凛冽，松树却一年到头都挺拔端正。"}, {"q": "岂不罹凝寒？松柏有本性。", "a": "难道松树没有遭受严寒的侵袭吗？是因为松柏天生就有耐寒的本性。"}], "book": "8a", "grade": "八年级上册", "id": 50}, {"title": "梁甫行", "author": "曹植", "dynasty": "三国·魏", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "八方各异气，千里殊风雨。\n剧哉边海民，寄身于草野。\n妻子象禽兽，行止依林阻。\n柴门何萧条，狐兔翔我宇。", "theme": "描写海边贫民流离失所的非人生活，表达对底层百姓苦难的深切同情。", "notes": ["异气：气候不同；殊：不同", "剧：艰难；草野：草棚、野外（一作“草墅”）", "妻子：妻子儿女；行止：行动的踪迹", "林阻：山林险阻之地", "翔：自在地行走；宇：房屋", "以狐兔出没反衬家园荒芜，侧面烘托"], "dict": [{"q": "《梁甫行》中写各地气候风雨各异，以此衬托边海百姓最为困苦的句子是？", "a": "八方各异气，千里殊风雨。"}, {"q": "《梁甫行》中直抒诗人对边海贫民的深切同情、写其栖身草野的句子是？", "a": "剧哉边海民，寄身于草野。"}, {"q": "《梁甫行》中写百姓如禽兽般穴居山林、不敢现身的惨状的句子是？", "a": "妻子象禽兽，行止依林阻。"}, {"q": "《梁甫行》中以狐兔在屋宇间自在穿行，反衬家园荒凉破败的句子是？", "a": "柴门何萧条，狐兔翔我宇。"}], "trans": [{"q": "八方各异气，千里殊风雨。", "a": "四面八方的气候各不相同，相隔千里的风雨也大不一样。"}, {"q": "剧哉边海民，寄身于草野。", "a": "海边的百姓多么艰难啊，只能栖身在荒草野地之中。"}, {"q": "妻子象禽兽，行止依林阻。", "a": "妻子儿女过着禽兽般的生活，起居行走都依附于山林险阻之地。"}, {"q": "柴门何萧条，狐兔翔我宇。", "a": "柴门是多么萧条冷落，狐狸野兔在我的屋舍周围自由地窜行。"}], "book": "8a", "grade": "八年级上册", "id": 51}, {"title": "得道多助，失道寡助", "author": "《孟子》", "dynasty": "战国", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 《孟子》三章", "text": "天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。", "theme": "通过天时、地利、人和的层层比较，论证施行仁政、得民心者必胜的道理。", "notes": ["郭：外城；环：围", "池：护城河；兵革：泛指武器装备", "委而去之：委，放弃；去，离开", "域民不以封疆之界：域，使……定居", "畔：同“叛”，背叛", "亲戚：内外亲属，包括父系和母系亲属"], "dict": [{"q": "《得道多助，失道寡助》中提出全文中心论点、三者层层比较的句子是？", "a": "天时不如地利，地利不如人和。"}, {"q": "文中用排比否定句式指出巩固国防、威服天下不能靠疆界、险要与武力的句子是？", "a": "域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。"}, {"q": "《得道多助，失道寡助》中点明“人和”实质、揭示仁政重要性的核心论断是？", "a": "得道者多助，失道者寡助。"}, {"q": "文中写施行仁政与否的两种极端结果（对比鲜明）的句子是？", "a": "寡助之至，亲戚畔之；多助之至，天下顺之。"}, {"q": "《得道多助，失道寡助》中得出仁君不战则已、战必胜结论的句子是？", "a": "故君子有不战，战必胜矣。"}], "trans": [{"q": "天时不如地利，地利不如人和。", "a": "有利于作战的时令气候比不上有利的地理形势，有利的地理形势又比不上人心团结。"}, {"q": "三里之城，七里之郭，环而攻之而不胜。", "a": "方圆三里的内城，方圆七里的外城，四面包围起来攻打它却不能取胜。"}, {"q": "城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之", "a": "城墙不是不高，护城河不是不深，武器装备不是不精良，粮食不是不多，守城者却弃城而逃。"}, {"q": "域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。", "a": "使百姓定居下来不能靠疆域的边界，巩固国防不能靠山河的险要，威慑天下不能靠武器的锐利。"}, {"q": "寡助之至，亲戚畔之；多助之至，天下顺之。", "a": "帮助他的人少到极点，连内外亲属都会背叛他；帮助他的人多到极点，天下人都会归顺他。"}, {"q": "得道者多助，失道者寡助。", "a": "能施行仁政的君主，帮助支持他的人就多；不施行仁政的君主，帮助支持他的人就少。"}], "book": "8a", "grade": "八年级上册", "id": 52}, {"title": "富贵不能淫", "author": "《孟子》", "dynasty": "战国", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 《孟子》三章", "text": "景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”\n孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：‘往之女家，必敬必戒，无违夫子！’以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。”", "theme": "批驳景春所谓的大丈夫标准，阐明真正的大丈夫应坚守仁、礼、义而威武不屈。", "notes": ["诚：真正，确实；熄：平息，指战火熄灭", "冠：行冠礼，读guàn；命：教导、训诲", "女家：女同“汝”，指夫家", "以顺为正者：正，准则、标准", "淫：惑乱、迷惑；移：改变；屈：屈服", "广居、正位、大道：分别喻指仁、礼、义"], "dict": [{"q": "《富贵不能淫》中景春用来形容纵横家威势的句子是？", "a": "一怒而诸侯惧，安居而天下熄。"}, {"q": "《富贵不能淫》中以仁、礼、义为喻，写大丈夫立身准则的排比句是？", "a": "居天下之广居，立天下之正位，行天下之大道。"}, {"q": "《富贵不能淫》中写大丈夫得志与不得志时不同处世态度的句子是？", "a": "得志，与民由之；不得志，独行其道。"}, {"q": "文中概括真正大丈夫品格、千百年来志士仁人的座右铭是？", "a": "富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。"}], "trans": [{"q": "一怒而诸侯惧，安居而天下熄。", "a": "他们一发怒，诸侯就害怕；他们安居家中，天下便平安无事。"}, {"q": "以顺为正者，妾妇之道也。", "a": "把顺从当作做人的准则，这是妇女和妾婢的处世之道。"}, {"q": "往之女家，必敬必戒，无违夫子！", "a": "到了你的夫家，一定要恭敬，一定要谨慎，千万不要违背你的丈夫！"}, {"q": "居天下之广居，立天下之正位，行天下之大道。", "a": "住进天下最宽广的住宅仁，站在天下最正确的位置礼，走着天下最光明的道路义。"}, {"q": "得志，与民由之；不得志，独行其道。", "a": "能够实现志向时，就与百姓一同遵循正道；不能实现志向时，就独自坚守自己的原则。"}, {"q": "富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。", "a": "富贵不能使他迷惑，贫贱不能使他动摇，威武不能使他屈服，这样的人才称得上大丈夫。"}], "book": "8a", "grade": "八年级上册", "id": 53}, {"title": "生于忧患，死于安乐", "author": "《孟子》", "dynasty": "战国", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 《孟子》三章", "text": "舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。\n故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。\n人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。\n然后知生于忧患，而死于安乐也。", "theme": "举例论证人才须经艰苦磨炼造就，阐明忧患使人生存发展、安乐使人萎靡灭亡。", "notes": ["发：起，指被任用；举：选拔、任用", "士：狱官；市：集市", "空乏：财资缺乏；拂乱：拂，违背", "曾益：曾同“增”，增加", "衡于虑：衡同“横”，梗塞、不顺", "法家拂士：拂同“弼”，辅佐"], "dict": [{"q": "《生于忧患，死于安乐》中列举六位圣贤从卑微中被起用（举例论证）的句子是？", "a": "舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。"}, {"q": "《生于忧患，死于安乐》中阐述担当大任者必先经受身心磨炼的名句是？", "a": "故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。"}, {"q": "文中点明艰苦磨炼的目的（使人内心警觉、性格坚忍）的句子是？", "a": "所以动心忍性，曾益其所不能。"}, {"q": "《生于忧患，死于安乐》中从个人推及国家，指出国家灭亡的内外原因是？", "a": "入则无法家拂士，出则无敌国外患者，国恒亡。"}, {"q": "《生于忧患，死于安乐》中概括全文中心论点的句子是？", "a": "然后知生于忧患，而死于安乐也。"}], "trans": [{"q": "故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身", "a": "所以上天要把重任交给这个人，一定先使他的内心痛苦，使他的筋骨劳累，使他挨饿，使他身处贫困。"}, {"q": "行拂乱其所为，所以动心忍性，曾益其所不能。", "a": "使他做事不顺，以此来震撼他的心灵，使他的性格坚忍，增长他原本不具备的才能。"}, {"q": "困于心，衡于虑，而后作", "a": "内心困惑，思虑阻塞，这样之后才能奋发有所作为。"}, {"q": "征于色，发于声，而后喻。", "a": "一个人的想法表现在脸色上，流露在言谈中，这样之后才能被人了解。"}, {"q": "入则无法家拂士，出则无敌国外患者，国恒亡。", "a": "国内没有守法度的大臣和辅佐君王的贤士，国外没有敌对的国家和外来的忧患，国家常常会灭亡。"}, {"q": "然后知生于忧患，而死于安乐也。", "a": "这样以后才知道，常处忧愁祸患之中可以使人生存，常处安逸享乐之中会使人死亡。"}], "book": "8a", "grade": "八年级上册", "id": 54}, {"title": "愚公移山", "author": "《列子》", "dynasty": "战国", "genre": "文言文", "source": "课内", "unit": "第六单元 第23课 愚公移山", "text": "太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。\n北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。\n河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。\n操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。", "theme": "借愚公率子孙移山的故事，表现不畏艰难、坚持不懈的顽强意志与改造自然的信念。", "notes": ["且：将近；惩：苦于；迂：曲折，绕远", "杂然相许：纷纷表示赞同", "箕畚：名作状，用箕畚装土石", "始龀：刚换牙，约七八岁", "惠：同“慧”，聪明；彻：通达，这里指改变", "亡以应：亡同“无”；厝：放置；陇断：山冈阻隔"], "dict": [{"q": "《愚公移山》中交代愚公移山的原因（苦于大山阻塞、出入绕远）的句子是？", "a": "惩山北之塞，出入之迂也"}, {"q": "《愚公移山》中愚公提出移山目标、与家人商议的句子是？", "a": "吾与汝毕力平险，指通豫南，达于汉阴，可乎？"}, {"q": "《愚公移山》中写移山劳作往返艰难、历时长久的句子是？", "a": "寒暑易节，始一反焉。"}, {"q": "《愚公移山》中智叟嘲笑愚公不自量力、认为其无法撼动大山的句子是？", "a": "以残年余力，曾不能毁山之一毛，其如土石何？"}, {"q": "《愚公移山》中愚公反驳智叟、体现人定胜天的核心论据（子孙无穷而山不加增）是？", "a": "子子孙孙无穷匮也，而山不加增，何苦而不平？"}], "trans": [{"q": "惩山北之塞，出入之迂也", "a": "他苦于大山北面道路阻塞，进出都要绕很远的路。"}, {"q": "吾与汝毕力平险，指通豫南，达于汉阴，可乎？", "a": "我和你们尽全力铲平险峻的大山，一直通到豫州南部，到达汉水南岸，可以吗？"}, {"q": "以君之力，曾不能损魁父之丘，如太行、王屋何？", "a": "凭你的力气，连魁父这样的小山丘都削减不了，又能把太行山和王屋山怎么样呢？"}, {"q": "遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。", "a": "于是率领三个能挑担的子孙，凿石头挖泥土，用箕畚把土石运到渤海边上。"}, {"q": "汝心之固，固不可彻，曾不若孀妻弱子。", "a": "你的思想顽固，顽固到了不可改变的地步，竟然还不如寡妇和年幼的孩子。"}, {"q": "子子孙孙无穷匮也，而山不加增，何苦而不平？", "a": "子子孙孙无穷无尽，可是山却不会再增高加大，还愁什么挖不平呢？"}], "book": "8a", "grade": "八年级上册", "id": 55}, {"title": "周亚夫军细柳", "author": "司马迁", "dynasty": "汉", "genre": "文言文", "source": "课内", "unit": "第六单元 第24课 周亚夫军细柳", "text": "文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。\n上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰：‘军中闻将军令，不闻天子之诏。’”居无何，上至，又不得入。于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵揖曰：“介胄之士不拜，请以军礼见。”天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。\n既出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！”称善者久之。", "theme": "通过细柳营劳军的对比描写，刻画周亚夫治军严明、恪尽职守的“真将军”形象。", "notes": ["军细柳：军，驻军、驻扎；以备胡：用来防备匈奴", "被甲：被同“披”；彀：张开；持满：把弓拉满", "且至：将要到来；居无何：过了不久", "持节：手持符节；按辔：控制住车马", "持兵揖：手执兵器拱手行礼", "改容式车：式同“轼”，扶轼致敬；曩：先前"], "dict": [{"q": "《周亚夫军细柳》中写细柳军将士严阵以待、戒备森严的句子是？", "a": "军士吏被甲，锐兵刃，彀弓弩，持满。"}, {"q": "《周亚夫军细柳》中体现军纪高于皇权、军令重于诏令的句子是？", "a": "军中闻将军令，不闻天子之诏。"}, {"q": "《周亚夫军细柳》中周亚夫以军礼见天子、说明其恪尽职守的句子是？", "a": "介胄之士不拜，请以军礼见。"}, {"q": "《周亚夫军细柳》中汉文帝高度赞叹周亚夫的点睛之笔是？", "a": "嗟乎，此真将军矣！"}, {"q": "《周亚夫军细柳》中用霸上、棘门军作对比，突出细柳军不可侵犯的句子是？", "a": "曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！"}], "trans": [{"q": "军士吏被甲，锐兵刃，彀弓弩，持满。", "a": "军中官兵都披着铠甲，磨快兵器，张开弓弩，把弓拉得满满的。"}, {"q": "军中闻将军令，不闻天子之诏。", "a": "军营中只听从将军的命令，不听从天子发布的诏令。"}, {"q": "于是上乃使使持节诏将军", "a": "于是皇上就派使者手持符节去诏告周将军。"}, {"q": "介胄之士不拜，请以军礼见。", "a": "披甲戴盔的将士不能行跪拜礼，请允许我用军礼拜见皇上。"}, {"q": "天子为动，改容式车。", "a": "皇上被周亚夫感动，神情变得庄重，俯身扶着车前横木表示敬意。"}, {"q": "曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。", "a": "先前霸上和棘门的驻军，简直像儿戏一样，那里的将领必定可以被偷袭并俘虏。"}], "book": "8a", "grade": "八年级上册", "id": 56}, {"title": "饮酒（其五）", "author": "陶渊明", "dynasty": "东晋", "genre": "诗", "source": "课内", "unit": "第六单元 第25课 诗词五首", "text": "结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。", "theme": "写田园生活的闲适恬淡，表现诗人超脱尘俗、热爱自然、悠然自得的心境。", "notes": ["结庐：建造房舍；人境：喧嚣的尘世", "尔：这样，如此", "心远：心志高远，超脱世俗", "悠然：闲适自得的样子", "日夕：傍晚；相与：相伴", "欲辨已忘言：辨，分辨，点明只可意会不可言传"], "dict": [{"q": "《饮酒（其五）》中写诗人身居闹市却无车马喧嚣的句子是？", "a": "结庐在人境，而无车马喧。"}, {"q": "《饮酒（其五）》中以自问自答揭示远离尘嚣原因在于心境超脱的句子是？", "a": "问君何能尔？心远地自偏。"}, {"q": "陶渊明《饮酒（其五）》中被王国维称为“无我之境”的千古名句是？", "a": "采菊东篱下，悠然见南山。"}, {"q": "《饮酒（其五）》中写傍晚山间气象美好、飞鸟结伴归林的句子是？", "a": "山气日夕佳，飞鸟相与还。"}, {"q": "《饮酒（其五）》中点明人生真意只可意会不可言传的句子是？", "a": "此中有真意，欲辨已忘言。"}], "trans": [{"q": "结庐在人境，而无车马喧。", "a": "我把房舍建在人群聚居的地方，却没有车马的喧闹声。"}, {"q": "问君何能尔？心远地自偏。", "a": "问我为什么能这样？心志高远，住的地方自然就显得僻静了。"}, {"q": "采菊东篱下，悠然见南山。", "a": "在东边的篱笆下采摘菊花，闲适自得之间抬头看见了南山。"}, {"q": "山气日夕佳，飞鸟相与还。", "a": "傍晚时分山间的景色格外美好，飞鸟结伴着飞回山林。"}, {"q": "此中有真意，欲辨已忘言。", "a": "这里面蕴含着人生的真正意趣，想要分辨清楚，却已经忘了该怎么说。"}], "book": "8a", "grade": "八年级上册", "id": 57}, {"title": "春望", "author": "杜甫", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第六单元 第25课 诗词五首", "text": "国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。", "theme": "写安史之乱中长安残破景象，抒发忧国伤时、念家悲己的深沉感情。", "notes": ["国：国都，指长安；城：指长安城", "感时：感伤时局；恨别：怅恨离别", "烽火：战火；抵：值，相当于", "搔：用手挠；浑：简直", "不胜簪：插不住簪子，形容头发稀疏", "全诗以“望”字统摄，情景交融"], "dict": [{"q": "《春望》中写国都残破、山河依旧、满目荒凉的句子是？", "a": "国破山河在，城春草木深。"}, {"q": "《春望》中移情于物、以花鸟拟人，表达感时恨别之情的句子是？", "a": "感时花溅泪，恨别鸟惊心。"}, {"q": "《春望》中写战火连绵、家书珍贵难得的千古名句是？",
