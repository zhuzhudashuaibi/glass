身。"}, {"q": "已知泉路近，欲别故乡难。", "a": "已经知道黄泉之路临近，想要告别故乡却又难以割舍。"}, {"q": "毅魄归来日，灵旗空际看。", "a": "等到我坚毅的魂魄归来那一天，将在空中看到抗清的战旗。"}], "book": "9b", "grade": "九年级下册", "id": 123}, {"title": "山坡羊·骊山怀古", "author": "张养浩", "dynasty": "元", "genre": "曲", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "骊山四顾，阿房一炬，当时奢侈今何处？\n只见草萧疏，水萦纡。\n至今遗恨迷烟树。\n列国周齐秦汉楚。赢，都变做了土；输，都变做了土。", "theme": "骊山怀古，叹阿房一炬、奢侈成空，揭示列国争雄无论输赢终归荒芜的历史虚无。", "notes": ["骊山：在今陕西临潼。阿房：即阿房宫，秦代宫殿。一炬：指项羽火烧阿房宫。", "萧疏：稀疏，冷落。萦纡：回旋环绕，曲折。", "遗恨：遗留的憾恨。迷烟树：指遗恨消散在烟雾迷蒙的树林中。", "列国周齐秦汉楚：泛指历代在关中争霸的王朝。", "“赢，都变做了土；输，都变做了土”揭示争战结局的空幻。", "全曲以“变做了土”收束，讽刺封建统治者的争夺与奢靡。"], "dict": [{"q": "曲中写作者环顾骊山、追忆阿房宫被一把火烧尽，感叹当年奢侈今已无存的句子是：", "a": "骊山四顾，阿房一炬，当时奢侈今何处？"}, {"q": "曲中写眼前只见稀疏荒草、流水回环曲折，一片荒凉的句子是：", "a": "只见草萧疏，水萦纡。"}, {"q": "曲中写历代遗恨至今仍弥漫在烟雾迷蒙的树林中的句子是：", "a": "至今遗恨迷烟树。"}, {"q": "曲中点明无论列国争战是赢是输，最终都化为尘土，揭示历史沧桑的句子是：", "a": "列国周齐秦汉楚。赢，都变做了土；输，都变做了土。"}], "trans": [{"q": "骊山四顾，阿房一炬，当时奢侈今何处？", "a": "在骊山上四处眺望，阿房宫已被一把火烧光，当年的奢侈场面如今在哪里？"}, {"q": "只见草萧疏，水萦纡。", "a": "如今只见到野草稀疏，水波回旋萦绕。"}, {"q": "至今遗恨迷烟树。", "a": "到今天，当年的遗恨已隐没在烟雾迷蒙的树林之中。"}, {"q": "赢，都变做了土；输，都变做了土。", "a": "那些战胜的国家，都变成了土；战败的国家，也都变成了土。"}], "book": "9b", "grade": "九年级下册", "id": 124}, {"title": "朝天子·咏喇叭", "author": "王磐", "dynasty": "明", "genre": "曲", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "喇叭，唢呐，曲儿小腔儿大。\n官船来往乱如麻，全仗你抬声价。\n军听了军愁，民听了民怕。\n哪里去辨甚么真共假？\n眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！", "theme": "借咏喇叭讽刺宦官装腔作势、鱼肉百姓，揭露其给军民带来的深重灾难。", "notes": ["曲儿小腔儿大：曲子短小，声音却很大，讽刺宦官装腔作势。", "官船：官府的船，这里指宦官出行的船。乱如麻：形容来往频繁杂乱。", "声价：名声和身价。抬声价：抬高声望和身价。", "真共假：真的和假的。共，和。水尽鹅飞：水干鹅飞，形容家破人亡、财物散尽。", "全曲借物喻人，以喇叭喻宦官，讽刺辛辣。", "“军听了军愁，民听了民怕”直接写出军民对宦官的畏惧与怨恨。"], "dict": [{"q": "曲中写喇叭、唢呐曲调短小而声音极大，讽刺宦官装腔作势的句子是：", "a": "喇叭，唢呐，曲儿小腔儿大。"}, {"q": "曲中写官船来往频繁杂乱、全靠喇叭抬高声势的句子是：", "a": "官船来往乱如麻，全仗你抬声价。"}, {"q": "曲中直接写军民听到喇叭声就发愁害怕，揭露宦官作威作福的句子是：", "a": "军听了军愁，民听了民怕。"}, {"q": "曲中写百姓无处分辨真假，只能眼睁睁看着家破人亡、财物散尽的句子是：", "a": "眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！"}], "trans": [{"q": "喇叭，唢呐，曲儿小腔儿大。", "a": "喇叭和唢呐，吹的曲子短小，声音却很大。"}, {"q": "官船来往乱如麻，全仗你抬声价。", "a": "官船来来往往乱得像一团乱麻，全靠你来抬高声威和身价。"}, {"q": "军听了军愁，民听了民怕。", "a": "军人听了军人发愁，百姓听了百姓害怕。"}, {"q": "眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！", "a": "眼看着吹翻了这一家，吹伤了那一家，直吹得水干了、鹅飞光才罢休！"}], "book": "9b", "grade": "九年级下册", "id": 125}, {"title": "浣溪沙（漠漠轻寒上小楼）", "author": "秦观", "dynasty": "北宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）· 2026新版教材新增篇目", "text": "漠漠轻寒上小楼，晓阴无赖似穷秋。淡烟流水画屏幽。\n自在飞花轻似梦，无边丝雨细如愁。宝帘闲挂小银钩。", "theme": "写春晓薄寒中的淡淡闲愁，以飞花喻梦、丝雨喻愁，婉约含蓄。", "notes": ["漠漠：弥漫、广远的样子", "无赖：无可奈何", "穷秋：深秋", "“自在飞花轻似梦，无边丝雨细如愁”以具体景物比喻抽象情思"], "dict": [{"q": "秦观《浣溪沙》中写春日清晨轻寒袭人、天阴如深秋的句子是：", "a": "漠漠轻寒上小楼，晓阴无赖似穷秋。"}, {"q": "词中以飞花、丝雨比喻梦与轻愁的千古名句是：", "a": "自在飞花轻似梦，无边丝雨细如愁。"}, {"q": "词中描写室内陈设、烘托清幽氛围的句子是：", "a": "淡烟流水画屏幽。"}, {"q": "词中以景结情、含蓄收束全篇的句子是：", "a": "宝帘闲挂小银钩。"}], "trans": [{"q": "漠漠轻寒上小楼，晓阴无赖似穷秋。", "a": "带着淡淡的寒意登上小楼，清晨的阴天无端让人觉得像深秋一般萧索。"}, {"q": "淡烟流水画屏幽。", "a": "淡淡的烟霭与流动的江水映在画屏上，显得格外清幽。"}, {"q": "自在飞花轻似梦，无边丝雨细如愁。", "a": "自在飘飞的落花轻盈得像梦一般，无边无际的细雨细密得如同愁绪。"}, {"q": "宝帘闲挂小银钩。", "a": "华美的帘子悠闲地挂在小巧的银钩上。"}], "book": "9a", "grade": "九年级上册", "id": 126}];

const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const esc = s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm = s=>(s||"").replace(/[\s\u3000]/g,"").replace(/[，。、；：？！“”‘’（）《》〈〉·,.;:?!'"()\-—…～~]/g,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ================= 分句 ================= */
function splitCn(raw){
  const out=[]; let buf="";
  for(const ch of raw){
    buf+=ch;
    if("。！？；".indexOf(ch)>=0){ if(buf.trim()) out.push(buf.trim()); buf=""; }
  }
  if(buf.trim()) out.push(buf.trim());
  return out.filter(s=>s.length>3);
}
function sentences(it){
  const raw = it.text.replace(/\n/g,"");
  if(it.genre==="文言文") return splitCn(raw);
  return it.text.split("\n").map(s=>s.trim()).filter(Boolean);
}

/* ================= 题库构建 ================= */
const POOL = {dict:[],seq:[],trans:[]};
const SENTS = [];
DATA.forEach(it=>{
  it.dict.forEach(d=>POOL.dict.push({kind:"dict",title:it.title,grade:it.grade,book:it.book,genre:it.genre,
    q:d.q,a:d.a.replace(/\n/g,""),sub:""}));
  const ss = sentences(it);
  ss.forEach(s=>{ if(norm(s).length>=4) SENTS.push({s:s,title:it.title,grade:it.grade,genre:it.genre}); });
  const maxQ = it.genre==="文言文"?6:10;
  let n=0;
  for(let i=0;i<ss.length-1 && n<maxQ;i++){
    const up=ss[i], dn=ss[i+1];
    if(norm(up).length>34 || norm(dn).length>34) continue;
    if(Math.random()<0.62 || n===0){
      POOL.seq.push({kind:"seq",title:it.title,grade:it.grade,book:it.book,genre:it.genre,
        q:"请补写出下一句",a:dn,sub:up,dir:"下"}); n++;
    }else{
      POOL.seq.push({kind:"seq",title:it.title,grade:it.grade,book:it.book,genre:it.genre,
        q:"请补写出上一句",a:up,sub:dn,dir:"上"}); n++;
    }
  }
  it.trans.forEach(t=>{
    const oldS=t.q.replace(/\n/g,""), cn=t.a.replace(/\n/g,"");
    POOL.trans.push({kind:"trans",title:it.title,grade:it.grade,book:it.book,genre:it.genre,
      q:"下列句子的现代汉语译文是？",a:cn,sub:oldS,mode:"toCn"});
    POOL.trans.push({kind:"trans",title:it.title,grade:it.grade,book:it.book,genre:it.genre,
      q:"请根据译文默写出原句",a:oldS,sub:cn,mode:"toOld"});
  });
});
const TRANS_CN = POOL.trans.filter(x=>x.mode==="toCn").map(x=>({s:x.a,title:x.title}));

$("#cntDict").textContent = POOL.dict.length + " 题";
$("#cntSeq").textContent = POOL.seq.length + " 题";
$("#cntTrans").textContent = POOL.trans.length + " 题";
$("#poemCount").textContent = DATA.length + " 篇";

/* ================= 页面栈 ================= */
const FLOW=["p-setup","p-play","p-result"];   // 练习流程页
let stack=["p-poem"];
function show(to,from,dir){
  const toEl=$("#"+to), fromEl=from?$("#"+from):null;
  $$(".page").forEach(p=>{ if(p.id!==to && p.id!==from){p.classList.remove("active","behind");} });
  if(fromEl){ fromEl.classList.remove("active"); fromEl.classList.add("behind"); }
  toEl.classList.add("active");
  toEl.scrollTop = 0;
  // 兜底：若回到答题页时本轮已结束，自动重开一轮，避免出现“死页面”
  if(to==="p-play" && Q.length>0 && qi>=Q.length){ try{ buildQueue(); renderQ(); }catch(e){} }
}
function go(id){
  const from=stack[stack.length-1];
  if(from===id) return;
  stack.push(id); history.pushState({id},"","#"+id); show(id,from,"f");
}
function back(){
  if(stack.length>1) history.back();
}
/* 退出整个练习流程，回到进入练习前的根页面 */
function exitFlow(){
  clearAuto();
  const cur=stack[stack.length-1];
  const root=stack[0];
  stack=[root];
  history.replaceState({id:root},"","#"+root);
  show(root,cur,"b");
}
window.addEventListener("popstate",e=>{
  const cur=stack[stack.length-1];
  const id=(e.state&&e.state.id)||stack[0];
  if(cur===id) return;
  // 结果页上按返回（或点左上角）＝ 结束本轮，直接退出到根页面
  if(cur==="p-result"){ exitFlow(); return; }
  const idx=stack.lastIndexOf(id);
  if(idx>=0){
    stack=stack.slice(0,idx+1);
    show(id,cur,"b");
  }else if(FLOW.indexOf(id)>=0){
    // 历史记录与当前栈不匹配（如切换过 Tab），安全回退到根
    exitFlow();
  }else{
    stack.push(id); show(id,cur,"f");
  }
});
$$("[data-back]").forEach(b=>b.onclick=()=>back());
const rExit=$("#rExit"); if(rExit) rExit.onclick=()=>exitFlow();
history.replaceState({id:"p-poem"},"","#p-poem");

/* tab */
$$(".tab").forEach(t=>t.onclick=()=>{
  const id=t.dataset.tab;
  $$(".tab").forEach(x=>x.classList.toggle("on",x===t));
  const cur=stack[stack.length-1];
  const root = id==="p-poem" ? "p-poem" : "p-quiz";
  if(cur===root) return;
  stack=[root]; history.replaceState({id:root},"","#"+root);
  const fromEl=$("#"+cur);
  $$(".page").forEach(p=>p.classList.remove("active","behind"));
  fromEl.classList.remove("active");
  $("#"+root).classList.add("active");
});

/* 波纹 + 点击动画 */
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".tap");
  if(!el) return;
  const r=el.getBoundingClientRect();
  const s=document.createElement("span");
  s.className="ripple";
  const size=Math.max(r.width,r.height);
  s.style.width=s.style.height=size+"px";
  s.style.left=(e.clientX-r.left-size/2)+"px";
  s.style.top=(e.clientY-r.top-size/2)+"px";
  el.appendChild(s); setTimeout(()=>s.remove(),560);
});

/* ================= 古诗列表 ================= */
let curBook="", kw="";
const chipHtml=(v,label,on)=>`<div class="chip tap ${on?"on":""}" data-book="${v}">${label}</div>`;
function renderChips(){
  let h=chipHtml("","全部",curBook==="");
  BOOKS.forEach(([c,n])=>h+=chipHtml(c,n.replace("年级",""),curBook===c));
  $("#bookChips").innerHTML=h;
  $$("#bookChips .chip").forEach(c=>c.onclick=()=>{curBook=c.dataset.book;renderChips();renderList();});
}
function renderList(){
  const arr=DATA.filter(it=>{
    if(curBook && it.book!==curBook) return false;
    if(kw){
      const hay=(it.title+it.author+it.text+it.theme).toLowerCase();
      if(hay.indexOf(kw.toLowerCase())<0) return false;
    }
    return true;
  });
  if(!arr.length){ $("#poemList").innerHTML=`<div class="empty">没有找到相关篇目</div>`; return; }
  $("#poemList").innerHTML = arr.map((it,i)=>`
    <div class="pcard tap" data-id="${it.id}" style="animation-delay:${Math.min(i,14)*22}ms">
      <div class="grow">
        <div class="t">${esc(it.title)}</div>
        <div class="a">${esc(it.dynasty)}·${esc(it.author)} · ${it.source}</div>
      </div>
      <span class="tagx ${it.genre}">${it.genre}</span>
      <span class="arrow">›</span>
    </div>`).join("");
  $$("#poemList .pcard").forEach(c=>c.onclick=()=>openDetail(parseInt(c.dataset.id)));
}
$("#poemSearch").oninput=e=>{kw=e.target.value.trim();renderList();};
renderChips(); renderList();

function openDetail(id){
  const it=DATA[id];
  $("#dTop").textContent=it.title;
  let h=`<div style="margin:6px 0 14px">
      <div class="dtitle">${esc(it.title)}</div>
      <div class="dmeta">${esc(it.dynasty)}·${esc(it.author)}　${esc(it.grade)}${it.unit?"　"+esc(it.unit):""}</div></div>`;
  if(it.theme) h+=`<div class="theme"><b>主旨　</b>${esc(it.theme)}</div>`;
  h+=`<div class="card"><div class="h">原文</div>
      <div class="${it.genre==="文言文"?"prose":"poem"}">${esc(it.text)}</div></div>`;
  if(it.notes&&it.notes.length) h+=`<div class="card"><div class="h">要点注释</div><ul class="notes">${
      it.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;
  if(it.dict&&it.dict.length){
    h+=`<div class="card"><div class="h">理解性默写 · ${it.dict.length} 题</div><ol class="dl">`;
    it.dict.forEach((d,i)=>{
      h+=`<li><div>${esc(d.q)}<br><button class="mini tap" data-k="${i}">显示答案</button></div>
          <div class="ans" id="da${i}">${esc(d.a)}</div></li>`;
    });
    h+=`</ol></div>`;
  }
  if(it.trans&&it.trans.length){
    h+=`<div class="card"><div class="h">句子翻译 · ${it.trans.length} 句</div>`;
    it.trans.forEach((t,i)=>{
      h+=`<div style="margin-bottom:10px"><div style="font-family:'Songti SC',serif;font-size:15.5px">${esc(t.q)}</div>
          <div style="font-size:13.5px;color:#5A616B;margin-top:2px">译：${esc(t.a)}</div></div>`;
    });
    h+=`</div>`;
  }
  $("#detailBody").innerHTML=h;
  $$("#detailBody .mini").forEach(b=>b.onclick=()=>{
    const el=$("#da"+b.dataset.k); el.classList.toggle("show");
    b.textContent=el.classList.contains("show")?"隐藏答案":"显示答案";
  });
  $("#dQuiz").onclick=()=>{startSetup("dict",it.title);};
  go("p-detail");
}

/* ================= 练习设置 ================= */
let cfg={type:"dict",mode:"easy",scope:"",num:10,title:""};
const TYPE_NAME={dict:"理解性默写",seq:"上下句默写",trans:"翻译"};
function startSetup(type,title){
  cfg={type:type,mode:"easy",scope:"",num:10,title:title||""};
  $("#sTitle").textContent=TYPE_NAME[type];
  let sc=`<div class="chip tap on" data-scope="">全部</div>`;
  if(title) sc+=`<div class="chip tap" data-scope="__title">本篇</div>`;
  BOOKS.forEach(([c,n])=>sc+=`<div class="chip tap" data-scope="${c}">${n.replace("年级","")}</div>`);
  $("#scopeChips").innerHTML=sc;
  $$("#scopeChips .chip").forEach(c=>c.onclick=()=>{
    $$("#scopeChips .chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); cfg.scope=c.dataset.scope;
  });
  const nums=[10,20,30,0];
  $("#numChips").innerHTML=nums.map(n=>`<div class="chip tap ${n===10?"on":""}" data-num="${n}">${n===0?"全部":n+" 题"}</div>`).join("");
  $$("#numChips .chip").forEach(c=>c.onclick=()=>{
    $$("#numChips .chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); cfg.num=parseInt(c.dataset.num);
  });
  $$("#p-setup .opt").forEach(o=>{
    o.classList.toggle("on",o.dataset.mode==="easy");
    o.onclick=()=>{$$("#p-setup .opt").forEach(x=>x.classList.remove("on"));o.classList.add("on");cfg.mode=o.dataset.mode;};
  });
  go("p-setup");
}
$$(".qentry").forEach(e=>e.onclick=()=>startSetup(e.dataset.type));
$("#btnStart").onclick=()=>{ buildQueue(); go("p-play"); renderQ(); };

/* ================= 答题 ================= */
let Q=[],qi=0,right=0,wrongList=[],t0=0,answered=false;
function buildQueue(){
  let p=POOL[cfg.type].slice();
  if(cfg.scope==="__title") p=p.filter(x=>x.title===cfg.title);
  else if(cfg.scope) p=p.filter(x=>x.book===cfg.scope);
  if(cfg.type==="trans" && cfg.mode==="easy") p=p.filter(x=>x.mode==="toCn");
  if(cfg.type==="trans" && cfg.mode==="hard") p=p.filter(x=>x.mode==="toOld");
  shuffle(p);
  Q = cfg.num>0 ? p.slice(0,cfg.num) : p;
  qi=0;right=0;wrongList=[];t0=Date.now();answered=false;
  if(!Q.length){ alert("当前条件下没有题目，请调整范围。"); history.back(); }
}
function distract(ans,pool,exclude){
  const L=norm(ans).length;
  let c=pool.filter(x=>x.title!==exclude && norm(x.s)!==norm(ans) && Math.abs(norm(x.s).length-L)<=6);
  if(c.length<3) c=pool.filter(x=>x.title!==exclude && norm(x.s)!==norm(ans));
  shuffle(c);
  return c.slice(0,3).map(x=>x.s);
}
function renderQ(){
  clearAuto();
  const t=Q[qi];
  answered=false;
  $("#pNo").textContent=(qi+1)+"/"+Q.length;
  $("#pBar").style.width=(qi/Q.length*100)+"%";
  $("#pRight").textContent=right;
  $("#pType").textContent=TYPE_NAME[cfg.type]+" · "+(cfg.mode==="easy"?"简单":"困难");
  $("#qFrom").textContent=t.grade+" · "+t.title+" · "+t.genre;
  $("#qText").textContent=t.q;
  $("#fb").className="fb"; $("#fb").innerHTML="";
  if(t.sub){
    $("#qSub").classList.remove("hide");
    const pre = t.dir ? ("已知"+(t.dir==="上"?"下":"上")+"句：")
              : (t.kind==="trans" ? (t.mode==="toCn"?"原句：":"译文：") : "");
    $("#qSub").textContent = pre + t.sub;
  }
  else $("#qSub").classList.add("hide");

  if(cfg.mode==="easy"){
    $("#typedBox").classList.add("hide");
    $("#choices").classList.remove("hide");
    let opts;
    if(cfg.type==="trans") opts=distract(t.a,TRANS_CN,t.title);
    else opts=distract(t.a,SENTS,t.title);
    const all=shuffle([t.a].concat(opts));
    $("#choices").innerHTML=all.map((s,i)=>
      `<button class="choice tap" data-s="${esc(s).replace(/"/g,"&quot;")}" style="animation-delay:${i*45}ms">${esc(s)}</button>`).join("");
    $$("#choices .choice").forEach(b=>b.onclick=()=>pick(b));
    $("#actbar").innerHTML=`<button class="tap" id="btnSkip">跳过</button>
      <button class="pri tap hide" id="btnNext">下一题</button>`;
  }else{
    $("#choices").classList.add("hide");
    $("#typedBox").classList.remove("hide");
    $("#typedInput").value="";
    $("#actbar").innerHTML=`<button class="tap" id="btnTip">提示</button>
      <button class="tap" id="btnShow">看答案</button>
      <button class="pri tap" id="btnSubmit">提交</button>`;
    $("#btnSubmit").onclick=submitTyped;
    $("#btnTip").onclick=()=>{
      const n=norm(t.a); let s=n[0]; for(let i=1;i<n.length;i++) s+="＿";
      $("#fb").className="fb show"; $("#fb").innerHTML="提示："+s+"（共 "+n.length+" 字）";
    };
    $("#btnShow").onclick=()=>{ showFb(false,t.a,null); answered=true; swapNext(); };
  }
  const sk=$("#btnSkip"); if(sk) sk.onclick=()=>{ wrongList.push(t); qi++; next(); };
}
function pick(b){
  if(answered) return;
  answered=true;
  $$("#choices .choice").forEach(x=>x.onclick=null);
  const t=Q[qi];
  const ok = b.dataset.s === t.a;
  const real = Array.from($$("#choices .choice")).find(x=>x.dataset.s===t.a);
  if(ok){ b.classList.add("right"); right++; }
  else{ b.classList.add("wrong"); if(real) real.classList.add("right"); wrongList.push(t); }
  $("#pRight").textContent=right;
  showFb(ok,t.a,null);
  swapNext();
  if(ok){
    clearAuto();
    autoTimer=setTimeout(()=>{
      autoTimer=null;
      // 只有仍停留在答题页且该题尚未翻页时，才自动进入下一题
      if(stack[stack.length-1]!=="p-play") return;
      if(answered && $("#btnNext") && !$("#btnNext").classList.contains("hide")) next();
    },900);
  }
}
function submitTyped(){
  if(answered) return;
  const t=Q[qi], v=norm($("#typedInput").value);
  if(!v) return;
  answered=true;
  const ok = v===norm(t.a);
  if(ok) right++; else wrongList.push(t);
  $("#pRight").textContent=right;
  showFb(ok,t.a,$("#typedInput").value);
  swapNext();
}
function showFb(ok,ans,mine){
  const f=$("#fb");
  f.className="fb show "+(ok?"ok":"no");
  f.innerHTML=(ok?"<b>✓ 正确</b>":"<b>✗ 不正确</b>")
    + (mine!==null && !ok ? `<br><span style="font-size:13px">你的答案：${esc(mine)}</span>`:"")
    + `<span class="rightans">${esc(ans)}</span>`;
}
function swapNext(){
  const nx=$("#btnNext");
  if(nx){ nx.classList.remove("hide"); nx.onclick=next; }
  else{
    $("#actbar").innerHTML=`<button class="tap" id="btnTip">提示</button>
      <button class="pri tap" id="btnNext">下一题</button>`;
    $("#btnNext").onclick=next;
  }
}
function next(){
  qi++;
  if(qi>=Q.length){ finish(); return; }
  renderQ();
}
$("#pExit").onclick=()=>{ if(confirm("结束本轮练习？")) exitFlow(); };

/* ================= 结果 ================= */
function finish(){
  clearAuto();
  const total=Q.length, rate=Math.round(right/total*100);
  const sec=Math.round((Date.now()-t0)/1000);
  $("#rRate").textContent=0; $("#rRight").textContent=right;
  $("#rTotal").textContent=total; $("#rTime").textContent=sec+"s";
  const seen={},uniq=[];
  wrongList.forEach(w=>{ const k=w.q+w.a; if(!seen[k]){seen[k]=1;uniq.push(w);} });
  $("#rWrongTitle").textContent= uniq.length? `错题回顾 · ${uniq.length}` : "全部正确 🎉";
  $("#rWrong").innerHTML = uniq.length ? uniq.map(w=>`
    <div class="witem"><div class="q">${esc(w.q)}${w.sub?"｜"+esc(w.sub):""}</div>
      <div class="a">${esc(w.a)}</div>
      <div style="font-size:12px;color:var(--sub);margin-top:4px">${esc(w.title)}</div></div>`).join("")
    : `<div class="empty">太棒了，没有错题</div>`;
  // 分数动画
  let cur=0; const step=()=>{ cur+=Math.ceil(rate/28); if(cur>rate)cur=rate;
    $("#rRate").textContent=cur; if(cur<rate) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  if(stack[stack.length-1]==="p-result"){ show("p-result","p-result","f"); }
  else go("p-result");
}
/* 自动跳转定时器：必须在换题、结算、退出时清理，否则会把已结束的页面重新推回来 */
let autoTimer=null;
function clearAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }

/* 结果页重开一轮：把栈顶由 p-result 换回 p-play，历史同步修正，不新增层级 */
function replay(){
  stack.pop();                       // 弹出 p-result，栈顶回到 p-play
  history.replaceState({id:"p-play"},"","#p-play");
  show("p-play","p-result","b");
  renderQ();
}
$("#rAgain").onclick=()=>{ buildQueue(); replay(); };
$("#rWrongOnly").onclick=()=>{
  const seen={},uniq=[];
  wrongList.forEach(w=>{const k=w.q+w.a; if(!seen[k]){seen[k]=1;uniq.push(w);}});
  if(!uniq.length){alert("没有错题");return;}
  Q=shuffle(uniq); qi=0;right=0;wrongList=[];t0=Date.now();
  replay();
};
</script>
