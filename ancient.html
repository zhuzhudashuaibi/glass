 "a": "烽火连三月，家书抵万金。"}, {"q": "《春望》中以“搔头”细节表现忧国之深、苍老之态的句子是？", "a": "白头搔更短，浑欲不胜簪。"}], "trans": [{"q": "国破山河在，城春草木深。", "a": "国都残破，山河却依然存在；长安城里春意盎然，荒草长得十分茂密。"}, {"q": "感时花溅泪，恨别鸟惊心。", "a": "感伤时局，看到花开反而落泪；怅恨离别，听到鸟鸣反而心惊。"}, {"q": "烽火连三月，家书抵万金。", "a": "战火已经连续燃烧了三个月，一封家信简直抵得上万两黄金。"}, {"q": "白头搔更短，浑欲不胜簪。", "a": "满头白发越搔越稀疏，简直快要插不住一根簪子了。"}], "book": "8a", "grade": "八年级上册", "id": 58}, {"title": "雁门太守行", "author": "李贺", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第六单元 第25课 诗词五首", "text": "黑云压城城欲摧，甲光向日金鳞开。\n角声满天秋色里，塞上燕脂凝夜紫。\n半卷红旗临易水，霜重鼓寒声不起。\n报君黄金台上意，提携玉龙为君死。", "theme": "以浓墨重彩描绘悲壮惨烈的战争场面，歌颂守边将士浴血奋战、视死如归的气概。", "notes": ["摧：毁坏；金鳞：铠甲闪光如金色鱼鳞", "角：军中号角", "燕脂：同“胭脂”，这里指战场血迹", "易水：借荆轲典故暗寓悲壮", "黄金台：燕昭王招贤所筑，指君王知遇之恩", "玉龙：宝剑的代称"], "dict": [{"q": "《雁门太守行》中渲染敌军兵临城下、形势危急的名句是？", "a": "黑云压城城欲摧，甲光向日金鳞开。"}, {"q": "《雁门太守行》中从听觉与视觉两方面渲染战场悲壮气氛、写战场血迹的句子是？", "a": "角声满天秋色里，塞上燕脂凝夜紫。"}, {"q": "《雁门太守行》中写援军黑夜潜行、冒寒苦战（用易水典故）的句子是？", "a": "半卷红旗临易水，霜重鼓寒声不起。"}, {"q": "《雁门太守行》中引用典故直抒报国壮志、誓死效命的句子是？", "a": "报君黄金台上意，提携玉龙为君死。"}], "trans": [{"q": "黑云压城城欲摧，甲光向日金鳞开。", "a": "敌军如黑云压向城墙，城墙仿佛就要被摧毁；铠甲迎着阳光，像金色的鱼鳞闪闪发亮。"}, {"q": "角声满天秋色里，塞上燕脂凝夜紫。", "a": "秋色之中号角声响彻天空，边塞上将士的血迹在寒夜里凝成了紫色。"}, {"q": "半卷红旗临易水，霜重鼓寒声不起。", "a": "红旗半卷着，队伍抵达易水边上；夜寒霜重，连战鼓也擂不出响亮的声音。"}, {"q": "报君黄金台上意，提携玉龙为君死。", "a": "为了报答君王在黄金台上的知遇之恩，我愿手提宝剑为君王战死沙场。"}], "book": "8a", "grade": "八年级上册", "id": 59}, {"title": "赤壁", "author": "杜牧", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第六单元 第25课 诗词五首", "text": "折戟沉沙铁未销，自将磨洗认前朝。\n东风不与周郎便，铜雀春深锁二乔。", "theme": "借一件前朝遗物引发议论，抒发诗人怀才不遇的抑郁不平与对机遇的感慨。", "notes": ["折戟：折断的戟；销：销蚀", "将：拿，取；前朝：指三国时代", "周郎：周瑜", "铜雀：铜雀台，曹操所建", "二乔：大乔、小乔，以美人命运写东吴败亡", "以小见大、假设反说，是咏史抒怀名作"], "dict": [{"q": "《赤壁》中借一件沉埋沙中的古物引出对前朝人事慨叹的句子是？", "a": "折戟沉沙铁未销，自将磨洗认前朝。"}, {"q": "《赤壁》中以假设反说，用二乔命运写赤壁之战另一可能结局的句子是？", "a": "东风不与周郎便，铜雀春深锁二乔。"}, {"q": "《赤壁》中慨叹历史机遇对人（或国家命运）起决定作用的句子是？", "a": "东风不与周郎便，铜雀春深锁二乔。"}, {"q": "《赤壁》中诗人由发现古物而兴起怀古之情的起笔句是？", "a": "折戟沉沙铁未销，自将磨洗认前朝。"}], "trans": [{"q": "折戟沉沙铁未销", "a": "一支折断的铁戟沉埋在沙里，铁质还没有完全锈蚀。"}, {"q": "自将磨洗认前朝", "a": "我把它捡起来磨光洗净，辨认出这是前朝的遗物。"}, {"q": "东风不与周郎便", "a": "假如当年的东风不肯给周瑜方便，不助他一臂之力。"}, {"q": "铜雀春深锁二乔", "a": "那么铜雀台的深春里，就要永远锁住大乔和小乔了。"}], "book": "8a", "grade": "八年级上册", "id": 60}, {"title": "渔家傲（天接云涛连晓雾）", "author": "李清照", "dynasty": "宋", "genre": "词", "source": "课内", "unit": "第六单元 第25课 诗词五首", "text": "天接云涛连晓雾，星河欲转千帆舞。仿佛梦魂归帝所，闻天语，殷勤问我归何处。\n我报路长嗟日暮，学诗谩有惊人句。九万里风鹏正举。风休住，蓬舟吹取三山去！", "theme": "借梦境与天帝对话，抒发怀才不遇的苦闷，表达对理想境界与自由的热烈追求。", "notes": ["云涛：如波涛起伏的云；星河：银河", "帝所：天帝居住的地方；殷勤：情意恳切", "嗟：叹息；谩：同“漫”，空、徒然", "九万里风鹏：化用《庄子·逍遥游》大鹏典故", "蓬舟：如飞蓬般轻快的船", "三山：神话中蓬莱、方丈、瀛洲三座仙山"], "dict": [{"q": "李清照《渔家傲》中描绘海天相接、星河千帆的壮阔梦境（意境雄奇）的句子是？", "a": "天接云涛连晓雾，星河欲转千帆舞。"}, {"q": "李清照《渔家傲》中写梦魂来到天帝居所、听到关切询问的句子是？", "a": "仿佛梦魂归帝所，闻天语，殷勤问我归何处。"}, {"q": "李清照《渔家傲》中化用《离骚》意象，慨叹日暮途远、怀才不遇的句子是？", "a": "我报路长嗟日暮，学诗谩有惊人句。"}, {"q": "李清照《渔家傲》中化用大鹏典故，表达冲破束缚、追求理想的句子是？", "a": "九万里风鹏正举。风休住，蓬舟吹取三山去！"}], "trans": [{"q": "天接云涛连晓雾，星河欲转千帆舞。", "a": "云涛连着清晨的雾气与天空相接，银河仿佛要转动，千帆如起舞一般。"}, {"q": "仿佛梦魂归帝所，闻天语，殷勤问我归何处。", "a": "我的梦魂仿佛回到了天帝的居所，听见天帝关切地问我要回到哪里去。"}, {"q": "我报路长嗟日暮，学诗谩有惊人句。", "a": "我回答说路途漫长又感叹天色已晚，学诗也只是空有一些惊人的句子。"}, {"q": "九万里风鹏正举。风休住，蓬舟吹取三山去！", "a": "大风正托举着大鹏直上九万里。风啊不要停息，把我的轻舟吹到海上三座仙山去！"}], "book": "8a", "grade": "八年级上册", "id": 61}, {"title": "浣溪沙（一曲新词酒一杯）", "author": "晏殊", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？\n无可奈何花落去，似曾相识燕归来。小园香径独徘徊。", "theme": "抒发伤春惜时、物是人非的怅惘，蕴含时光流逝无可挽回的人生感慨。", "notes": ["新词：新填的词；旧亭台：去年到过的亭台", "香径：落花飘香的小径", "徘徊：来回走动", "“无可奈何花落去，似曾相识燕归来”对仗工巧、富含哲理", "夕阳、落花、归燕三个意象交织抒情", "全词语言清丽自然，属婉约小令名作"], "dict": [{"q": "晏殊《浣溪沙》中写对酒听歌、景物依旧而时光流逝的句子是？", "a": "一曲新词酒一杯，去年天气旧亭台。"}, {"q": "晏殊《浣溪沙》中由夕阳西下引发对时光流逝追问的句子是？", "a": "夕阳西下几时回？"}, {"q": "晏殊《浣溪沙》中蕴含自然规律不可抗拒与旧识重逢辩证哲理的千古名句是？", "a": "无可奈何花落去，似曾相识燕归来。"}, {"q": "晏殊《浣溪沙》中写词人独自在园中小路徘徊、孤寂落寞的句子是？", "a": "小园香径独徘徊。"}], "trans": [{"q": "一曲新词酒一杯，去年天气旧亭台。", "a": "听一支新填的词，饮一杯美酒，天气和去年相同，亭台还是旧日模样。"}, {"q": "夕阳西下几时回？", "a": "夕阳向西沉落下去，什么时候才能再回来呢？"}, {"q": "无可奈何花落去，似曾相识燕归来。", "a": "花儿凋落让人无可奈何，那飞回来的燕子好像曾经相识一般。"}, {"q": "小园香径独徘徊。", "a": "我独自在园中落花飘香的小路上来回地踱步徘徊。"}], "book": "8a", "grade": "八年级上册", "id": 62}, {"title": "采桑子（轻舟短棹西湖好）", "author": "欧阳修", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "轻舟短棹西湖好，绿水逶迤。芳草长堤，隐隐笙歌处处随。\n无风水面琉璃滑，不觉船移。微动涟漪，惊起沙禽掠岸飞。", "theme": "描绘颍州西湖春日的清丽风光，抒发泛舟湖上的闲适愉悦与流连之情。", "notes": ["棹：船桨；西湖：指颍州西湖", "逶迤：绵延曲折的样子", "琉璃：比喻光滑平静的水面", "涟漪：水面细微的波纹", "沙禽：沙洲上的水鸟", "以动衬静，全词笔调轻松淡雅"], "dict": [{"q": "欧阳修《采桑子》中总写西湖风光美好、绿水绵延的句子是？", "a": "轻舟短棹西湖好，绿水逶迤。"}, {"q": "欧阳修《采桑子》中从视觉与听觉写长堤芳草、隐隐笙歌的句子是？", "a": "芳草长堤，隐隐笙歌处处随。"}, {"q": "欧阳修《采桑子》中以琉璃为喻写湖面平静光滑、船行不知不觉的句子是？", "a": "无风水面琉璃滑，不觉船移。"}, {"q": "欧阳修《采桑子》中以动衬静、写水鸟惊飞掠岸的句子是？", "a": "微动涟漪，惊起沙禽掠岸飞。"}], "trans": [{"q": "轻舟短棹西湖好，绿水逶迤。", "a": "驾着小船、划着短桨，西湖的风景真美好，碧绿的湖水绵延曲折。"}, {"q": "芳草长堤，隐隐笙歌处处随。", "a": "长堤上芳草青青，隐隐约约的笙歌之声到处相随着传来。"}, {"q": "无风水面琉璃滑，不觉船移。", "a": "没有风的时候，水面像琉璃一样平滑光亮，让人觉察不到船在移动。"}, {"q": "微动涟漪，惊起沙禽掠岸飞。", "a": "水面微微荡起细细的波纹，惊动了沙滩上的水鸟，贴着湖岸飞走了。"}], "book": "8a", "grade": "八年级上册", "id": 63}, {"title": "相见欢（金陵城上西楼）", "author": "朱敦儒", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "金陵城上西楼，倚清秋。万里夕阳垂地大江流。\n中原乱，簪缨散，几时收？试倩悲风吹泪过扬州。", "theme": "登楼远眺故国秋色，抒发中原沦丧、渴望收复失地的沉痛爱国之情。", "notes": ["金陵：今南京；倚清秋：倚楼眺望清冷秋色", "簪缨：代指达官贵人", "几时收：何时才能收复失地", "倩（qìng）：请人代自己做", "扬州：当时抗金前线，代指沦陷区", "上片写景、下片抒情，风格慷慨悲凉"], "dict": [{"q": "朱敦儒《相见欢》中写登楼所见、营造苍凉萧瑟秋日暮景的句子是？", "a": "金陵城上西楼，倚清秋。万里夕阳垂地大江流。"}, {"q": "朱敦儒《相见欢》中以三个短句概括中原沦陷、贵族流散惨状的句子是？", "a": "中原乱，簪缨散，几时收？"}, {"q": "朱敦儒《相见欢》中运用拟人手法，请悲风将泪水吹向抗金前线、抒发亡国之痛的句子是？", "a": "试倩悲风吹泪过扬州。"}, {"q": "朱敦儒《相见欢》中含蓄表达渴望收复失地这一沉痛发问的句子是？", "a": "中原乱，簪缨散，几时收？"}], "trans": [{"q": "金陵城上西楼，倚清秋。", "a": "我登上金陵城上的西楼，凭栏眺望这清冷的秋色。"}, {"q": "万里夕阳垂地大江流。", "a": "夕阳的余晖垂落在万里大地，浩荡的长江依旧奔流不息。"}, {"q": "中原乱，簪缨散，几时收？", "a": "中原沦陷战乱不止，达官显贵纷纷离散，失地什么时候才能收复？"}, {"q": "试倩悲风吹泪过扬州。", "a": "请那悲凉的秋风，把我的泪水一路吹送到扬州前线去吧。"}], "book": "8a", "grade": "八年级上册", "id": 64}, {"title": "如梦令（常记溪亭日暮）", "author": "李清照", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "常记溪亭日暮，沉醉不知归路。兴尽晚回舟，误入藕花深处。争渡，争渡，惊起一滩鸥鹭。", "theme": "追忆少女时溪亭游赏、迷途争渡的趣事，表现早年生活的欢愉与热爱自然的情怀。", "notes": ["常记：常常记起；溪亭：溪边的亭台", "沉醉：大醉，这里指陶醉于美景", "兴尽：游兴已尽", "藕花：荷花", "争渡：奋力把船划出去", "连用叠句“争渡”，节奏急促，画面灵动"], "dict": [{"q": "李清照《如梦令》中交代游玩时间地点与沉醉忘归的情状的句子是？", "a": "常记溪亭日暮，沉醉不知归路。"}, {"q": "李清照《如梦令》中写兴尽归舟却误入荷塘深处的句子是？", "a": "兴尽晚回舟，误入藕花深处。"}, {"q": "李清照《如梦令》中连用叠句、写奋力划船惊起水鸟的欢快场景的句子是？", "a": "争渡，争渡，惊起一滩鸥鹭。"}, {"q": "李清照《如梦令》中表现词人沉醉于美景而流连忘返的句子是？", "a": "常记溪亭日暮，沉醉不知归路。"}], "trans": [{"q": "常记溪亭日暮", "a": "我还常常记起在溪边亭子里游玩，一直到太阳西沉。"}, {"q": "沉醉不知归路", "a": "大家沉醉在欢乐之中，竟然忘记了回家的路。"}, {"q": "兴尽晚回舟，误入藕花深处。", "a": "游兴尽了天色已晚才掉转船头，却不小心划进了荷塘的深处。"}, {"q": "争渡，争渡，惊起一滩鸥鹭。", "a": "奋力把船划出去，奋力把船划出去，桨声惊起了滩边的一群鸥鸟和白鹭。"}], "book": "8a", "grade": "八年级上册", "id": 65}, {"title": "桃花源记", "author": "陶渊明", "dynasty": "东晋", "genre": "文言文", "source": "课内", "unit": "第三单元 第9课 桃花源记", "text": "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。\n林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”\n既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。\n南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。", "theme": "虚构宁静和乐的世外桃源，寄托对无战乱、无剥削的理想社会的向往。", "notes": ["缘：沿着，顺着。", "落英缤纷：落花繁多的样子。英，花。", "要：同“邀”，邀请。", "妻子：妻子儿女；绝境：与人世隔绝的地方。", "无论：不要说，更不必说。", "遂迷，不复得路／后遂无问津者：暗示理想社会现实中不可寻。"], "dict": [{"q": "《桃花源记》中写渔人被桃花林吸引、想走到林子尽头的句子：", "a": "渔人甚异之，复前行，欲穷其林。"}, {"q": "《桃花源记》中描写桃花源内土地肥沃、环境优美的句子：", "a": "土地平旷，屋舍俨然，有良田、美池、桑竹之属。"}, {"q": "《桃花源记》中写老人和小孩都安闲快乐的句子：", "a": "黄发垂髫，并怡然自乐。"}, {"q": "《桃花源记》中交代村人避秦时乱、与世隔绝原因的句子：", "a": "自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。"}, {"q": "《桃花源记》中写渔人背信弃义、再寻桃源却迷失路途的句子：", "a": "太守即遣人随其往，寻向所志，遂迷，不复得路。"}], "trans": [{"q": "芳草鲜美，落英缤纷。", "a": "芳香的青草鲜嫩美丽，飘落的花瓣繁多纷乱。"}, {"q": "渔人甚异之，复前行，欲穷其林。", "a": "渔人对此感到十分惊异，又继续往前走，想要走到那片桃花林的尽头。"}, {"q": "土地平旷，屋舍俨然，有良田、美池、桑竹之属。", "a": "土地平坦开阔，房屋整整齐齐，有肥沃的田地、美丽的池塘和桑树竹子之类。"}, {"q": "阡陌交通，鸡犬相闻。", "a": "田间小路纵横交错、四通八达，村落间鸡鸣狗吠的声音能互相听见。"}, {"q": "率妻子邑人来此绝境，不复出焉，遂与外人间隔。", "a": "祖先率领妻子儿女和同乡人来到这与世隔绝的地方，不再出去，于是同外界断绝了往来。"}, {"q": "问今是何世，乃不知有汉，无论魏晋。", "a": "他们问现在是什么朝代，竟然不知道有过汉朝，更不用说魏朝和晋朝了。"}], "book": "8b", "grade": "八年级下册", "id": 66}, {"title": "小石潭记", "author": "柳宗元", "dynasty": "唐", "genre": "文言文", "source": "课内", "unit": "第三单元 第10课 小石潭记", "text": "从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。\n潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽。似与游者相乐。\n潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。\n坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。\n同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。", "theme": "描绘小石潭清幽之景，抒发贬谪生活中孤寂悲凉、凄苦失意的心绪。", "notes": ["如鸣珮环：好像珮环碰撞的声音。珮、环，都是玉饰。", "冽：凉。坻：水中高地。嵁：不平的岩石。", "可百许头：大约有一百来条。可，大约。", "佁然：静止不动的样子；俶尔：忽然。", "斗折蛇行：像北斗星那样曲折，像蛇那样蜿蜒前行。", "凄神寒骨，悄怆幽邃：凄清寂寞、幽深悲凉，是全文点睛之笔。"], "dict": [{"q": "《小石潭记》中侧面描写潭水清澈、写游鱼如在空中游动的句子：", "a": "潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。"}, {"q": "《小石潭记》中动静结合、写游鱼由静而动的句子：", "a": "佁然不动，俶尔远逝，往来翕忽。"}, {"q": "《小石潭记》中用比喻写溪身曲折蜿蜒、时隐时现的句子：", "a": "斗折蛇行，明灭可见。"}, {"q": "《小石潭记》中点明凄清气氛、暗示贬谪孤寂之情的句子：", "a": "凄神寒骨，悄怆幽邃。"}, {"q": "《小石潭记》中交代作者记之而去的缘由的句子：", "a": "以其境过清，不可久居，乃记之而去。"}], "trans": [{"q": "隔篁竹，闻水声，如鸣珮环，心乐之。", "a": "隔着成片的竹林听到了水声，像玉佩玉环碰撞的声响，我心里因此很高兴。"}, {"q": "青树翠蔓，蒙络摇缀，参差披拂。", "a": "青葱的树木和翠绿的藤蔓，遮掩缠绕，摇动下垂，参差不齐，随风飘拂。"}, {"q": "潭中鱼可百许头，皆若空游无所依", "a": "潭中的鱼大约有一百来条，都好像在空中游动一样，没有什么依凭。"}, {"q": "潭西南而望，斗折蛇行，明灭可见。", "a": "向小石潭的西南方向望去，溪水像北斗星那样曲折，像蛇那样蜿蜒前行，时隐时现。"}, {"q": "其岸势犬牙差互，不可知其源。", "a": "溪岸的形势像狗的牙齿那样交错不齐，无法知道它的源头在哪里。"}, {"q": "以其境过清，不可久居，乃记之而去。", "a": "因为这里的环境过于凄清，不能长时间停留，于是记下这番景致后就离开了。"}], "book": "8b", "grade": "八年级下册", "id": 67}, {"title": "核舟记", "author": "魏学洢", "dynasty": "明", "genre": "文言文", "source": "课内", "unit": "第三单元 第11课 核舟记", "text": "明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。\n舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。\n船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。\n舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。\n其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，细若蚊足，钩画了了，其色墨。又用篆章一，文曰“初平山人”，其色丹。\n通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！", "theme": "细致描摹微雕核舟的精巧，赞叹民间艺人王叔远高超绝伦的雕刻技艺。", "notes": ["径寸之木：直径一寸的木头。径，直径。", "罔不因势象形：全都是就着材料原来的样子刻成各种事物的形象。", "贻：赠。盖大苏泛赤壁云：刻的是苏轼游赤壁的情形。", "峨冠：高高的帽子；髯：两腮的胡须。", "诎：同“屈”，弯曲。衡：同“横”。简：同“拣”，挑选。", "曾不盈寸：竟然不满一寸。曾，竟然。盈，满。"], "dict": [{"q": "《核舟记》中写王叔远用料极小而雕刻内容丰富的句子：", "a": "能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石"}, {"q": "《核舟记》中概括雕刻者构思巧妙、作品各具情态的句子：", "a": "罔不因势象形，各具情态。"}, {"q": "《核舟记》中点明核舟雕刻主题的句子：", "a": "盖大苏泛赤壁云。"}, {"q": "《核舟记》中写窗上所刻对联及着色的句子：", "a": "右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。"}, {"q": "《核舟记》中直接赞叹技艺高超、点明中心的句子：", "a": "技亦灵怪矣哉！"}], "trans": [{"q": "罔不因势象形，各具情态。", "a": "没有一件不是就着木头原来的样子模拟事物的形状，各有各的神情姿态。"}, {"q": "舟首尾长约八分有奇，高可二黍许。", "a": "船从头到尾大约有八分多长，高度大约有两个黄米粒那么高。"}, {"q": "启窗而观，雕栏相望焉。", "a": "打开小窗来看，雕刻着花纹的栏杆左右相对望。"}, {"q": "其两膝相比者，各隐卷底衣褶中。", "a": "他们互相靠近的两膝，都隐藏在手卷下边的衣褶里面。"}, {"q": "佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。", "a": "佛印极像弥勒佛，敞开衣襟露出胸膛，抬头仰望，神情和苏轼、黄庭坚不相类似。"}, {"q": "其人视端容寂，若听茶声然。", "a": "那个人的目光正视着炉子，神色平静，好像在倾听茶水烧开的声音一样。"}], "book": "8b", "grade": "八年级下册", "id": 68}, {"title": "关雎", "author": "《诗经》", "dynasty": "先秦", "genre": "民歌", "source": "课内", "unit": "第三单元 第12课 《诗经》二首·关雎", "text": "关关雎鸠，在河之洲。\n窈窕淑女，君子好逑。\n参差荇菜，左右流之。\n窈窕淑女，寤寐求之。\n求之不得，寤寐思服。\n悠哉悠哉，辗转反侧。\n参差荇菜，左右采之。\n窈窕淑女，琴瑟友之。\n参差荇菜，左右芼之。\n窈窕淑女，钟鼓乐之。", "theme": "写君子对窈窕淑女的热恋与追求，表现对美好婚姻的向往与喜悦。", "notes": ["关关：鸟鸣声。雎鸠：一种水鸟。", "窈窕：文静美好的样子。逑：配偶。", "流：捞取。寤寐：日日夜夜。思服：思念。", "芼：挑选。乐之：使她快乐。", "起兴手法：以“关关雎鸠，在河之洲”引出爱情主题。", "重章叠句，一唱三叹；“悠哉悠哉，辗转反侧”写相思难眠。"], "dict": [{"q": "《关雎》中以水鸟和鸣起兴、引出爱情主题的句子：", "a": "关关雎鸠，在河之洲。"}, {"q": "《关雎》中统摄全篇、写君子以淑女为佳偶的句子：", "a": "窈窕淑女，君子好逑。"}, {"q": "《关雎》中写君子追求未得、日夜思念的句子：", "a": "求之不得，寤寐思服。"}, {"q": "《关雎》中写相思难眠、长夜翻来覆去的句子：", "a": "悠哉悠哉，辗转反侧。"}, {"q": "《关雎》中写想象求得淑女、以钟鼓迎娶的欢快句子：", "a": "窈窕淑女，钟鼓乐之。"}], "trans": [{"q": "关关雎鸠，在河之洲。", "a": "雎鸠鸟在河中的小洲上关关地鸣叫着。"}, {"q": "窈窕淑女，君子好逑。", "a": "文静善良的美好女子，是君子理想的配偶。"}, {"q": "参差荇菜，左右流之。", "a": "长短不齐的荇菜，在船的左右两边捞取它。"}, {"q": "求之不得，寤寐思服。", "a": "追求她却没有得到，无论醒着睡着都在思念她。"}, {"q": "悠哉悠哉，辗转反侧。", "a": "思念之情绵绵不断，我在床上翻来覆去难以入睡。"}], "book": "8b", "grade": "八年级下册", "id": 69}, {"title": "蒹葭", "author": "《诗经》", "dynasty": "先秦", "genre": "民歌", "source": "课内", "unit": "第三单元 第12课 《诗经》二首·蒹葭", "text": "蒹葭苍苍，白露为霜。\n所谓伊人，在水一方。\n溯洄从之，道阻且长。\n溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。\n所谓伊人，在水之湄。\n溯洄从之，道阻且跻。\n溯游从之，宛在水中坻。\n蒹葭采采，白露未已。\n所谓伊人，在水之涘。\n溯洄从之，道阻且右。\n溯游从之，宛在水中沚。", "theme": "写深秋时节对意中人执着追寻而可望不可即的惆怅与凄婉之情。", "notes": ["蒹葭：芦苇。苍苍：茂盛的样子。", "伊人：那人，指所爱的人。在水一方：在水的另一边。", "溯洄：逆流而上。溯游：顺流而下。", "晞：干。湄：岸边。跻：高。涘：水边。沚：水中的小块陆地。", "以秋景起兴，渲染凄清气氛，烘托惆怅心情。", "重章叠句，三章只换数字，往复咏叹，意境朦胧。"], "dict": [{"q": "《蒹葭》中以萧瑟秋景起兴、渲染凄清气氛的句子：", "a": "蒹葭苍苍，白露为霜。"}, {"q": "《蒹葭》中点明意中人在远方、可望而不可即的句子：", "a": "所谓伊人，在水一方。"}, {"q": "《蒹葭》中写逆流追寻而道路艰险漫长的句子：", "a": "溯洄从之，道阻且长。"}, {"q": "《蒹葭》中写顺流追寻、若隐若现终不可得的句子：", "a": "溯游从之，宛在水中央。"}, {"q": "《蒹葭》中写道路陡峻难行、追寻之路更加艰险的句子：", "a": "溯洄从之，道阻且跻。"}, {"q": "《蒹葭》中写白露未干、时令推移而追寻不止的句子：", "a": "蒹葭萋萋，白露未晞。"}], "trans": [{"q": "蒹葭苍苍，白露为霜。", "a": "河边的芦苇一片苍翠茂盛，清晨的露水已经凝结成了白霜。"}, {"q": "所谓伊人，在水一方。", "a": "我心中思念的那个人，就在河水的另一边。"}, {"q": "溯洄从之，道阻且长。", "a": "逆着水流去追寻她，道路既艰险又漫长。"}, {"q": "溯游从之，宛在水中央。", "a": "顺着水流去追寻她，她好像就站在水的中央。"}, {"q": "溯洄从之，道阻且跻。溯游从之，宛在水中坻。", "a": "逆流而上去寻她，道路险峻又高又难攀登；顺流而下去寻她，她仿佛就在水中的小洲上。"}], "book": "8b", "grade": "八年级下册", "id": 70}, {"title": "式微", "author": "《诗经》", "dynasty": "先秦", "genre": "民歌", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "式微式微，胡不归？\n微君之故，胡为乎中露？\n式微式微，胡不归？\n微君之躬，胡为乎泥中？", "theme": "写劳役者天黑仍劳作于露水泥中，表达对繁重劳役的怨愤。", "notes": ["式：语气助词。微：昏暗，指天黑。", "胡：何，为什么。微君：如果不是为了君主。", "中露：露水中。躬：身体。", "设问手法：“式微式微，胡不归”并非有疑而问，是胸中早有定见。", "重章叠句，只换“故／躬”“中露／泥中”数字。", "属于《诗经·邶风》的劳役怨诗，直抒劳役者的怨愤。"], "dict": [{"q": "《式微》中以设问引出劳役者天黑仍不能归家的句子：", "a": "式微式微，胡不归？"}, {"q": "《式微》中写劳役者为君主而在露水中劳作的句子：", "a": "微君之故，胡为乎中露？"}, {"q": "《式微》中写劳役者为君主而在泥水中劳作的句子：", "a": "微君之躬，胡为乎泥中？"}, {"q": "《式微》中重章叠句、写劳役者终年劳作有家难归的一章：", "a": "式微式微，胡不归？\n微君之故，胡为乎中露？"}], "trans": [{"q": "式微式微，胡不归？", "a": "天色已经昏暗了，天色已经昏暗了，为什么还不回家呢？"}, {"q": "微君之故，胡为乎中露？", "a": "如果不是为了君主的缘故，我怎么会在露水中辛苦劳作？"}, {"q": "微君之躬，胡为乎泥中？", "a": "如果不是为了君主自身，我怎么会陷在泥水里受这份苦？"}, {"q": "式微式微，胡不归？微君之故，胡为乎中露？", "a": "天黑了天黑了，为什么还不回去？若不是为了君王，我怎会顶着夜露奔波？"}], "book": "8b", "grade": "八年级下册", "id": 71}, {"title": "子衿", "author": "《诗经》", "dynasty": "先秦", "genre": "民歌", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "青青子衿，悠悠我心。\n纵我不往，子宁不嗣音？\n青青子佩，悠悠我思。\n纵我不往，子宁不来？\n挑兮达兮，在城阙兮。\n一日不见，如三月兮！", "theme": "写女子在城楼等候恋人，抒发相思深切、久候不至的惆怅幽怨。", "notes": ["子衿：你的衣领。子佩：你佩带的佩玉的带子。", "悠悠：深思的样子。宁：难道。嗣音：继续通音信。", "挑兮达兮：独自徘徊的样子。城阙：城门两边的楼台。", "借代手法：以“子衿”“子佩”代指恋人。", "倒叙手法，先写思念再由等待转入幽怨。", "夸张：“一日不见，如三月兮”极言相思之深。"], "dict": [{"q": "《子衿》中以恋人衣饰代指其人、表达思念的句子：", "a": "青青子衿，悠悠我心。"}, {"q": "《子衿》中反问对方为何不捎音信的句子：", "a": "纵我不往，子宁不嗣音？"}, {"q": "《子衿》中反问对方为何不主动前来的句子：", "a": "纵我不往，子宁不来？"}, {"q": "《子衿》中写女子独自在城楼上徘徊等待的句子：", "a": "挑兮达兮，在城阙兮。"}, {"q": "《子衿》中用夸张写相思之深、度日如年的句子：", "a": "一日不见，如三月兮！"}], "trans": [{"q": "青青子衿，悠悠我心。", "a": "你那青青的衣领，牵动着我不尽的悠悠思念之情。"}, {"q": "纵我不往，子宁不嗣音？", "a": "纵然我不曾去找你，难道你就不能给我捎来一点音信吗？"}, {"q": "纵我不往，子宁不来？", "a": "纵然我不去你那里，你难道就不能自己主动过来吗？"}, {"q": "挑兮达兮，在城阙兮。", "a": "我独自在城门两边的楼台上走来走去，焦急地张望等候。"}, {"q": "一日不见，如三月兮！", "a": "仅仅一天没有见到你，就好像分别了三个月那样漫长！"}], "book": "8b", "grade": "八年级下册", "id": 72}, {"title": "送杜少府之任蜀州", "author": "王勃", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比邻。\n无为在歧路，儿女共沾巾。", "theme": "送别友人赴任，抒发旷达乐观的胸襟与真挚友情不受时空阻隔的感慨。", "notes": ["城阙：指长安。辅：护卫。三秦：关中地区。", "五津：岷江的五个渡口，这里指蜀州。", "宦游人：出外做官的人。歧路：岔路，指分手处。", "首联意境开阔，点明送别地与赴任地。", "“海内存知己，天涯若比邻”为千古名句。", "不同于一般送别诗的悲酸，格调高昂、乐观旷达。"], "dict": [{"q": "《送杜少府之任蜀州》中点明送别之地和友人赴任之地、意境开阔的句子：", "a": "城阙辅三秦，风烟望五津。"}, {"q": "《送杜少府之任蜀州》中以同是宦游之人宽慰友人的句子：", "a": "与君离别意，同是宦游人。"}, {"q": "《送杜少府之任蜀州》中表达真挚友情不受时空阻隔的千古名句：", "a": "海内存知己，天涯若比邻。"}, {"q": "《送杜少府之任蜀州》中劝慰友人不要儿女情长、泪湿衣襟的句子：", "a": "无为在歧路，儿女共沾巾。"}], "trans": [{"q": "城阙辅三秦，风烟望五津。", "a": "三秦大地护卫着长安的城楼宫阙，风烟迷茫中遥望蜀州的五处渡口。"}, {"q": "与君离别意，同是宦游人。", "a": "我与你都怀着离别的愁绪，因为我们同是离乡在外做官的人。"}, {"q": "海内存知己，天涯若比邻。", "a": "只要四海之内还有知心的朋友，即使远在天边也如同近邻一般。"}, {"q": "无为在歧路，儿女共沾巾。", "a": "不要在分手的岔路口上，像小儿女那样让泪水沾湿了手巾。"}], "book": "8b", "grade": "八年级下册", "id": 73}, {"title": "望洞庭湖赠张丞相", "author": "孟浩然", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "八月湖水平，涵虚混太清。\n气蒸云梦泽，波撼岳阳城。\n欲济无舟楫，端居耻圣明。\n坐观垂钓者，徒有羡鱼情。", "theme": "描绘洞庭湖壮阔气势，委婉表达希望得到引荐、一展抱负的心愿。", "notes": ["涵虚：指洞庭湖涵容天宇。太清：天空。", "云梦泽：古代大泽名，在湖北湖南一带。", "济：渡。舟楫：船和桨，这里借指引荐的人。", "端居：闲居。圣明：指太平盛世。", "“气蒸云梦泽，波撼岳阳城”笔力千钧，为描写洞庭的名句。", "用典：“羡鱼”出自《淮南子》“临河而羡鱼，不如归家织网”。"], "dict": [{"q": "《望洞庭湖赠张丞相》中写湖水与天空浑然一体的句子：", "a": "八月湖水平，涵虚混太清。"}, {"q": "《望洞庭湖赠张丞相》中描写洞庭湖波澜壮阔的名句：", "a": "气蒸云梦泽，波撼岳阳城。"}, {"q": "《望洞庭湖赠张丞相》中表达想出仕却无人引荐的诗句：", "a": "欲济无舟楫，端居耻圣明。"}, {"q": "《望洞庭湖赠张丞相》中化用典故、含蓄表达求仕之心的句子：", "a": "坐观垂钓者，徒有羡鱼情。"}], "trans": [{"q": "八月湖水平，涵虚混太清。", "a": "八月洞庭湖水涨与岸齐平，水天一色，湖水和天空浑然交融。"}, {"q": "气蒸云梦泽，波撼岳阳城。", "a": "水汽蒸腾弥漫整个云梦泽，波涛汹涌摇撼着岳阳古城。"}, {"q": "欲济无舟楫，端居耻圣明。", "a": "我想渡湖却没有船和桨，闲居无事又愧对这圣明的时代。"}, {"q": "坐观垂钓者，徒有羡鱼情。", "a": "我闲坐着看别人垂钓，只能空怀一番羡慕鱼儿上钩的心情。"}], "book": "8b", "grade": "八年级下册", "id": 74}, {"title": "北冥有鱼", "author": "庄周", "dynasty": "先秦", "genre": "文言文", "source": "课内", "unit": "第六单元 第21课 《庄子》二则·北冥有鱼", "text": "北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。", "theme": "借鲲鹏展翅九万里的奇幻想象，阐明万物皆有所待、追求精神逍遥。", "notes": ["冥：同“溟”，海。北冥：北海。", "怒：振奋，这里指用力鼓动翅膀。", "海运：海水运动。天池：天然形成的水池。", "抟：盘旋飞翔。扶摇：旋风。息：气息，这里指风。", "野马：山野中的雾气，奔腾如野马。", "想象奇特、夸张大胆；“扶摇直上”即出此文。"], "dict": [{"q": "《北冥有鱼》中写大鹏奋飞时翼展遮天、气势宏大的句子：", "a": "怒而飞，其翼若垂天之云。"}, {"q": "《北冥有鱼》中写大鹏南徙时击水三千里、直上九万里的句子：", "a": "水击三千里，抟扶摇而上者九万里"}, {"q": "《北冥有鱼》中说明大鹏南飞须凭借海运的句子：", "a": "是鸟也，海运则将徙于南冥。"}, {"q": "《北冥有鱼》中以雾气尘埃说明万物皆有所待的句子：", "a": "野马也，尘埃也，生物之以息相吹也。"}, {"q": "《北冥有鱼》中写自高空下视与自下仰望并无两样的句子：", "a": "其视下也，亦若是则已矣。"}], "trans": [{"q": "北冥有鱼，其名为鲲。", "a": "北海里有一条鱼，它的名字叫作鲲。"}, {"q": "怒而飞，其翼若垂天之云。", "a": "大鹏用力鼓动翅膀起飞时，它的双翅就像悬挂在天空的云。"}, {"q": "是鸟也，海运则将徙于南冥。", "a": "这只鸟在海水运动、大风兴起的时候，就要迁徙到南海去。"}, {"q": "水击三千里，抟扶摇而上者九万里", "a": "翅膀拍打水面激起三千里的浪花，乘着旋风盘旋飞上九万里的高空。"}, {"q": "野马也，尘埃也，生物之以息相吹也。", "a": "山野中奔腾如野马的雾气，空中飞扬的尘埃，都是生物用气息吹拂的结果。"}, {"q": "天之苍苍，其正色邪？其远而无所至极邪？", "a": "天空那样湛蓝，难道是它本来的颜色吗？还是因为高远得望不到尽头呢？"}], "book": "8b", "grade": "八年级下册", "id": 75}, {"title": "庄子与惠子游于濠梁之上", "author": "庄周", "dynasty": "先秦", "genre": "文言文", "source": "课内", "unit": "第六单元 第21课 《庄子》二则·庄子与惠子游于濠梁之上", "text": "庄子与惠子游于濠梁之上。庄子曰：“鲦鱼出游从容，是鱼之乐也。”惠子曰：“子非鱼，安知鱼之乐？”庄子曰：“子非我，安知我不知鱼之乐？”惠子曰：“我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！”庄子曰：“请循其本。子曰‘汝安知鱼乐’云者，既已知吾知之而问我，我知之濠上也。”", "theme": "通过濠梁之辩，展现庄子崇尚自然、以心意体物、悠然自得的境界。", "notes": ["濠梁：濠水上的桥。梁，桥。", "鲦鱼：一种白色小鱼。从容：悠闲自得。", "全：完全，完备，这里是肯定的意思。", "循其本：追溯话题本原。循，追溯。", "庄子巧辩、惠子力辩，一尚美一求真，机趣盎然。", "庄子以“我知之濠上也”偷换概念取胜，论辩机智幽默。"], "dict": [{"q": "《庄子与惠子游于濠梁之上》中庄子由鱼出游从容判断鱼之乐的句子：", "a": "鲦鱼出游从容，是鱼之乐也"}, {"q": "《庄子与惠子游于濠梁之上》中惠子质疑庄子不知鱼乐的句子：", "a": "子非鱼，安知鱼之乐"}, {"q": "《庄子与惠子游于濠梁之上》中惠子以己推人、论证庄子不知鱼乐的句子：", "a": "我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣"}, {"q": "《庄子与惠子游于濠梁之上》中庄子点明自己知晓鱼乐之地的句子：", "a": "我知之濠上也"}], "trans": [{"q": "庄子与惠子游于濠梁之上。", "a": "庄子和惠子一起在濠水的桥上游玩。"}, {"q": "鲦鱼出游从容，是鱼之乐也。", "a": "鯈鱼在水中悠闲自得地游来游去，这就是鱼的快乐啊。"}, {"q": "子非鱼，安知鱼之乐？", "a": "你又不是鱼，怎么能知道鱼的快乐呢？"}, {"q": "我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！", "a": "我不是你，固然不了解你；你本来就不是鱼，你不知道鱼的快乐，这是完全可以肯定的！"}, {"q": "子曰‘汝安知鱼乐’云者，既已知吾知之而问我，我知之濠上也。", "a": "你说你怎么知道鱼快乐这句话，说明你已知道我知道鱼快乐才问我，我是在濠水上知道的。"}], "book": "8b", "grade": "八年级下册", "id": 76}, {"title": "虽有嘉肴", "author": "戴圣", "dynasty": "西汉", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 《礼记》二则·虽有嘉肴", "text": "虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰“学学半”，其此之谓乎！", "theme": "以嘉肴与至道设喻，论述教与学互相促进、实践方能知不足的道理。", "notes": ["嘉肴：美味的菜肴。旨：味美。", "至道：最好的道理。困：困惑。", "自反：自我反思。自强：自我勉励。强，勉励。", "教学相长：教与学互相推动、互相促进。", "《兑命》：即《说命》，《尚书》中的一篇。", "“学学半”：教别人，占自己学习的一半。前一个“学”同“敩”，教导。"], "dict": [{"q": "《虽有嘉肴》中以嘉肴、至道设喻引出论题的句子：", "a": "虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。"}, {"q": "《虽有嘉肴》中写学与教之后各有所获的句子：", "a": "是故学然后知不足，教然后知困。"}, {"q": "《虽有嘉肴》中写知不足与知困之后应如何做的句子：", "a": "知不足，然后能自反也；知困，然后能自强也。"}, {"q": "《虽有嘉肴》的中心论点：", "a": "教学相长也"}, {"q": "《虽有嘉肴》中引用《兑命》作结、印证论点的句子：", "a": "《兑命》曰“学学半”，其此之谓乎！"}], "trans": [{"q": "虽有嘉肴，弗食，不知其旨也", "a": "虽然有美味的菜肴，不去亲口品尝，就不知道它味道的甘美。"}, {"q": "虽有至道，弗学，不知其善也。", "a": "纵然有最好的道理，如果不去学习，也不会明白它的益处所在。"}, {"q": "是故学然后知不足，教然后知困。", "a": "所以学习之后才知道自己的不足，教人之后才知道自己有困惑的地方。"}, {"q": "知不足，然后能自反也；知困，然后能自强也。", "a": "知道自己不足，然后才能自我反思；知道有困惑，然后才能勉励自己。"}, {"q": "《兑命》曰“学学半”，其此之谓乎！", "a": "《兑命》说教别人占自己学习的一半，大概说的就是这个道理吧！"}], "book": "8b", "grade": "八年级下册", "id": 77}, {"title": "大道之行也", "author": "戴圣", "dynasty": "西汉", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 《礼记》二则·大道之行也", "text": "大道之行也，天下为公，选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同。", "theme": "描绘天下为公、人人安居乐业的大同社会，寄托对理想社会的向往。", "notes": ["大道：指儒家推崇的上古时代的政治制度。", "与：同“举”，推举。修：培养。", "亲：以……为亲。子：以……为子。", "矜：同“鳏”，老而无妻。寡：老而无夫。孤：幼而无父。独：老而无子。", "分：职分，职守。归：女子出嫁。", "外户而不闭：门从外面带上而不关闭，指社会安定。"], "dict": [{"q": "《大道之行也》中总领全文、概括大同社会特征的句子：", "a": "大道之行也，天下为公，选贤与能，讲信修睦。"}, {"q": "《大道之行也》中写人们不只关爱自己的亲人子女的句子：", "a": "故人不独亲其亲，不独子其子"}, {"q": "《大道之行也》中写各年龄段及弱者皆得供养安置的句子：", "a": "使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养"}, {"q": "《大道之行也》中写人们珍惜财物、尽力为公的句子：", "a": "货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。"}, {"q": "《大道之行也》中写大同社会安定、夜不闭户的句子：", "a": "是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同。"}], "trans": [{"q": "大道之行也，天下为公，选贤与能，讲信修睦。", "a": "大道施行的时候，天下是公共的，推举贤能的人，讲求诚信，培养和睦气氛。"}, {"q": "故人不独亲其亲，不独子其子", "a": "因此人们不只敬爱自己的父母，不只疼爱自己的子女。"}, {"q": "使老有所终，壮有所用，幼有所长", "a": "让老年人得以善终，壮年人能够发挥才能，年幼的孩子能够健康成长。"}, {"q": "男有分，女有归。", "a": "男子有自己的职业职分，女子能及时出嫁，有所归宿。"}, {"q": "货恶其弃于地也，不必藏于己", "a": "人们厌恶把财物丢弃在地上，但不一定非要把它据为己有。"}, {"q": "是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同。", "a": "因此奸邪的图谋不会兴起，盗窃作乱害人的事不会发生，大门都不用关上，这就是大同社会。"}], "book": "8b", "grade": "八年级下册", "id": 78}, {"title": "马说", "author": "韩愈", "dynasty": "唐", "genre": "文言文", "source": "课内", "unit": "第六单元 第23课 马说", "text": "世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。\n马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？\n策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！", "theme": "借千里马不遇伯乐，抒发人才被埋没的愤懑，讽刺统治者不识人才。", "notes": ["祗：只，仅。奴隶人：奴仆，这里指喂马的人。", "骈死：一同死。槽枥：马槽。", "食：同“饲”，喂。见：同“现”，表现。", "策：马鞭，这里作动词，用马鞭驱赶。材：才能、才干。", "通篇用托物寓意（比喻）的手法，以千里马喻人才。", "主旨句“其真无马邪？其真不知马也！”：讽刺统治者愚妄无知。"], "dict": [{"q": "《马说》的中心论点：", "a": "世有伯乐，然后有千里马。"}, {"q": "《马说》中写千里马被埋没、辱于仆役之手而老死的悲惨遭遇的句子：", "a": "祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。"}, {"q": "《马说》中揭示千里马被埋没根本原因的句子：", "a": "食马者不知其能千里而食也。"}, {"q": "《马说》中写食马者不识马、摧残千里马的具体表现的句子：", "a": "策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之"}, {"q": "《马说》中揭示全文主旨、讽刺统治者不识人才的句子：", "a": "其真无马邪？其真不知马也！"}], "trans": [{"q": "世有伯乐，然后有千里马。", "a": "世上先有伯乐这样善于相马的人，然后才会有千里马。"}, {"q": "故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。", "a": "所以即使有好马，也只能在马夫的手下受辱，和普通马一起死在马槽旁，不能以千里马著称。"}, {"q": "马之千里者，一食或尽粟一石。", "a": "日行千里的马，一顿有时能吃掉一石粮食。"}, {"q": "食马者不知其能千里而食也。", "a": "喂马的人不懂得要根据它日行千里的能力去喂养它。"}, {"q": "策之不以其道，食之不能尽其材，鸣之而不能通其意", "a": "鞭打它却不用正确的方法，喂养它却不能使它充分发挥才能，它嘶鸣时又不能通晓它的意思。"}, {"q": "其真无马邪？其真不知马也！", "a": "难道真的没有千里马吗？恐怕是他们真的不认识千里马啊！"}], "book": "8b", "grade": "八年级下册", "id": 79}, {"title": "石壕吏", "author": "杜甫", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第六单元 第24课 唐诗三首·石壕吏", "text": "暮投石壕村，有吏夜捉人。\n老翁逾墙走，老妇出门看。\n吏呼一何怒！妇啼一何苦！\n听妇前致词：三男邺城戍。\n一男附书至，二男新战死。\n存者且偷生，死者长已矣！\n室中更无人，惟有乳下孙。\n有孙母未去，出入无完裙。\n老妪力虽衰，请从吏夜归。\n急应河阳役，犹得备晨炊。\n夜久语声绝，如闻泣幽咽。\n天明登前途，独与老翁别。", "theme": "实录差吏夜捉人，揭露战乱中官吏的凶暴与百姓家破人亡的深重苦难。", "notes": ["投：投宿。逾：越过。一何：多么。", "戍：防守。附书至：捎信回来。", "乳下孙：还在吃奶的孙子。完裙：完整的衣服。", "老妪：老妇。幽咽：形容低微、断续的哭声。", "藏问于答：只写老妇哭诉，差吏的逼问隐于言外。", "“吏呼一何怒！妇啼一何苦！”对比鲜明，揭露差吏凶暴。"], "dict": [{"q": "《石壕吏》中交代时间地点、总写差吏深夜抓丁的句子：", "a": "暮投石壕村，有吏夜捉人。"}, {"q": "《石壕吏》中对比写差吏凶暴与老妇悲苦的句子：", "a": "吏呼一何怒！妇啼一何苦！"}, {"q": "《石壕吏》中写三子从军、二子战死的句子：", "a": "一男附书至，二男新战死。"}, {"q": "《石壕吏》中写战乱中幸存者苟活、死者永逝的句子：", "a": "存者且偷生，死者长已矣！"}, {"q": "《石壕吏》中写老妇自请连夜随吏应役的句子：", "a": "老妪力虽衰，请从吏夜归。"}, {"q": "《石壕吏》中以声写悲、暗示老妇被抓走的句子：", "a": "夜久语声绝，如闻泣幽咽。"}], "trans": [{"q": "暮投石壕村，有吏夜捉人。", "a": "傍晚我投宿在石壕村，正碰上差役夜里来抓壮丁。"}, {"q": "吏呼一何怒！妇啼一何苦！", "a": "差役的吼叫是多么凶狠！老妇人的啼哭是多么悲苦！"}, {"q": "存者且偷生，死者长已矣！", "a": "活着的人姑且苟且地活着，死去的人就永远完结了！"}, {"q": "夜久语声绝，如闻泣幽咽。", "a": "夜深了说话的声音消失了，隐约听到低微而断续的抽泣声。"}, {"q": "天明登前途，独与老翁别。", "a": "天亮后我登上前行的路，只能同那位老翁一个人告别。"}], "book": "8b", "grade": "八年级下册", "id": 80}, {"title": "茅屋为秋风所破歌", "author": "杜甫", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第六单元 第24课 唐诗三首·茅屋为秋风所破歌", "text": "八月秋高风怒号，卷我屋上三重茅。\n茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。\n南村群童欺我老无力，忍能对面为盗贼。\n公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。\n俄顷风定云墨色，秋天漠漠向昏黑。\n布衾多年冷似铁，娇儿恶卧踏里裂。\n床头屋漏无干处，雨脚如麻未断绝。\n自经丧乱少睡眠，长夜沾湿何由彻！\n安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。\n呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！", "theme": "由茅屋被破、长夜难眠的困窘，推己及人，抒发忧国忧民、舍己为人之情。", "notes": ["三重茅：几层茅草。三，泛指多。挂罥：挂着，缠绕。", "俄顷：一会儿。漠漠：阴沉迷蒙的样子。", "衾：被子。恶卧：睡相不好。雨脚：雨点。", "丧乱：战乱，指安史之乱。何由彻：如何挨到天亮。", "安得：如何能得到。突兀：高耸的样子。见：同“现”。", "“安得广厦千万间，大庇天下寒士俱欢颜！”为全诗主旨句。"], "dict": [{"q": "《茅屋为秋风所破歌》中写秋风怒号、卷走屋上茅草的句子：", "a": "八月秋高风怒号，卷我屋上三重茅。"}, {"q": "《茅屋为秋风所破歌》中写群童公然抱茅、诗人无可奈何的句子：", "a": "南村群童欺我老无力，忍能对面为盗贼。"}, {"q": "《茅屋为秋风所破歌》中渲染雨前阴沉黑暗气氛、烘托愁惨心境的句子：", "a": "俄顷风定云墨色，秋天漠漠向昏黑。"}, {"q": "《茅屋为秋风所破歌》中写屋漏床湿、长夜难眠的句子：", "a": "床头屋漏无干处，雨脚如麻未断绝。"}, {"q": "《茅屋为秋风所破歌》中表现诗人心忧天下寒士、博大胸襟的主旨句：", "a": "安得广厦千万间，大庇天下寒士俱欢颜！"}, {"q": "《茅屋为秋风所破歌》中表现诗人舍己为人、至死不悔决心的句子：", "a": "何时眼前突兀见此屋，吾庐独破受冻死亦足！"}], "trans": [{"q": "八月秋高风怒号，卷我屋上三重茅。", "a": "八月秋深，狂风怒吼，卷走了我屋顶上好几层茅草。"}, {"q": "茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。", "a": "茅草飞过江去散落在江边，飞得高的挂在高树梢上，飞得低的飘转着沉入池塘洼地。"}, {"q": "俄顷风定云墨色，秋天漠漠向昏黑。", "a": "一会儿风停了，乌黑如墨，秋日的天空阴沉迷蒙，渐渐黑了下来。"}, {"q": "安得广厦千万间，大庇天下寒士俱欢颜！", "a": "怎么能得到千万间宽敞高大的房屋，普遍庇护天下贫寒的读书人，让他们都喜笑颜开！"}, {"q": "何时眼前突兀见此屋，吾庐独破受冻死亦足！", "a": "什么时候眼前能高耸起这样的房屋，即使我的茅屋独被吹破、我受冻而死也心满意足！"}], "book": "8b", "grade": "八年级下册", "id": 81}, {"title": "卖炭翁", "author": "白居易", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第六单元 第24课 唐诗三首·卖炭翁", "text": "卖炭翁，伐薪烧炭南山中。\n满面尘灰烟火色，两鬓苍苍十指黑。\n卖炭得钱何所营？身上衣裳口中食。\n可怜身上衣正单，心忧炭贱愿天寒。\n夜来城外一尺雪，晓驾炭车辗冰辙。\n牛困人饥日已高，市南门外泥中歇。\n翩翩两骑来是谁？黄衣使者白衫儿。\n手把文书口称敕，回车叱牛牵向北。\n一车炭，千余斤，宫使驱将惜不得。\n半匹红绡一丈绫，系向牛头充炭直。", "theme": "叙述卖炭翁辛苦烧炭却被宫使强夺，揭露宫市之弊，同情劳动人民。", "notes": ["伐薪：砍柴。南山：即终南山。", "何所营：做什么用。营：谋求。辗：同“碾”，压。", "翩翩：轻快的样子。黄衣使者：太监。白衫儿：随从。", "把：拿。敕：皇帝的命令。回：调转。叱：吆喝。", "“可怜身上衣正单，心忧炭贱愿天寒”写矛盾心理。", "对比、白描手法；“半匹红绡一丈绫”揭露不等价掠夺。"], "dict": [{"q": "《卖炭翁》中描写老翁烧炭辛劳与外貌苍老黝黑的句子：", "a": "满面尘灰烟火色，两鬓苍苍十指黑。"}, {"q": "《卖炭翁》中写老翁衣单却盼天寒的矛盾心理的句子：", "a": "可怜身上衣正单，心忧炭贱愿天寒。"}, {"q": "《卖炭翁》中写雪天运炭、路途艰难的句子：", "a": "夜来城外一尺雪，晓驾炭车辗冰辙。"}, {"q": "《卖炭翁》中写宫使狐假虎威、强拉炭车的句子：", "a": "手把文书口称敕，回车叱牛牵向北。"}, {"q": "《卖炭翁》中写老翁对炭被强夺无可奈何的句子：", "a": "一车炭，千余斤，宫使驱将惜不得。"}, {"q": "《卖炭翁》中揭露宫市不等价交换、实质为掠夺的句子：", "a": "半匹红绡一丈绫，系向牛头充炭直。"}], "trans": [{"q": "满面尘灰烟火色，两鬓苍苍十指黑。", "a": "他满脸灰尘，显出烟熏火烤的颜色，两鬓花白，十个手指头漆黑。"}, {"q": "可怜身上衣正单，心忧炭贱愿天寒。", "a": "可怜他身上的衣服还很单薄，心里却担忧炭价太低，反而盼望天气更寒冷。"}, {"q": "夜来城外一尺雪，晓驾炭车辗冰辙。", "a": "夜里城外下了一尺厚的大雪，清早他驾着炭车碾过冰冻的车辙赶路。"}, {"q": "翩翩两骑来是谁？黄衣使者白衫儿。", "a": "那轻快得意骑马而来的两人是谁？是身穿黄衣的太监和白衣的差役。"}, {"q": "半匹红绡一丈绫，系向牛头充炭直。", "a": "他们把半匹红绡和一丈绫挂在牛头上，就算作这一车炭的价钱。"}], "book": "8b", "grade": "八年级下册", "id": 82}, {"title": "题破山寺后禅院", "author": "常建", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "清晨入古寺，初日照高林。\n曲径通幽处，禅房花木深。\n山光悦鸟性，潭影空人心。\n万籁此都寂，但余钟磬音。", "theme": "描绘古寺清幽寂静的景色，抒发寄情山水、向往空门幽寂的心境。", "notes": ["清晨：早晨。初日：初升的太阳。", "曲径：弯曲的小路。禅房：僧人的房舍。", "悦：使……欢悦。空：使……空明，消除。", "万籁：各种声响。钟磬：寺院中诵经、斋供时敲击的乐器。", "“曲径通幽处，禅房花木深”为历来传诵的名句。", "以声衬静：以“钟磬音”反衬古寺的空寂。"], "dict": [{"q": "《题破山寺后禅院》中写清晨入寺、阳光照在高林上的句子：", "a": "清晨入古寺，初日照高林。"}, {"q": "《题破山寺后禅院》中写小径曲折、花木幽深的名句：", "a": "曲径通幽处，禅房花木深。"}, {"q": "《题破山寺后禅院》中写山光使鸟欢悦、潭影消除世俗杂念的句子：", "a": "山光悦鸟性，潭影空人心。"}, {"q": "《题破山寺后禅院》中以声衬静、写万籁俱寂的句子：", "a": "万籁此都寂，但余钟磬音。"}], "trans": [{"q": "清晨入古寺，初日照高林。", "a": "清晨我走进古老的寺院，初升的太阳照着高高的树林。"}, {"q": "曲径通幽处，禅房花木深。", "a": "弯弯曲曲的小路通向幽静的深处，禅房就掩映在茂密的花木丛中。"}, {"q": "山光悦鸟性，潭影空人心。", "a": "山中的景色使鸟儿怡然自得，潭中的倒影让人心中的杂念全都消散。"}, {"q": "万籁此都寂，但余钟磬音。", "a": "此时各种声响都寂静下来，只听见钟和磬的悠悠敲击声。"}], "book": "8b", "grade": "八年级下册", "id": 83}, {"title": "送友人", "author": "李白", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "青山横北郭，白水绕东城。\n此地一为别，孤蓬万里征。\n浮云游子意，落日故人情。\n挥手自兹去，萧萧班马鸣。", "theme": "描绘送别时的明丽景色，抒发对友人漂泊远行的关切与依依惜别之情。", "notes": ["郭：外城。白水：明净的水。", "为别：作别。孤蓬：蓬草，比喻漂泊远行的人。", "浮云：比喻游子行踪不定。落日：比喻难舍之情。", "自兹去：从此离开。兹，此。", "班马：离群的马。萧萧：马鸣声。", "对偶工整，以景结情，情景交融。"], "dict": [{"q": "《送友人》中点明送别地点、山水相依的句子：", "a": "青山横北郭，白水绕东城。"}, {"q": "《送友人》中以孤蓬为喻、写友人漂泊远行的句子：", "a": "此地一为别，孤蓬万里征。"}, {"q": "《送友人》中以浮云喻游子、以落日喻故人之情的句子：", "a": "浮云游子意，落日故人情。"}, {"q": "《送友人》中借马鸣衬托离情别绪的句子：", "a": "挥手自兹去，萧萧班马鸣。"}], "trans": [{"q": "青山横北郭，白水绕东城。", "a": "青翠的山峦横卧在城外北边，清澈的河水环绕着城的东面。"}, {"q": "此地一为别，孤蓬万里征。", "a": "在这里一经分别，你就像孤独的蓬草踏上万里远行的征途。"}, {"q": "浮云游子意，落日故人情。", "a": "天上的浮云就像游子漂泊的心意，缓缓下沉的落日就像老友惜别之情。"}, {"q": "挥手自兹去，萧萧班马鸣。", "a": "我们挥手从此分别，那离群的马儿也发出萧萧的不舍长鸣。"}], "book": "8b", "grade": "八年级下册", "id": 84}, {"title": "卜算子·黄州定慧院寓居作", "author": "苏轼", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "缺月挂疏桐，漏断人初静。\n谁见幽人独往来，缥缈孤鸿影。\n惊起却回头，有恨无人省。\n拣尽寒枝不肯栖，寂寞沙洲冷。", "theme": "借月夜孤鸿，抒发被贬黄州时的孤寂处境与高洁自许、不随波逐流的心境。", "notes": ["漏断：漏壶水已滴尽，指深夜。漏，古人计时的漏壶。", "幽人：幽居之人，这里指词人自己。", "省：知晓、理解。", "缥缈：隐隐约约、若有若无。", "托物写怀：以孤鸿自比，表现孤高自守。", "“拣尽寒枝不肯栖，寂寞沙洲冷”为写孤鸿遭遇不幸的名句。"], "dict": [{"q": "《卜算子·黄州定慧院寓居作》中写深夜庭院凄清景象的句子：", "a": "缺月挂疏桐，漏断人初静。"}, {"q": "《卜算子·黄州定慧院寓居作》中写幽人独行、孤鸿飘渺的句子：", "a": "谁见幽人独往来，缥缈孤鸿影。"}, {"q": "《卜算子·黄州定慧院寓居作》中直接写孤鸿幽恨无人理解的句子：", "a": "惊起却回头，有恨无人省。"}, {"q": "《卜算子·黄州定慧院寓居作》中表现作者高洁自许、不愿随波逐流的句子：", "a": "拣尽寒枝不肯栖，寂寞沙洲冷。"}], "trans": [{"q": "缺月挂疏桐，漏断人初静。", "a": "一弯残月挂在稀疏的梧桐树上，漏壶的水滴尽了，夜深人刚刚静下来。"}, {"q": "谁见幽人独往来，缥缈孤鸿影。", "a": "有谁看见那幽居的人独自徘徊？只有隐约可见的一只孤雁的身影。"}, {"q": "惊起却回头，有恨无人省。", "a": "孤雁被惊动飞起却又回过头来，心中的幽恨没有人能够理解。"}, {"q": "拣尽寒枝不肯栖，寂寞沙洲冷。", "a": "它挑遍了寒冷的树枝也不肯栖息，宁可独宿在寂寞清冷的沙洲上。"}], "book": "8b", "grade": "八年级下册", "id": 85}, {"title": "卜算子·咏梅", "author": "陆游", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "驿外断桥边，寂寞开无主。\n已是黄昏独自愁，更著风和雨。\n无意苦争春，一任群芳妒。\n零落成泥碾作尘，只有香如故。", "theme": "借梅花身处荒僻、饱受摧残而芳香如故，寄托坚贞自守、不媚俗的品格。", "notes": ["驿：驿站。无主：无人过问、无人欣赏。", "著：同“着”，遭受。", "苦：极、竭力。一任：完全任凭。群芳：百花，喻指嫉妒者。", "零落：凋谢。碾：轧碎。", "托物言志：以梅花自喻，写屡遭排挤仍坚贞不屈。", "“零落成泥碾作尘，只有香如故”为表现坚贞操守的名句。"], "dict": [{"q": "《卜算子·咏梅》中写梅花生长环境偏僻寂寞、无人欣赏的句子：", "a": "驿外断桥边，寂寞开无主。"}, {"q": "《卜算子·咏梅》中写梅花处境悲凉、又遭风雨摧残的句子：", "a": "已是黄昏独自愁，更著风和雨。"}, {"q": "《卜算子·咏梅》中写梅花不争春、任凭群芳嫉妒的句子：", "a": "无意苦争春，一任群芳妒。"}, {"q": "《卜算子·咏梅》中写梅花虽遭碾作尘仍芳香如故、坚贞不屈的句子：", "a": "零落成泥碾作尘，只有香如故。"}], "trans": [{"q": "驿外断桥边，寂寞开无主。", "a": "驿站之外的断桥旁边，梅花寂寞地开放，无人照管也无主。"}, {"q": "已是黄昏独自愁，更著风和雨。", "a": "已经是黄昏时分，它独自含着愁绪，又遭受风吹雨打的摧残。"}, {"q": "无意苦争春，一任群芳妒。", "a": "梅花本无意苦苦争夺春色，任凭那百花去嫉妒它好了。"}, {"q": "零落成泥碾作尘，只有香如故。", "a": "梅花凋零落地被碾成尘土，只有它的清香依然和从前一样。"}], "book": "8b", "grade": "八年级下册", "id": 86}, {"title": "沁园春·雪", "author": "毛泽东", "dynasty": "现代", "genre": "词", "source": "课内", "unit": "第一单元 第1课 沁园春·雪", "text": "北国风光，千里冰封，万里雪飘。\n望长城内外，惟余莽莽；大河上下，顿失滔滔。\n山舞银蛇，原驰蜡象，欲与天公试比高。\n须晴日，看红装素裹，分外妖娆。\n江山如此多娇，引无数英雄竞折腰。\n惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。\n一代天骄，成吉思汗，只识弯弓射大雕。\n俱往矣，数风流人物，还看今朝。", "theme": "描绘北国壮丽雪景，评点历代英雄，抒发无产阶级革命领袖的豪情与自信。", "notes": ["北国风光：指我国北方。", "惟余莽莽：只剩下白茫茫一片。莽莽，形容原野辽阔、无边无际。", "顿失滔滔：指黄河因结冰而立刻失去波涛滚滚的气势。", "山舞银蛇，原驰蜡象：群山如银蛇舞动，高原如白象奔跑，化静为动，以动写静。", "红装素裹：形容雪后天晴，红日与白雪交相辉映的艳丽景色。", "风流人物：指能建功立业的英雄人物，这里指当代无产阶级革命者。"], "dict": [{"q": "词中总写北国雪景、动静结合、气象磅礴，勾勒出一个冰天雪地、广袤无垠的银色世界的三句是：", "a": "北国风光，千里冰封，万里雪飘。"}, {"q": "词中写雪后长城、黄河一片苍茫，冰封雪盖、气势雄浑的句子是：", "a": "望长城内外，惟余莽莽；大河上下，顿失滔滔。"}, {"q": "词中化静为动，以比喻写雪后群山起伏、高原奔涌，并赋予其奋发竞争精神的句子是：", "a": "山舞银蛇，原驰蜡象，欲与天公试比高。"}, {"q": "词中虚写雪后初晴、红日与白雪交相辉映的艳丽景象，表达对祖国山河赞美的句子是：", "a": "须晴日，看红装素裹，分外妖娆。"}, {"q": "词中承上启下，由壮丽的写景转入评点历史人物的过渡句是：", "a": "江山如此多娇，引无数英雄竞折腰。"}, {"q": "词中点明主旨、卒章显志，热情歌颂无产阶级革命英雄和当今时代的两句是：", "a": "俱往矣，数风流人物，还看今朝。"}], "trans": [{"q": "北国风光，千里冰封，万里雪飘。", "a": "北方的风光，千里大地被坚冰封冻，万里长空雪花飘飞。"}, {"q": "山舞银蛇，原驰蜡象，欲与天公试比高。", "a": "群山像银蛇在舞动，高原像白象在奔驰，想要和天公比一比高低。"}, {"q": "须晴日，看红装素裹，分外妖娆。", "a": "等到天晴的时候，看红日与白雪交相辉映，格外娇艳动人。"}, {"q": "江山如此多娇，引无数英雄竞折腰。", "a": "江山是这样娇美，引得无数英雄竞相为之倾倒。"}, {"q": "俱往矣，数风流人物，还看今朝。", "a": "这些都已成为过去，要数真正的英雄人物，还得看当今时代。"}], "book": "9a", "grade": "九年级上册", "id": 87}, {"title": "岳阳楼记", "author": "范仲淹", "dynasty": "宋", "genre": "文言文", "source": "课内", "unit": "第三单元 第11课 岳阳楼记", "text": "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。\n予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？\n若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。\n至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？\n时六年九月十五日。", "theme": "通过洞庭阴晴之景与迁客骚人之情的对比，抒发“先忧后乐”的政治抱负与忧国忧民情怀。", "notes": ["谪守：因罪贬谪流放出任外官。守，指做州郡的长官。", "属：同“嘱”，嘱托。胜状：胜景，美景。", "浩浩汤汤（shāng shāng）：水势浩大的样子。横无际涯：宽阔无边。", "淫雨霏霏：连绵不断的雨纷纷而下。曜：光芒。樯倾楫摧：桅杆倒下，船桨折断。", "景：日光。翔集：时而飞翔，时而停歇。锦鳞：美丽的鱼。", "微斯人，吾谁与归：如果没有这种人，我同谁一道呢？微，如果没有。"], "dict": [{"q": "文中赞美滕子京被贬巴陵后政绩显著，也是重修岳阳楼背景的句子是：", "a": "政通人和，百废具兴"}, {"q": "文中从空间上描写洞庭湖浩瀚广阔、气势宏大的句子是：", "a": "衔远山，吞长江，浩浩汤汤，横无际涯"}, {"q": "文中写洞庭湖早晚阴晴变化、景象千姿百态的句子是：", "a": "朝晖夕阴，气象万千"}, {"q": "文中写阴雨连绵时登楼者触景生悲，产生离开国都、怀念家乡、忧惧谗毁之情的句子是：", "a": "则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。"}, {"q": "文中描写月夜洞庭湖上月光与水影交相辉映的句子是：", "a": "浮光跃金，静影沉璧"}, {"q": "文中表现古仁人旷达胸襟，不因外物好坏和自己得失而或喜或悲的句子是：", "a": "不以物喜，不以己悲"}, {"q": "文中表达作者无论进退出处都忧国忧民的句子是：", "a": "居庙堂之高则忧其民，处江湖之远则忧其君。"}, {"q": "文中点明主旨、体现作者远大政治抱负和忧国忧民情怀的千古名句是：", "a": "先天下之忧而忧，后天下之乐而乐"}], "trans": [{"q": "越明年，政通人和，百废具兴", "a": "到了第二年，政事顺利，百姓和乐，各种荒废的事业都兴办起来。"}, {"q": "衔远山，吞长江，浩浩汤汤，横无际涯", "a": "它连接着远方的山，吞吐着长江的水，水势浩大，宽阔无边。"}, {"q": "登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。", "a": "登上这座楼，就会生出离开国都、怀念家乡，担心谗言、惧怕讥讽，满眼萧条而悲伤到极点的心情。"}, {"q": "而或长烟一空，皓月千里，浮光跃金，静影沉璧", "a": "有时大片烟雾完全消散，明月照耀千里，浮动的光像跳动的金子，静静的月影像沉入水中的玉璧。"}, {"q": "不以物喜，不以己悲", "a": "不因外物和自己处境的变化而或喜或悲。"}, {"q": "居庙堂之高则忧其民，处江湖之远则忧其君。", "a": "在朝廷做官就为百姓担忧，被贬谪到边远地区就为国君担忧。"}, {"q": "先天下之忧而忧，后天下之乐而乐", "a": "在天下人忧虑之前先忧虑，在天下人快乐之后才快乐。"}, {"q": "微斯人，吾谁与归？", "a": "如果没有这样的人，我同谁一道呢？"}], "book": "9a", "grade": "九年级上册", "id": 88}, {"title": "醉翁亭记", "author": "欧阳修", "dynasty": "宋", "genre": "文言文", "source": "课内", "unit": "第三单元 第12课 醉翁亭记", "text": "环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。\n至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。\n已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。", "theme": "描写滁州山水之美与宴游之乐，表现作者寄情山水、与民同乐的旷达情怀。", "notes": ["蔚然：茂盛的样子。翼然：像鸟张开翅膀一样。临：居高面下。", "醉翁之意不在酒：后用来表示本意不在此而在别的方面。", "林霏开：树林里的雾气散开。暝：昏暗。晦明变化：朝则自暗而明，暮则自明而暗。", "伛偻提携：指老老少少的行人。伛偻，弯腰曲背，指老人；提携，牵扶，指小孩。", "洌：清。山肴野蔌：野味野菜。觥筹交错：酒杯和酒筹交互错杂。", "阴翳：形容枝叶茂密成荫。翳，遮盖。"], "dict": [{"q": "文中交代太守自号“醉翁”原因的句子是：", "a": "太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。"}, {"q": "文中点明醉翁情趣所在、寄情山水的千古名句是：", "a": "醉翁之意不在酒，在乎山水之间也。"}, {"q": "文中描写山间早晚明暗变化之景的句子是：", "a": "日出而林霏开，云归而岩穴暝"}, {"q": "文中描写山间春夏秋冬四季不同景色的句子是：", "a": "野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。"}, {"q": "文中写滁州百姓扶老携幼、出游不绝，表现太守治理有方、百姓安乐的句子是：", "a": "伛偻提携，往来而不绝者，滁人游也。"}, {"q": "文中点明太守“与民同乐”主旨，写太守既能与民同乐、又能述之以文的句子是：", "a": "醉能同其乐，醒能述以文者，太守也。"}], "trans": [{"q": "峰回路转，有亭翼然临于泉上者，醉翁亭也。", "a": "山势回环，道路也跟着转弯，有一座亭子像鸟张开翅膀一样高踞在泉水上边，那就是醉翁亭。"}, {"q": "醉翁之意不在酒，在乎山水之间也。", "a": "醉翁的情趣不在喝酒上，而在于山光水色之中。"}, {"q": "山水之乐，得之心而寓之酒也。", "a": "欣赏山水的乐趣，领会于心间，寄托在喝酒上。"}, {"q": "野芳发而幽香，佳木秀而繁阴", "a": "野花开放，散发出清幽的香气；好的树木枝叶繁茂，形成浓郁的绿荫。"}, {"q": "伛偻提携，往来而不绝者，滁人游也。", "a": "老人弯着腰走，小孩由大人领着走，来来往往络绎不绝的，是滁州人在出游。"}, {"q": "苍颜白发，颓然乎其间者，太守醉也。", "a": "面容苍老、头发花白，醉醺醺地坐在众人中间的，是太守喝醉了。"}, {"q": "人知从太守游而乐，而不知太守之乐其乐也。", "a": "人们只知道跟随太守游玩的快乐，却不知道太守以他们的快乐为快乐。"}, {"q": "醉能同其乐，醒能述以文者，太守也。", "a": "醉了能和大家一起欢乐，醒来能用文章记述这乐事的人，是太守。"}], "book": "9a", "grade": "九年级上册", "id": 89}, {"title": "湖心亭看雪", "author": "张岱", "dynasty": "明末清初", "genre": "文言文", "source": "课内", "unit": "第三单元 第13课 湖心亭看雪", "text": "崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白，湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：“湖中焉得更有此人！”拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者。”", "theme": "以白描写西湖雪夜奇景，表现作者遗世独立的高洁情怀与故国之思。", "notes": ["更定：晚上八时左右。更，古代夜间的计时单位。", "拏：撑（船）。毳（cuì）衣：用毛皮制成的衣服。", "雾凇沆砀（hàng dàng）：冰花周围弥漫着白汽。沆砀，白汽弥漫的样子。", "一白：全白。芥：小草，这里形容船小。", "三大白：三大杯酒。白，古人罚酒时用的酒杯，这里代指酒。", "痴：痴迷于天人合一的山水之乐，痴迷于世俗之外的雅情雅致。"], "dict": [{"q": "文中描写大雪连下三日、西湖人鸟声全无，万籁俱寂的句子是：", "a": "大雪三日，湖中人鸟声俱绝。"}, {"q": "文中写作者雪夜独自撑船前往湖心亭看雪的句子是：", "a": "是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。"}, {"q": "文中用白描手法写出雪后西湖天地浑然一体、上下全白的句子是：", "a": "雾凇沆砀，天与云与山与水，上下一白"}, {"q": "文中以极小的量词反衬天地之阔大，描写湖上影子依稀可辨的句子是：", "a": "湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。"}, {"q": "文中写亭中之人见到作者时惊喜异常，侧面烘托作者“痴”的句子是：", "a": "见余大喜曰：“湖中焉得更有此人！”"}, {"q": "文末借舟子之口点明“痴”字，表现作者孤高自赏情怀的句子是：", "a": "莫说相公痴，更有痴似相公者。"}], "trans": [{"q": "大雪三日，湖中人鸟声俱绝。", "a": "大雪接连下了三天，湖中行人、飞鸟的声音都消失了。"}, {"q": "余拏一小舟，拥毳衣炉火，独往湖心亭看雪。", "a": "我撑着一叶小船，裹着细毛皮衣，带着炉火，独自前往湖心亭看雪。"}, {"q": "雾凇沆砀，天与云与山与水，上下一白", "a": "冰花周围白汽弥漫，天空、云层、远山和湖水，上上下下全是白茫茫一片。"}, {"q": "湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。", "a": "湖上的影子，只有一道长堤的痕迹、一点湖心亭的轮廓、我的一叶小舟和舟中两三个人影罢了。"}, {"q": "见余大喜曰：“湖中焉得更有此人！”拉余同饮。", "a": "他们看见我非常高兴地说：想不到湖中还会有这样的人，于是拉着我一同喝酒。"}, {"q": "莫说相公痴，更有痴似相公者。", "a": "不要说相公您痴迷，还有像您一样痴迷的人呢。"}], "book": "9a", "grade": "九年级上册", "id": 90}, {"title": "行路难（其一）", "author": "李白", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第三单元 第14课 诗词三首", "text": "金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难，行路难，多歧路，今安在？\n长风破浪会有时，直挂云帆济沧海。", "theme": "抒发怀才不遇的愤懑与仕途艰难的苦闷，仍坚信理想终能实现的豪迈自信。", "notes": ["樽：盛酒的器具。羞：同“馐”，美味的食物。直：同“值”，价值。", "箸（zhù）：筷子。茫然：无所适从的样子。", "“冰塞川”“雪满山”：比喻仕途艰难、理想受阻。", "“垂钓碧溪”“乘舟梦日”：分别暗指姜尚遇周文王、伊尹受商汤重用，表达希望得到朝廷重用。", "今安在：如今身在何处？一说“路在何方”。", "长风破浪：比喻实现远大理想。济：渡。"], "dict": [{"q": "诗中以夸张手法写宴席华美丰盛，却反衬诗人内心苦闷的两句是：", "a": "金樽清酒斗十千，玉盘珍羞直万钱。"}, {"q": "诗中通过“停、投、拔、顾”四个连续动作，形象表现诗人内心苦闷与茫然的两句是：", "a": "停杯投箸不能食，拔剑四顾心茫然。"}, {"q": "诗中以“冰塞川”“雪满山”象征人生道路艰难、理想难以实现的两句是：", "a": "欲渡黄河冰塞川，将登太行雪满山。"}, {"q": "诗中借用姜尚、伊尹的典故，表达诗人仍期待得到君王重用的两句是：", "a": "闲来垂钓碧溪上，忽复乘舟梦日边。"}, {"q": "诗中反复咏叹，表现人生道路崎岖、前途迷茫的四句是：", "a": "行路难，行路难，多歧路，今安在？"}, {"q": "诗中表现诗人坚信理想终能实现、充满自信与豪情的千古名句是：", "a": "长风破浪会有时，直挂云帆济沧海。"}], "trans": [{"q": "金樽清酒斗十千，玉盘珍羞直万钱。", "a": "金杯里盛着名贵的清酒，一斗价值万钱；玉盘里装着珍贵的菜肴，一盘也值万钱。"}, {"q": "停杯投箸不能食，拔剑四顾心茫然。", "a": "我放下酒杯、丢下筷子吃不下，拔出宝剑环顾四周，心里一片茫然。"}, {"q": "欲渡黄河冰塞川，将登太行雪满山。", "a": "想渡过黄河，冰雪却堵塞了河道；要登上太行山，大雪又盖满了山岭。"}, {"q": "闲来垂钓碧溪上，忽复乘舟梦日边。", "a": "空闲时在碧绿的溪水边垂钓，忽然又梦见乘船经过太阳旁边。"}, {"q": "长风破浪会有时，直挂云帆济沧海。", "a": "总会有乘长风破万里浪的那一天，我将高高挂起云帆，横渡沧海。"}], "book": "9a", "grade": "九年级上册", "id": 91}, {"title": "酬乐天扬州初逢席上见赠", "author": "刘禹锡", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第三单元 第14课 诗词三首", "text": "巴山楚水凄凉地，二十三年弃置身。\n怀旧空吟闻笛赋，到乡翻似烂柯人。\n沉舟侧畔千帆过，病树前头万木春。\n今日听君歌一曲，暂凭杯酒长精神。", "theme": "回顾贬谪生涯的辛酸，借新陈代谢之理表现豁达襟怀与坚韧意志。", "notes": ["巴山楚水：泛指诗人被贬的朗州、夔州等荒远之地。弃置身：指被贬谪的诗人自己。", "闻笛赋：指向秀所作《思旧赋》，表达对亡友的怀念。", "烂柯人：指晋人王质，比喻世事沧桑、恍如隔世。", "沉舟、病树：诗人自喻，虽遭贬谪而不悲观。", "“沉舟侧畔千帆过，病树前头万木春”：蕴含新事物必将取代旧事物的哲理。", "长（zhǎng）：增长，振作。"], "dict": [{"q": "诗中概述自己被贬荒远之地、历时之久，饱含辛酸与愤懑的两句是：", "a": "巴山楚水凄凉地，二十三年弃置身。"}, {"q": "诗中借用“闻笛赋”“烂柯人”两个典故，抒发怀念故友、感叹世事沧桑与恍如隔世之感的两句是：", "a": "怀旧空吟闻笛赋，到乡翻似烂柯人。"}, {"q": "诗中蕴含新事物必将取代旧事物哲理，表现诗人豁达襟怀的千古名句是：", "a": "沉舟侧畔千帆过，病树前头万木春。"}, {"q": "诗中点明酬答题意，表示要借酒振作精神、积极进取的两句是：", "a": "今日听君歌一曲，暂凭杯酒长精神。"}], "trans": [{"q": "巴山楚水凄凉地，二十三年弃置身。", "a": "在巴山楚水这些凄凉的地方，我被抛弃闲置了二十三年。"}, {"q": "怀旧空吟闻笛赋，到乡翻似烂柯人。", "a": "怀念旧友只能空自吟诵《闻笛赋》；回到故乡，反倒像那斧柄烂掉的王质。"}, {"q": "沉舟侧畔千帆过，病树前头万木春。", "a": "沉船旁边有千帆竞发驶过，枯病的树前面是万木争春。"}, {"q": "今日听君歌一曲，暂凭杯酒长精神。", "a": "今天听了你唱给我的一支歌，暂且凭借这杯酒来振作精神。"}], "book": "9a", "grade": "九年级上册", "id": 92}, {"title": "水调歌头", "author": "苏轼", "dynasty": "宋", "genre": "词", "source": "课内", "unit": "第三单元 第14课 诗词三首", "text": "丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。\n明月几时有？把酒问青天。\n不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，高处不胜寒。\n起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。\n不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，此事古难全。\n但愿人长久，千里共婵娟。", "theme": "中秋望月怀人，由矛盾到旷达，表达对亲人的思念和对天下人的美好祝愿。", "notes": ["丙辰：宋神宗熙宁九年（1076）。子由：苏轼弟弟苏辙的字。", "宫阙：宫殿。琼楼玉宇：美玉砌成的楼宇，指想象中的月宫。", "不胜（shèng）：经受不住。何似：哪里比得上。", "绮（qǐ）户：雕饰华美的门窗。无眠：指不能入睡的人，这里指词人自己。", "何事：为什么。婵娟：本意指妇女姿态美好，这里指月亮。", "“人有悲欢离合，月有阴晴圆缺”：蕴含人生与自然的哲理，表现旷达胸襟。"], "dict": [{"q": "词中起笔突兀，写词人把酒相问、感叹明月与青天的两句是：", "a": "明月几时有？把酒问青天。"}, {"q": "词中写词人既向往天上的自由，又畏惧月宫清寒，表现“出世”与“入世”矛盾心理的三句是：", "a": "我欲乘风归去，又恐琼楼玉宇，高处不胜寒。"}, {"q": "词中写月光转过楼阁、低低照进雕花门窗、照着彻夜难眠之人的三句是：", "a": "转朱阁，低绮户，照无眠。"}, {"q": "词中埋怨月亮仿佛故意在人离别时才圆满，表达月圆人缺之憾的两句是：", "a": "不应有恨，何事长向别时圆？"}, {"q": "词中蕴含人生哲理，说明悲欢离合、阴晴圆缺自古难以两全的三句是：", "a": "人有悲欢离合，月有阴晴圆缺，此事古难全。"}, {"q": "词中表达对天下所有离别之人美好祝愿的千古名句是：", "a": "但愿人长久，千里共婵娟。"}], "trans": [{"q": "明月几时有？把酒问青天。", "a": "明月是从什么时候开始有的？我举起酒杯问一问青天。"}, {"q": "我欲乘风归去，又恐琼楼玉宇，高处不胜寒。", "a": "我想乘着风回到天上去，又担心那美玉砌成的楼宇，高高在上的地方受不住寒冷。"}, {"q": "转朱阁，低绮户，照无眠。", "a": "月光转过朱红的楼阁，低低地照进雕花的门窗，照着无法入睡的人。"}, {"q": "人有悲欢离合，月有阴晴圆缺，此事古难全。", "a": "人生有悲欢离合，月亮有阴晴圆缺，这种事自古以来就难以圆满。"}, {"q": "但愿人长久，千里共婵娟。", "a": "只希望人能平安长久，即使相隔千里，也能共赏这美好的月色。"}], "book": "9a", "grade": "九年级上册", "id": 93}, {"title": "月夜忆舍弟", "author": "杜甫", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "戍鼓断人行，边秋一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不达，况乃未休兵。", "theme": "战乱中月夜忆弟，抒发兄弟离散之痛与忧国忧民的沉郁之情。", "notes": ["舍弟：对人谦称自己的弟弟。戍鼓：戍楼上用以报时或告警的鼓声。", "断人行：指鼓声响起后实行宵禁，禁止行人往来。", "“露从今夜白”：点明时令为白露节气。", "“月是故乡明”：以幻作真，突出对故乡的深切感怀。", "无家：指家园已毁，兄弟无处安身。", "况乃：何况是。未休兵：战争尚未结束。"], "dict": [{"q": "诗中描绘边塞秋夜图景，以戍鼓、雁声渲染战乱中荒凉冷落气氛的两句是：", "a": "戍鼓断人行，边秋一雁声。"}, {"q": "诗中既点明白露节气，又以幻作真、突出对故乡深切思念的千古名句是：", "a": "露从今夜白，月是故乡明。"}, {"q": "诗中写兄弟离散、家园无存、生死难卜，概括安史之乱中人民普遍遭遇的两句是：", "a": "有弟皆分散，无家问死生。"}, {"q": "诗中写家书难以送达，更何况战乱频仍，深化忧国忧民之情的两句是：", "a": "寄书长不达，况乃未休兵。"}], "trans": [{"q": "戍鼓断人行，边秋一雁声。", "a": "戍楼上的鼓声响起，路上已断绝行人；边塞的秋夜里传来孤雁的哀鸣。"}, {"q": "露从今夜白，月是故乡明。", "a": "从今夜起就进入白露节气，露水将日益浓重；月亮还是故乡的最明亮。"}, {"q": "有弟皆分散，无家问死生。", "a": "几个弟弟都各自分散在各地，家园已毁，无处打听他们是死是活。"}, {"q": "寄书长不达，况乃未休兵。", "a": "寄出的家书常常送不到，何况战事到现在还没有停息。"}], "book": "9a", "grade": "九年级上册", "id": 94}, {"title": "长沙过贾谊宅", "author": "刘长卿", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "三年谪宦此栖迟，万古惟留楚客悲。\n秋草独寻人去后，寒林空见日斜时。\n汉文有道恩犹薄，湘水无情吊岂知？\n寂寂江山摇落处，怜君何事到天涯！", "theme": "凭吊贾谊遗迹，借古人遭际暗喻自身迁谪之悲与对朝廷的怨愤。", "notes": ["谪宦：贬官。栖迟：淹留，像鸟儿敛翅歇息，比喻失意不得志。", "楚客：流落在楚地的人，指贾谊。", "“秋草”“寒林”“日斜”：以萧瑟之景烘托悲凉之情。", "汉文有道恩犹薄：汉文帝号称有道明君，对贾谊尚且薄恩，暗讽当朝。", "吊：凭吊。湘水无情：贾谊曾作《吊屈原赋》，此处谓凭吊之意无人知晓。", "摇落：凋零，零落。怜君：诗人自怜，亦怜贾谊，二者融为一体。"], "dict": [{"q": "诗中概括贾谊被贬长沙三年、却留下万古悲叹，奠定全诗悲凉基调的两句是：", "a": "三年谪宦此栖迟，万古惟留楚客悲。"}, {"q": "诗中写诗人在秋草寒林、夕阳斜照中独自寻访贾谊故居，抒发萧条寂寥之感的两句是：", "a": "秋草独寻人去后，寒林空见日斜时。"}, {"q": "诗中暗讽当朝，以汉文帝有道却仍薄恩、湘水无情不知凭吊之意，抒发愤懑的两句是：", "a": "汉文有道恩犹薄，湘水无情吊岂知？"}, {"q": "诗中以景结情，在寂寞江山、草木凋零之处怜惜贾谊亦自怜的两句是：", "a": "寂寂江山摇落处，怜君何事到天涯！"}], "trans": [{"q": "三年谪宦此栖迟，万古惟留楚客悲。", "a": "你被贬官在此地停留三年，千秋万代只留下楚地游子的悲哀。"}, {"q": "秋草独寻人去后，寒林空见日斜时。", "a": "我在秋草中独自寻访你离去后的遗迹，只看见夕阳斜照的清冷树林。"}, {"q": "汉文有道恩犹薄，湘水无情吊岂知？", "a": "汉文帝虽是有道明君，对你的恩情仍然寡薄；湘水无情，我的凭吊你哪里知道？"}, {"q": "寂寂江山摇落处，怜君何事到天涯！", "a": "在这寂寞冷落、草木凋零的江山间，可怜你为什么被贬谪到天涯海角！"}], "book": "9a", "grade": "九年级上册", "id": 95}, {"title": "左迁至蓝关示侄孙湘", "author": "韩愈", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "一封朝奏九重天，夕贬潮州路八千。\n欲为圣明除弊事，肯将衰朽惜残年！\n云横秦岭家何在？雪拥蓝关马不前。\n知汝远来应有意，好收吾骨瘴江边。", "theme": "抒写忠而遭贬的悲愤，表明为国除弊不惜残年、虽死无怨的刚直之志。", "notes": ["左迁：降职，贬官。蓝关：即蓝田关，在今陕西蓝田东南。", "一封：指《论佛骨表》。九重天：指朝廷、皇帝。", "圣明：指皇帝。弊事：有害的事，指迎佛骨之事。", "肯：岂肯。衰朽：衰弱多病。惜残年：顾惜晚年的生命。", "“云横秦岭”“雪拥蓝关”：即景抒情，既念家又忧国，景阔情悲。", "瘴江：泛指岭南瘴气弥漫的江流，指贬所潮州。"], "dict": [{"q": "诗中写早晨上书、傍晚即遭远贬，突出获罪之速与贬所之遥的两句是：", "a": "一封朝奏九重天，夕贬潮州路八千。"}, {"q": "诗中表明自己上书是为国除弊，哪肯因衰老而吝惜余生，表现刚直不阿、虽死无怨的两句是：", "a": "欲为圣明除弊事，肯将衰朽惜残年！"}, {"q": "诗中即景抒情，以云横秦岭、雪拥蓝关景阔情悲，既念家又忧国的两句是：", "a": "云横秦岭家何在？雪拥蓝关马不前。"}, {"q": "诗中向侄孙交代后事，语虽悲酸却悲中有壮的两句是：", "a": "知汝远来应有意，好收吾骨瘴江边。"}], "trans": [{"q": "一封朝奏九重天，夕贬潮州路八千。", "a": "早晨向朝廷呈上一封奏章，晚上就被贬到八千里外的潮州。"}, {"q": "欲为圣明除弊事，肯将衰朽惜残年！", "a": "本想替圣明的君主除去有害的政事，哪肯因为衰老就吝惜自己的余生！"}, {"q": "云横秦岭家何在？雪拥蓝关马不前。", "a": "阴云横陈在秦岭之上，家在哪里？大雪堆积在蓝关，连马也不肯前行。"}, {"q": "知汝远来应有意，好收吾骨瘴江边。", "a": "知道你远道而来定有深意，正好到瘴气弥漫的江边收拾我的尸骨。"}], "book": "9a", "grade": "九年级上册", "id": 96}, {"title": "商山早行", "author": "温庭筠", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "晨起动征铎，客行悲故乡。\n鸡声茅店月，人迹板桥霜。\n槲叶落山路，枳花明驿墙。\n因思杜陵梦，凫雁满回塘。", "theme": "描写早行途中的凄清景色，抒发游子羁旅的孤寂与浓烈的思乡之情。", "notes": ["征铎（duó）：远行车马所挂的铃铛。", "“鸡声茅店月，人迹板桥霜”：纯用名词组合意象，不着一“早”字而早行之意自现。", "槲（hú）：一种落叶乔木。枳（zhǐ）：一种落叶灌木。", "驿墙：驿站墙壁。明：照亮，这里作动词。", "杜陵：地名，在长安城南，诗人曾寓居于此，这里代指故乡。", "凫（fú）：野鸭。回塘：岸边曲折的池塘，这里以梦中温馨故乡反衬现实漂泊。"], "dict": [{"q": "诗中点明“早行”题意，直抒游子思乡之悲的两句是：", "a": "晨起动征铎，客行悲故乡。"}, {"q": "诗中纯用名词意象组合，不着一个“早”字却尽写早行清冷与旅途艰辛的千古名句是：", "a": "鸡声茅店月，人迹板桥霜。"}, {"q": "诗中写山路上槲叶飘零、驿站墙边枳花明丽，以清冷之景烘托孤寂之情的两句是：", "a": "槲叶落山路，枳花明驿墙。"}, {"q": "诗中由眼前实景转入梦中故乡，以虚实相生手法写思乡之情的两句是：", "a": "因思杜陵梦，凫雁满回塘。"}], "trans": [{"q": "晨起动征铎，客行悲故乡。", "a": "清晨起床，车马的铃铛已叮当作响；出门远行的人，总为思念故乡而悲伤。"}, {"q": "鸡声茅店月，人迹板桥霜。", "a": "鸡鸣声里，茅草旅店沐浴着晓月的余光；木板桥上铺满寒霜，印着行人的足迹。"}, {"q": "槲叶落山路，枳花明驿墙。", "a": "枯败的槲叶落满了山间小路，白色的枳花映亮了驿站的泥墙。"}, {"q": "因思杜陵梦，凫雁满回塘。", "a": "因而想起昨夜梦中回到杜陵，野鸭和大雁落满了曲折的池塘。"}], "book": "9a", "grade": "九年级上册", "id": 97}, {"title": "咸阳城东楼", "author": "许浑", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "一上高城万里愁，蒹葭杨柳似汀洲。\n溪云初起日沉阁，山雨欲来风满楼。\n鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。\n行人莫问当年事，故国东来渭水流。", "theme": "登楼远眺秦汉故都遗迹，抒发对唐朝衰亡的忧虑与历史沧桑之感。", "notes": ["咸阳：秦汉故都，在今陕西。诗题一作《咸阳城西楼晚眺》。", "蒹葭（jiān jiā）：芦苇一类的水草。汀洲：水中的小洲，这里指诗人江南故乡。", "“溪云初起日沉阁，山雨欲来风满楼”：既是自然之景，又比喻重大变故前的紧张气氛。", "芜：丛生的杂草。秦苑、汉宫：借指秦汉故都的宫苑遗迹。", "当年事：指秦汉灭亡的往事。", "故国：指秦汉故都咸阳。渭水：渭河，依旧东流，反衬人事变迁。"], "dict": [{"q": "诗中开篇即点“愁”，以蒹葭杨柳引发万里之乡愁的两句是：", "a": "一上高城万里愁，蒹葭杨柳似汀洲。"}, {"q": "诗中描写暴雨将至前的紧张气氛，后常用来比喻重大事件发生前征兆的千古名句是：", "a": "溪云初起日沉阁，山雨欲来风满楼。"}, {"q": "诗中写秦汉宫苑荒废，飞鸟下落乱草、秋蝉鸣于黄叶，抒发历史沧桑之感的两句是：", "a": "鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。"}, {"q": "诗中劝人莫问前朝旧事，唯有渭水依旧东流，以景结情、寄寓兴亡之叹的两句是：", "a": "行人莫问当年事，故国东来渭水流。"}], "trans": [{"q": "一上高城万里愁，蒹葭杨柳似汀洲。", "a": "一登上高高的城楼就生出万里愁思，芦苇杨柳让这里像极了江南的水洲。"}, {"q": "溪云初起日沉阁，山雨欲来风满楼。", "a": "溪云刚刚升起，夕阳就沉落到寺阁之后；山雨即将来临，狂风已吹满城楼。"}, {"q": "鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。", "a": "飞鸟落在秦苑的绿草丛中，已是黄昏；秋蝉在汉宫的黄叶间鸣叫。"}, {"q": "行人莫问当年事，故国东来渭水流。", "a": "过往的行人不要问当年的兴亡旧事，故都一带只有渭水依旧向东流去。"}], "book": "9a", "grade": "九年级上册", "id": 98}, {"title": "无题", "author": "李商隐", "dynasty": "唐", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "相见时难别亦难，东风无力百花残。\n春蚕到死丝方尽，蜡炬成灰泪始干。\n晓镜但愁云鬓改，夜吟应觉月光寒。\n蓬山此去无多路，青鸟殷勤为探看。", "theme": "抒写相见无期、离别难堪的相思之痛，歌颂至死不渝的忠贞爱情。", "notes": ["东风无力百花残：既写暮春景物，又象征爱情受阻与青春消逝。", "丝：与“思”谐音双关，比喻相思。泪：蜡烛油，双关指相思之泪。", "“春蚕到死丝方尽，蜡炬成灰泪始干”：今多用来赞美无私奉献的精神。", "晓镜：早晨照镜。云鬓改：指青春容颜衰老。", "蓬山：蓬莱山，神话中的海上仙山，指对方居处。", "青鸟：神话中为西王母传递信息的神鸟，后指信使。探看（kān）：探望。"], "dict": [{"q": "诗中写相见本已难得、离别更觉难堪，并以暮春百花凋零烘托伤感之情的两句是：", "a": "相见时难别亦难，东风无力百花残。"}, {"q": "诗中运用谐音双关与比喻，表现至死不渝的忠贞爱情，今多用以赞美奉献精神的千古名句是：", "a": "春蚕到死丝方尽，蜡炬成灰泪始干。"}, {"q": "诗中设想对方晨起照镜忧容颜衰老、月夜独吟觉清辉生寒，写别后相思之苦的两句是：", "a": "晓镜但愁云鬓改，夜吟应觉月光寒。"}, {"q": "诗中借蓬山、青鸟的神话传说，表达希望有人代为传递思念之情的两句是：", "a": "蓬山此去无多路，青鸟殷勤为探看。"}], "trans": [{"q": "相见时难别亦难，东风无力百花残。", "a": "相见的机会难得，分别时更觉难舍；暮春的东风柔弱无力，百花已经凋残。"}, {"q": "春蚕到死丝方尽，蜡炬成灰泪始干。", "a": "春蚕直到死去才停止吐丝，蜡烛烧成灰烬时烛泪才会干。"}, {"q": "晓镜但愁云鬓改，夜吟应觉月光寒。", "a": "清晨照镜只愁乌黑的鬓发变了颜色，夜里吟诗应能感觉到月光的清寒。"}, {"q": "蓬山此去无多路，青鸟殷勤为探看。", "a": "从这里到蓬莱仙山没有多少路程，希望青鸟能殷勤地替我去探望。"}], "book": "9a", "grade": "九年级上册", "id": 99}, {"title": "行香子", "author": "秦观", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "树绕村庄，水满陂塘。\n倚东风，豪兴徜徉。\n小园几许，收尽春光。\n有桃花红，李花白，菜花黄。\n远远围墙，隐隐茅堂。\n飏青旗，流水桥旁。\n偶然乘兴，步过东冈。\n正莺儿啼，燕儿舞，蝶儿忙。", "theme": "白描春日田园风光，展现生机盎然的乡村春景与词人的欢快闲适之情。", "notes": ["陂（bēi）塘：池塘。徜徉（cháng yáng）：自由自在地来回走动。", "几许：多少，这里表示园子不大。", "飏（yáng）：飞扬，飘扬。青旗：青色的酒幌子。", "乘兴：趁着一时兴致。东冈：东边的小山冈。", "“有桃花红，李花白，菜花黄”与“正莺儿啼，燕儿舞，蝶儿忙”：均用排比，色彩鲜明，动静相生。", "全词移步换景，上下两片由近及远，描绘出一幅春光明媚的田园风光图。"], "dict": [{"q": "词中写村庄四周绿树环绕、春水涨满池塘，点明春到农村的两句是：", "a": "树绕村庄，水满陂塘。"}, {"q": "词中写词人沐浴春风、兴致勃勃漫步漫游的两句是：", "a": "倚东风，豪兴徜徉。"}, {"q": "词中以排比句写小园中桃花、李花、菜花色彩绚丽、春意盎然的三句是：", "a": "有桃花红，李花白，菜花黄。"}, {"q": "词中写远处围墙内隐现茅屋草堂，展现乡村幽静风光的句子是：", "a": "远远围墙，隐隐茅堂。"}, {"q": "词中以莺啼、燕舞、蝶忙写春天万物竞发、生机勃勃的三句是：", "a": "正莺儿啼，燕儿舞，蝶儿忙。"}], "trans": [{"q": "树绕村庄，水满陂塘。", "a": "绿树环绕着村庄，春水涨满了池塘。"}, {"q": "小园几许，收尽春光。", "a": "小小的园子虽然不大，却收尽了全部的春光。"}, {"q": "有桃花红，李花白，菜花黄。", "a": "有红艳的桃花，雪白的李花，金黄的菜花。"}, {"q": "正莺儿啼，燕儿舞，蝶儿忙。", "a": "正是黄莺在啼叫，燕子在飞舞，蝴蝶忙忙碌碌的时候。"}], "book": "9a", "grade": "九年级上册", "id": 100}, {"title": "丑奴儿·书博山道中壁", "author": "辛弃疾", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "少年不识愁滋味，爱上层楼。\n爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。\n欲说还休，却道天凉好个秋！", "theme": "以少年与而今对比写“愁”，抒发报国无门、壮志难酬的深沉悲愤。", "notes": ["丑奴儿：词牌名，又名《采桑子》。博山：在今江西广丰西南。", "层楼：高楼。强（qiǎng）：勉强地，硬要。", "识尽：尝够，深深懂得。", "欲说还休：想说却终于没有说。休，停止。", "叠句“爱上层楼”“欲说还休”：一唱三叹，构成回环往复的音律美。", "“却道天凉好个秋”：浓愁淡写，重语轻说，含蓄深沉，耐人寻味。"], "dict": [{"q": "词中写少年时不知愁苦滋味、喜欢登高望远的两句是：", "a": "少年不识愁滋味，爱上层楼。"}, {"q": "词中写少年为写新词而勉强说愁，表现其故作深沉情态的两句是：", "a": "爱上层楼，为赋新词强说愁。"}, {"q": "词中写如今尝尽人生愁苦、千般悲郁却不知从何说起的两句是：", "a": "而今识尽愁滋味，欲说还休。"}, {"q": "词结尾浓愁淡写、重语轻说，以平淡语写深沉愁绪的两句是：", "a": "欲说还休，却道天凉好个秋！"}], "trans": [{"q": "少年不识愁滋味，爱上层楼。", "a": "少年时不知道愁苦的滋味，喜欢登高望远。"}, {"q": "爱上层楼，为赋新词强说愁。", "a": "喜欢登高望远，为了写一首新词，没有愁苦也勉强说愁。"}, {"q": "而今识尽愁滋味，欲说还休。", "a": "如今尝尽了人生的愁苦滋味，想说却又停住了。"}, {"q": "欲说还休，却道天凉好个秋！", "a": "想说却又停住不说，只转口说：好一个凉爽的秋天啊！"}], "book": "9a", "grade": "九年级上册", "id": 101}, {"title": "鱼我所欲也", "author": "《孟子》", "dynasty": "先秦", "genre": "文言文", "source": "课内", "unit": "第三单元 第9课 鱼我所欲也", "text": "鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。\n一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。", "theme": "以鱼与熊掌设喻，论证“舍生取义”，号召人保有本心，勿为利欲丧失羞恶之心。", "notes": ["辟：同“避”，躲避。患：祸患，灾难。", "辩：同“辨”，辨别。万钟：优厚的俸禄。钟，古代量器。", "乡：同“向”，先前、从前。得我：感激我。得，同“德”，感恩、感激。", "蹴：踩踏。不屑：认为不值得，表示轻视而不肯接受。", "本心：指人的羞恶之心，即“义”的天性。", "舍生而取义者也：全文中心论点，成语“舍生取义”的来源。"], "dict": [{"q": "文中以鱼和熊掌设喻，引出中心论点、表明在生命与大义不可兼得时应舍生取义的句子是：", "a": "生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。"}, {"q": "文中说明“不做苟且偷生之事”“不躲避祸患”的原因，即人有重于生、甚于死的追求的句子是：", "a": "生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。"}, {"q": "文中用假设反推，指出若人只贪生惧死则不择手段求生避祸的一组反问句是：", "a": "如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？"}, {"q": "文中强调“义”非贤者独有，人人皆有本心，贤者只是不丧失它的句子是：", "a": "非独贤者有是心也，人皆有之，贤者能勿丧耳。"}, {"q": "文中用“行道之人”“乞人”宁死不受嗟来之食的例子，论证义重于生的句子是：", "a": "呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。"}, {"q": "文中斥责为宫室华美、妻妾侍奉、他人感激而接受不义俸禄，并指出这是丧失本心的句子是：", "a": "乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。"}], "trans": [{"q": "生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。", "a": "生命是我想要的，道义也是我想要的；两样不能同时得到，我就舍弃生命而选取道义。"}, {"q": "生亦我所欲，所欲有甚于生者，故不为苟得也", "a": "生命是我想要的，但我想要的还有比生命更重要的，所以我不做苟且偷生的事。"}, {"q": "如使人之所欲莫甚于生，则凡可以得生者何不用也？", "a": "假如人们想要的没有超过生命的，那么凡是能够求生的手段，哪一样不能采用呢？"}, {"q": "非独贤者有是心也，人皆有之，贤者能勿丧耳。", "a": "不只是贤人有这种心，人人都有，只是贤人能够不丧失它罢了。"}, {"q": "呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。", "a": "没有礼貌地吆喝着给他，过路的饥民也不肯接受；用脚踩踏过再给他，乞丐也不屑于接受。"}, {"q": "万钟则不辩礼义而受之，万钟于我何加焉！", "a": "优厚的俸禄却不辨别是否合乎礼义就接受，那俸禄对我有什么益处呢！"}, {"q": "乡为身死而不受，今为宫室之美为之", "a": "先前宁愿死也不肯接受，现在为了华美的住宅却接受了。"}, {"q": "是亦不可以已乎？此之谓失其本心。", "a": "这种做法难道不可以停止吗？这就叫作丧失了人固有的羞恶之心。"}], "book": "9b", "grade": "九年级下册", "id": 102}, {"title": "唐雎不辱使命", "author": "《战国策》", "dynasty": "西汉", "genre": "文言文", "source": "课内", "unit": "第三单元 第10课 唐雎不辱使命", "text": "秦王使人谓安陵君曰：“寡人欲以五百里之地易安陵，安陵君其许寡人！”安陵君曰：“大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！”秦王不说。安陵君因使唐雎使于秦。\n秦王谓唐雎曰：“寡人以五百里之地易安陵，安陵君不听寡人，何也？且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？”唐雎对曰：“否，非若是也。安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？”\n秦王怫然怒，谓唐雎曰：“公亦尝闻天子之怒乎？”唐雎对曰：“臣未尝闻也。”秦王曰：“天子之怒，伏尸百万，流血千里。”唐雎曰：“大王尝闻布衣之怒乎？”秦王曰：“布衣之怒，亦免冠徒跣，以头抢地耳。”唐雎曰：“此庸夫之怒也，非士之怒也。夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。若士必怒，伏尸二人，流血五步，天下缟素，今日是也。”挺剑而起。\n秦王色挠，长跪而谢之曰：“先生坐！何至于此！寡人谕矣：夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。”", "theme": "写唐雎出使秦国、以死相争折服秦王，赞颂其不畏强暴、敢于斗争的士人风骨。", "notes": ["说：同“悦”，高兴。错意：在意。错，同“措”。", "抢：碰，撞。徒跣：光着脚。仓：同“苍”，青色。", "休祲：吉凶的征兆，这里偏指凶兆。休，吉祥；祲，不祥。", "缟素：白色丧服，这里用作动词，指穿白色丧服。", "色挠：面露胆怯之色。长跪：直身而跪。谢：道歉。谕：明白，懂得。", "布衣之怒与天子之怒对举，构成全文最精彩的语言交锋。"], "dict": [{"q": "文中安陵君拒绝秦王“易地”要求，表明受地于先王、愿终身守护、不敢交换的句子是：", "a": "虽然，受地于先王，愿终守之，弗敢易！"}, {"q": "唐雎面对秦王质问，表明安陵君守土不换、即使千里之地也不敢交换的句子是：", "a": "安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？"}, {"q": "文中秦王以“天子之怒”相威胁，渲染杀伐之惨的句子是：", "a": "天子之怒，伏尸百万，流血千里。"}, {"q": "文中唐雎列举专诸、聂政、要离三位布衣之士行刺时上天降示凶兆，表明自己将继之而起的三句是：", "a": "夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。"}, {"q": "文中写唐雎挺剑而起、表示要与秦王同归于尽并令天下人穿丧服的句子是：", "a": "若士必怒，伏尸二人，流血五步，天下缟素，今日是也。"}, {"q": "文末写秦王屈服谢罪，并点明安陵得以幸存只因有唐雎的句子是：", "a": "夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。"}], "trans": [{"q": "寡人欲以五百里之地易安陵，安陵君其许寡人！", "a": "我想用方圆五百里的土地交换安陵，安陵君一定要答应我！"}, {"q": "虽然，受地于先王，愿终守之，弗敢易！", "a": "虽然这样，但我从先王那里接受了封地，愿意始终守护它，不敢交换！"}, {"q": "以君为长者，故不错意也。", "a": "我把安陵君看作忠厚的长者，所以没有打他的主意。"}, {"q": "安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？", "a": "安陵君从先王那里接受土地而守护它，即使是千里的土地也不敢交换，何况只是五百里呢？"}, {"q": "天子之怒，伏尸百万，流血千里。", "a": "天子发怒，会让上百万人倒地而死，鲜血流淌千里。"}, {"q": "布衣之怒，亦免冠徒跣，以头抢地耳。", "a": "平民发怒，也不过是摘掉帽子，光着脚，用头撞地罢了。"}, {"q": "怀怒未发，休祲降于天，与臣而将四矣。", "a": "心里的怒气还没发作，吉凶的征兆就从天上降下，加上我就是第四个人了。"}, {"q": "夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。", "a": "韩国、魏国都灭亡了，而安陵却凭五十里的土地保全下来，只是因为有先生你啊。"}], "book": "9b", "grade": "九年级下册", "id": 103}, {"title": "送东阳马生序", "author": "宋濂", "dynasty": "明", "genre": "文言文", "source": "课内", "unit": "第三单元 第11课 送东阳马生序", "text": "余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。\n当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。今虽耄老，未有所成，犹幸预君子之列，而承天子之宠光，缀公卿之后，日侍坐备顾问，四海亦谬称其氏名，况才之过于余者乎？\n今诸生学于太学，县官日有廪稍之供，父母岁有裘葛之遗，无冻馁之患矣；坐大厦之下而诵诗书，无奔走之劳矣；有司业、博士为之师，未有问而不告、求而不得者也；凡所宜有之书，皆集于此，不必若余之手录，假诸人而后见也。其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？\n东阳马生君则，在太学已二年，流辈甚称其贤。余朝京师，生以乡人子谒余，撰长书以为贽，辞甚畅达。与之论辨，言和而色夷。自谓少时用心于学甚劳，是可谓善学者矣。其将归见其亲也，余故道为学之难以告之。谓余勉乡人以学者，余之志也；诋我夸际遇之盛而骄乡人者，岂知予者哉？", "theme": "自述借书求师、奔走苦学之艰，与太学生优越条件对比，勉励马生专心向学。", "notes": ["致：得到。假借：借。走：跑。逾约：超过约定期限。", "硕师：学问渊博的老师。叩问：请教。辞色：言辞和脸色。", "叱咄：训斥，呵责。俟：等待。四支：同“四肢”。汤：热水。", "被：同“披”。绮绣：有花纹的丝织品。容臭：香袋。臭，气味，这里指香气。", "缊袍敝衣：粗麻絮做的袍子和破衣。慕艳：羡慕。耄老：年老。", "廪稍：公家按时供给的粮食。遗：给予，赠送。贽：初次进见尊者时所持的礼物。"], "dict": [{"q": "文中写作者幼时家贫无书，只能借书手抄，即使严寒砚冰、手指不能屈伸也不懈怠的句子是：", "a": "天大寒，砚冰坚，手指不可屈伸，弗之怠。"}, {"q": "文中写作者抄书完毕即刻归还、不敢超过约期，因而得以博览群书的句子是：", "a": "录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。"}, {"q": "文中写作者向德高望重的先达请教时，站立陪侍、提出疑难、询问道理，俯身侧耳请教的句子是：", "a": "余立侍左右，援疑质理，俯身倾耳以请"}, {"q": "文中写作者求学途中顶着严冬大风大雪、行走深山巨谷之中、足肤冻裂而不知的句子是：", "a": "当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。"}, {"q": "文中写作者衣着破旧处于服饰华美的同舍生之间，却毫无羡慕之意的句子是：", "a": "余则缊袍敝衣处其间，略无慕艳意"}, {"q": "文中点明作者以读书为乐、不觉得吃穿不如别人的句子是：", "a": "以中有足乐者，不知口体之奉不若人也。"}, {"q": "文中指出太学生们学业不精、品德不成，若非天资低下便是用心不专的句子是：", "a": "其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？"}, {"q": "文末点明作者写作目的，表明自己是在勉励同乡人努力学习，并反驳“夸际遇之盛”之说的句子是：", "a": "谓余勉乡人以学者，余之志也；诋我夸际遇之盛而骄乡人者，岂知予者哉？"}], "trans": [{"q": "天大寒，砚冰坚，手指不可屈伸，弗之怠。", "a": "天气特别冷时，砚台里的墨冻成坚冰，手指不能屈伸，我仍不放松抄书。"}, {"q": "录毕，走送之，不敢稍逾约。", "a": "抄写完毕，赶快跑着把书送还，不敢稍稍超过约定的期限。"}, {"q": "余立侍左右，援疑质理，俯身倾耳以请", "a": "我站在前辈身边侍候，提出疑难、询问道理，弯下身子侧着耳朵请教。"}, {"q": "或遇其叱咄，色愈恭，礼愈至，不敢出一言以复", "a": "有时遇到他训斥，我的态度更加恭敬，礼节更加周到，不敢说一句话来辩解。"}, {"q": "至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。", "a": "到了学舍，四肢僵硬不能动弹，服侍的人端来热水给我浇洗，用被子裹住盖上，很久才暖和过来。"}, {"q": "寓逆旅，主人日再食，无鲜肥滋味之享。", "a": "我寄居在旅店里，店主每天只供给两顿饭，没有新鲜肥美的食物可享用。"}, {"q": "余则缊袍敝衣处其间，略无慕艳意", "a": "我却穿着旧絮做的袍子和破衣服处在他们中间，毫无羡慕的意思。"}, {"q": "以中有足乐者，不知口体之奉不若人也。", "a": "因为内心有值得快乐的事，就不觉得吃穿的供给不如别人。"}], "book": "9b", "grade": "九年级下册", "id": 104}, {"title": "渔家傲·秋思", "author": "范仲淹", "dynasty": "宋", "genre": "词", "source": "课内", "unit": "第三单元 第12课 词四首", "text": "塞下秋来风景异，衡阳雁去无留意。\n四面边声连角起，千嶂里，长烟落日孤城闭。\n浊酒一杯家万里，燕然未勒归无计。\n羌管悠悠霜满地，人不寐，将军白发征夫泪。", "theme": "描绘边塞萧瑟秋景，抒发将士思乡难归、功业未成与守边忧国的复杂情怀。", "notes": ["塞下：边界要塞之地，这里指西北边疆。衡阳雁去：即“雁去衡阳”，大雁南飞避寒。", "边声：边塞特有的风号、马鸣、羌笛等声音。千嶂：层峦叠嶂。", "燕然未勒：指战事未平、功名未立。勒，刻石记功（用窦宪燕然勒功典故）。", "羌管：羌笛。悠悠：形容声音悠长不绝。寐：睡。", "“风景异”三字统摄全词上片的边塞秋景。", "“将军白发征夫泪”以互文写将士久戍之苦与思乡之痛。"], "dict": [{"q": "词中总领全篇、点明边塞秋景与内地大不相同的一句是：", "a": "塞下秋来风景异"}, {"q": "词中借大雁南飞毫无留恋之意，反衬边地荒凉、将士思归的句子是：", "a": "衡阳雁去无留意"}, {"q": "词中写暮色中边声与号角交织、层峦环抱、孤城紧闭的戒备森严景象的句子是：", "a": "四面边声连角起，千嶂里，长烟落日孤城闭。"}, {"q": "词中写将士借酒消愁、功业未成而不能回归故里的矛盾心理的句子是：", "a": "浊酒一杯家万里，燕然未勒归无计。"}, {"q": "词中写夜深霜重、羌笛悠长、将士难以成眠的句子是：", "a": "羌管悠悠霜满地，人不寐"}, {"q": "词中以互文手法抒写将军与征夫忧国思乡、久戍生悲之情的句子是：", "a": "将军白发征夫泪"}], "trans": [{"q": "塞下秋来风景异，衡阳雁去无留意。", "a": "边塞的秋天一到，风景就与内地大不相同，大雁向衡阳飞去，毫无留恋之意。"}, {"q": "四面边声连角起，千嶂里，长烟落日孤城闭。", "a": "四面八方的边地悲声随着号角响起，层峦叠嶂之中，暮烟升起、落日斜照，孤城城门紧闭。"}, {"q": "浊酒一杯家万里，燕然未勒归无计。", "a": "喝一杯浊酒，想起万里之外的家乡；功业未成、燕然未勒，无法谋划归程。"}, {"q": "人不寐，将军白发征夫泪。", "a": "征人夜不能寐，将军因操劳生出白发，士兵们流下思乡的泪水。"}], "book": "9b", "grade": "九年级下册", "id": 105}, {"title": "江城子·密州出猎", "author": "苏轼", "dynasty": "宋", "genre": "词", "source": "课内", "unit": "第三单元 第12课 词四首", "text": "老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。\n为报倾城随太守，亲射虎，看孙郎。\n酒酣胸胆尚开张。鬓微霜，又何妨！\n持节云中，何日遣冯唐？\n会挽雕弓如满月，西北望，射天狼。", "theme": "描写出猎的壮观场面，借典抒写词人虽鬓已微霜仍渴望建功报国的豪情。", "notes": ["聊：姑且，暂且。黄：黄犬。苍：苍鹰。", "千骑：形容随从众多。倾城：全城的人都出来了。", "孙郎：指孙权，这里作者自比。胸胆尚开张：胸襟开阔，胆气豪壮。", "持节云中，何日遣冯唐：用汉文帝遣冯唐持节赦魏尚典故，自比魏尚，渴望被重用。", "天狼：星名，主侵掠，这里喻指西夏等外敌。", "“狂”字贯穿全词，是词眼。"], "dict": [{"q": "词中开篇点明豪兴、举止狂放，写左手牵黄犬、右臂托苍鹰出猎场面的句子是：", "a": "老夫聊发少年狂，左牵黄，右擎苍"}, {"q": "词中写出猎队伍装备华美、气势宏大，千骑驰骋席卷山冈的句子是：", "a": "锦帽貂裘，千骑卷平冈。"}, {"q": "词中借用孙权射虎典故，写作者要亲自射虎以答谢全城百姓相随的句子是：", "a": "为报倾城随太守，亲射虎，看孙郎。"}, {"q": "词中写酒酣之后胸怀开阔、胆气豪壮，虽鬓发微白却毫不在意的句子是：", "a": "酒酣胸胆尚开张。鬓微霜，又何妨！"}, {"q": "词中借用冯唐持节赦魏尚的典故，含蓄表达渴望得到朝廷重用的句子是：", "a": "持节云中，何日遣冯唐？"}, {"q": "词中直抒胸臆，表达作者要挽弓如满月、抗击西北外敌的报国壮志的句子是：", "a": "会挽雕弓如满月，西北望，射天狼。"}], "trans": [{"q": "老夫聊发少年狂，左牵黄，右擎苍", "a": "老夫姑且抒发一下少年的豪情，左手牵着黄犬，右手托着苍鹰。"}, {"q": "为报倾城随太守，亲射虎，看孙郎。", "a": "为了报答全城百姓跟随我出猎的盛意，我要亲自射虎，让大家看看我这个孙郎。"}, {"q": "持节云中，何日遣冯唐？", "a": "什么时候朝廷能像派冯唐持符节去云中赦免魏尚那样，重新起用我呢？"}, {"q": "会挽雕弓如满月，西北望，射天狼。", "a": "我终将把雕弓拉得像满月一样圆，朝着西北方向望去，射向那侵扰的天狼星。"}], "book": "9b", "grade": "九年级下册", "id": 106}, {"title": "破阵子·为陈同甫赋壮词以寄之", "author": "辛弃疾", "dynasty": "宋", "genre": "词", "source": "课内", "unit": "第三单元 第12课 词四首", "text": "醉里挑灯看剑，梦回吹角连营。\n八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n马作的卢飞快，弓如霹雳弦惊。\n了却君王天下事，赢得生前身后名。可怜白发生！", "theme": "追忆军营豪壮生活与沙场点兵，抒发收复失地的壮志和白发已生的悲愤。", "notes": ["挑灯：拨动灯芯使灯明亮。梦回：梦中回到。连营：营垒相连。", "八百里：指牛，这里泛指军中酒食。麾下：部下。炙：烤肉。", "五十弦：指瑟，泛指乐器。翻：演奏。塞外声：边地悲壮的乐声。", "的卢：一种烈性快马。霹雳：形容弓弦响声如雷。", "了却：完成。天下事：指收复中原、统一国家的大事。", "末句“可怜白发生”陡转，由梦境跌落现实，形成强烈反差。"], "dict": [{"q": "词中写作者醉中拨灯看剑、梦回号角连营军旅生活的句子是：", "a": "醉里挑灯看剑，梦回吹角连营。"}, {"q": "词中描写军中分食烤肉、演奏悲壮边乐、秋日沙场阅兵的句子是：", "a": "八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。"}, {"q": "词中以快马与霹雳弓声，描写战场上将士冲杀、惊心动魄的句子是：", "a": "马作的卢飞快，弓如霹雳弦惊。"}, {"q": "词中表达作者要为君王完成收复中原大业、博得生前死后英名的句子是：", "a": "了却君王天下事，赢得生前身后名。"}, {"q": "词中由梦境的豪壮陡然跌回现实，感叹功业未成而年华已逝的句子是：", "a": "可怜白发生！"}], "trans": [{"q": "醉里挑灯看剑，梦回吹角连营。", "a": "醉酒时拨亮灯火端详宝剑，梦中又回到号角声连成一片的军营。"}, {"q": "八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。", "a": "把烤熟的牛肉分给部下享用，各种乐器奏起塞外的乐曲，秋天在战场上检阅军队。"}, {"q": "马作的卢飞快，弓如霹雳弦惊。", "a": "战马像的卢马一样飞快奔驰，弓弦响如霹雳，令人心惊。"}, {"q": "了却君王天下事，赢得生前身后名。可怜白发生！", "a": "完成君王收复天下的大事，赢得生前死后的名声。可惜头发已经白了！"}], "book": "9b", "grade": "九年级下册", "id": 107}, {"title": "满江红·小住京华", "author": "秋瑾", "dynasty": "清", "genre": "词", "source": "课内", "unit": "第三单元 第12课 词四首", "text": "小住京华，早又是中秋佳节。为篱下黄花开遍，秋容如拭。\n四面歌残终破楚，八年风味徒思浙。\n苦将侬强派作蛾眉，殊未屑！\n身不得，男儿列，心却比，男儿烈。\n算平生肝胆，因人常热。\n俗子胸襟谁识我？英雄末路当磨折。\n莽红尘何处觅知音？青衫湿！", "theme": "抒发词人冲破家庭束缚、不甘身为女子的豪情与救国壮志，兼有知音难觅的悲慨。", "notes": ["京华：京城的美称，这里指北京。拭：擦。", "四面歌残终破楚：用“四面楚歌”典故，喻指冲破家庭牢笼，也喻国势危殆。", "侬：我。蛾眉：指女子。殊未屑：很不屑，极不甘心。", "肝胆：指真诚的心。因人常热：为别人而屡屡激动。", "莽红尘：莽莽人世。青衫湿：用白居易《琵琶行》“江州司马青衫湿”典故。", "“身不得，男儿列，心却比，男儿烈”为全词警策，凸显巾帼豪情。"], "dict": [{"q": "词中点明客居京城、时令又到中秋，并以明净秋景烘托心情的句子是：", "a": "小住京华，早又是中秋佳节。为篱下黄花开遍，秋容如拭。"}, {"q": "词中化用“四面楚歌”典故，写自己终于冲破家庭牢笼、感叹国势危殆的句子是：", "a": "四面歌残终破楚，八年风味徒思浙。"}, {"q": "词中表现作者不甘心被强作女子、对贵妇人生活极不屑的句子是：", "a": "苦将侬强派作蛾眉，殊未屑！"}, {"q": "词中写自己虽身为女子不能列入男儿之列，但心志比男儿更刚烈的名句是：", "a": "身不得，男儿列，心却比，男儿烈。"}, {"q": "词中写自己平生真诚热忱、常为他人而激动的句子是：", "a": "算平生肝胆，因人常热。"}, {"q": "词中写世俗之人胸襟狭隘无人理解自己、英雄无路难免受尽磨折的句子是：", "a": "俗子胸襟谁识我？英雄末路当磨折。"}, {"q": "词末化用白居易《琵琶行》典故，抒发知音难觅、伤怀落泪之情的句子是：", "a": "莽红尘何处觅知音？青衫湿！"}], "trans": [{"q": "为篱下黄花开遍，秋容如拭。", "a": "篱笆下菊花开得遍地金黄，秋天的景色像擦拭过一样明净。"}, {"q": "四面歌残终破楚，八年风味徒思浙。", "a": "在四面歌声残歇中终于冲破家庭的牢笼，八年来只能徒然思念浙江的生活。"}, {"q": "身不得，男儿列，心却比，男儿烈。", "a": "我虽然不能身为男子加入他们的行列，心却比男儿还要刚烈。"}, {"q": "莽红尘何处觅知音？青衫湿！", "a": "莽莽红尘之中到哪里去寻找知音？忍不住泪湿了衣衫！"}], "book": "9b", "grade": "九年级下册", "id": 108}, {"title": "定风波（莫听穿林打叶声）", "author": "苏轼", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "三月七日，沙湖道中遇雨。雨具先去，同行皆狼狈，余独不觉。已而遂晴，故作此词。\n莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。", "theme": "借途中遇雨小事，表现词人豁达超脱、不惧人生风雨的胸襟与人生感悟。", "notes": ["吟啸：吟咏长啸，表示意态闲适。芒鞋：草鞋。", "一蓑烟雨任平生：一身蓑衣任凭风吹雨打，照样过我的一生。", "料峭：形容微寒，多指春寒。斜照：斜阳，夕阳。", "向来：刚才。萧瑟处：指遇雨之地，也指风雨声。", "小序“雨具先去，同行皆狼狈，余独不觉”已奠定全词旷达基调。", "“也无风雨也无晴”一语双关，兼指自然阴晴与人生得失。"], "dict": [{"q": "词中写不必理会穿林打叶的雨声，不妨吟咏长啸、缓步而行，表现从容镇定的句子是：", "a": "莫听穿林打叶声，何妨吟啸且徐行。"}, {"q": "词中以竹杖芒鞋比骑马更轻捷，反问有何可惧，写出不畏坎坷的旷达的句子是：", "a": "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"}, {"q": "词中写春风微寒吹醒酒意、略感寒冷而山头夕阳相迎的句子是：", "a": "料峭春风吹酒醒，微冷，山头斜照却相迎。"}, {"q": "词中写回头看刚才风吹雨打之处，信步归去，表达人生无风无雨也无晴的彻悟的句子是：", "a": "回首向来萧瑟处，归去，也无风雨也无晴。"}, {"q": "词中一语双关，以自然阴晴喻人生得失荣辱、表现宠辱不惊的句子是：", "a": "也无风雨也无晴"}], "trans": [{"q": "莫听穿林打叶声，何妨吟啸且徐行。", "a": "不必理会那穿过树林、敲打树叶的雨声，何不一边吟咏长啸，一边慢慢前行。"}, {"q": "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。", "a": "拄着竹杖穿着草鞋比骑马还轻快，怕什么？身披一件蓑衣，任凭一生风吹雨打。"}, {"q": "料峭春风吹酒醒，微冷，山头斜照却相迎。", "a": "料峭的春风把醉意吹醒，微微感到寒冷，山头的斜阳却来迎接我。"}, {"q": "回首向来萧瑟处，归去，也无风雨也无晴。", "a": "回头望刚才遇雨的地方，信步归去，对我来说既无所谓风雨，也无所谓天晴。"}], "book": "9b", "grade": "九年级下册", "id": 109}, {"title": "临江仙·夜登小阁，忆洛中旧游", "author": "陈与义", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。\n杏花疏影里，吹笛到天明。\n二十余年如一梦，此身虽在堪惊。\n闲登小阁看新晴。古今多少事，渔唱起三更。", "theme": "忆洛中旧游之乐，叹二十余年如一梦，抒发国破家亡后的沧桑与旷达。", "notes": ["午桥：在洛阳南。豪英：杰出的人物。", "长沟流月去无声：月影随流水悄然消逝，暗喻岁月流逝。", "疏影：稀疏的影子。新晴：雨后初晴的月色。", "二十余年如一梦：作者经历靖康之难，流离南渡，故有此叹。堪惊：令人惊心。", "渔唱：渔人的歌声。三更：半夜。", "“杏花疏影里，吹笛到天明”为传诵的名句，以静景写豪兴。"], "dict": [{"q": "词中追忆往昔在洛阳午桥与众多英雄豪杰宴饮的句子是：", "a": "忆昔午桥桥上饮，坐中多是豪英。"}, {"q": "词中以月影随流水悄然消逝，暗写时光流逝、岁月不再的句子是：", "a": "长沟流月去无声。"}, {"q": "词中描写月夜杏花疏影之下吹笛直到天明、极写昔日豪兴的句子是：", "a": "杏花疏影里，吹笛到天明。"}, {"q": "词中感叹二十余年恍如一梦、身虽幸存却令人惊心的句子是：", "a": "二十余年如一梦，此身虽在堪惊。"}, {"q": "词中写词人闲登小阁看雨后新晴，并将古今兴亡事化作渔人夜半歌声的句子是：", "a": "闲登小阁看新晴。古今多少事，渔唱起三更。"}], "trans": [{"q": "忆昔午桥桥上饮，坐中多是豪英。", "a": "回忆当年在午桥桥上饮酒，在座的大多是英雄豪杰。"}, {"q": "长沟流月去无声。", "a": "月光随着长长的河水流去，静悄悄地没有一点声音。"}, {"q": "杏花疏影里，吹笛到天明。", "a": "在杏花稀疏的影子下面，吹着笛子一直吹到天亮。"}, {"q": "二十余年如一梦，此身虽在堪惊。", "a": "二十多年过去就像一场梦，我这身子虽然还在，回想起来也令人惊心。"}], "book": "9b", "grade": "九年级下册", "id": 110}, {"title": "太常引·建康中秋夜为吕叔潜赋", "author": "辛弃疾", "dynasty": "宋", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "一轮秋影转金波，飞镜又重磨。\n把酒问姮娥：被白发，欺人奈何？\n乘风好去，长空万里，直下看山河。\n斫去桂婆娑，人道是，清光更多。", "theme": "中秋对月抒怀，感叹白发欺人、壮志难酬，寄寓收复山河、扫清黑暗的理想。", "notes": ["金波：形容月光浮动，如金色的波涛。飞镜：比喻月亮。", "姮娥：即嫦娥，这里指月宫仙子。被白发：白发覆盖头顶，即年老。", "欺人奈何：欺负人又有什么办法呢？奈何，怎么办。", "斫：砍。桂婆娑：指月宫中摇曳的桂树。", "“清光更多”：砍去桂树，月光会更明亮，喻扫除黑暗、还我山河。", "全词借月抒怀，浪漫想象中寄寓深沉的爱国之情。"], "dict": [{"q": "词中以金波、飞镜为喻，描写中秋一轮圆月又明又亮的句子是：", "a": "一轮秋影转金波，飞镜又重磨。"}, {"q": "词中写词人举酒问月中嫦娥，感叹白发欺人、年华老去而功业未成的句子是：", "a": "把酒问姮娥：被白发，欺人奈何？"}, {"q": "词中写词人想乘风飞上万里长空、俯瞰祖国大好河山的句子是：", "a": "乘风好去，长空万里，直下看山河。"}, {"q": "词中写要砍去月中婆娑桂树、使清光更多的句子是：", "a": "斫去桂婆娑，人道是，清光更多。"}, {"q": "词中托物言志，以砍去桂树使月色更明比喻扫除黑暗、还我山河的句子是：", "a": "斫去桂婆娑，人道是，清光更多。"}], "trans": [{"q": "一轮秋影转金波，飞镜又重磨。", "a": "一轮秋月洒下金波缓缓转动，天上的明镜好像又被重新磨过。"}, {"q": "把酒问姮娥：被白发，欺人奈何？", "a": "我举起酒杯问月中嫦娥：白发这样欺弄人，我该拿它怎么办呢？"}, {"q": "乘风好去，长空万里，直下看山河。", "a": "我要乘着长风飞上万里长空，从高空俯瞰祖国的大好河山。"}, {"q": "斫去桂婆娑，人道是，清光更多。", "a": "砍去月中那棵婆娑的桂树，人们说这样月亮洒下的清辉会更多。"}], "book": "9b", "grade": "九年级下册", "id": 111}, {"title": "浣溪沙（身向云山那畔行）", "author": "纳兰性德", "dynasty": "清", "genre": "词", "source": "课外诵读", "unit": "课外古诗词诵读（一）", "text": "身向云山那畔行，北风吹断马嘶声，深秋远塞若为情！\n一抹晚烟荒戍垒，半竿斜日旧关城。\n古今幽恨几时平！", "theme": "写深秋远赴边塞途中所见荒凉之景，抒发古今幽恨难平、凄惘怅然之情。", "notes": ["那畔：那边，指关外。若为情：何以堪，情何以堪。", "戍垒：边防驻军的营垒。关城：关塞上的城堡。", "一抹晚烟：一缕傍晚的炊烟。半竿斜日：夕阳斜照，离地半竿高。", "幽恨：深藏于心的怨恨、憾恨。平：平息，消解。", "上片写行旅之苦，下片写边塞荒凉之景，景中寓情。", "“古今幽恨几时平”由个人之愁推向古今之恨，境界扩大。"], "dict": [{"q": "词中写作者向云山那边行进、北风呼啸吹断了马嘶声的句子是：", "a": "身向云山那畔行，北风吹断马嘶声"}, {"q": "词中点明时令为深秋、身赴遥远边塞，直抒凄惘难堪之情的句子是：", "a": "深秋远塞若为情！"}, {"q": "词中以一缕晚烟、荒废营垒、半竿斜阳、旧关城，写边塞萧瑟荒凉的句子是：", "a": "一抹晚烟荒戍垒，半竿斜日旧关城。"}, {"q": "词中将个人愁绪推向古今之恨，抒发幽恨难平之情的句子是：", "a": "古今幽恨几时平！"}], "trans": [{"q": "身向云山那畔行，北风吹断马嘶声", "a": "我向着云山那一边前行，凛冽的北风盖住了马的嘶鸣声。"}, {"q": "深秋远塞若为情！", "a": "深秋时节身在遥远的边塞，叫人如何承受这般情怀！"}, {"q": "一抹晚烟荒戍垒，半竿斜日旧关城。", "a": "一缕晚烟笼罩着荒凉的营垒，半竿高的夕阳斜照着旧时的关城。"}, {"q": "古今幽恨几时平！", "a": "古往今来这深重的幽恨，什么时候才能平息！"}], "book": "9b", "grade": "九年级下册", "id": 112}, {"title": "曹刿论战", "author": "《左传》", "dynasty": "先秦", "genre": "文言文", "source": "课内", "unit": "第六单元 第20课 曹刿论战", "text": "十年春，齐师伐我。公将战，曹刿请见。其乡人曰：“肉食者谋之，又何间焉？”刿曰：“肉食者鄙，未能远谋。”乃入见。问：“何以战？”公曰：“衣食所安，弗敢专也，必以分人。”对曰：“小惠未遍，民弗从也。”公曰：“牺牲玉帛，弗敢加也，必以信。”对曰：“小信未孚，神弗福也。”公曰：“小大之狱，虽不能察，必以情。”对曰：“忠之属也。可以一战。战则请从。”\n公与之乘，战于长勺。公将鼓之。刿曰：“未可。”齐人三鼓。刿曰：“可矣。”齐师败绩。公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。\n既克，公问其故。对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”", "theme": "记叙长勺之战，表现曹刿取信于民、战机把握与谨慎判断的远谋与军事才能。", "notes": ["间：参与。鄙：鄙陋，这里指目光短浅。遍：遍及、普遍。", "牺牲：祭祀用的牛、羊、猪等。加：虚夸，以少报多。信：实情。", "孚：使信服。福：赐福，保佑。狱：诉讼事件。察：明察。情：诚心，实情。", "忠之属也：（这是）尽职分之类的事情。属，类。", "鼓：击鼓进军。败绩：大败。驰：驱车追赶。辙：车轮碾出的痕迹。轼：车前横木。", "靡：倒下。盈：充满，这里指士气正旺盛。"], "dict": [{"q": "文中写曹刿不顾同乡劝阻，执意进见，点明当权者目光短浅、不能深谋远虑的句子是：", "a": "肉食者鄙，未能远谋。"}, {"q": "文中曹刿认为衣食之类的恩惠不能遍及百姓、百姓不会听从的句子是：", "a": "小惠未遍，民弗从也。"}, {"q": "文中曹刿认为小的信用不能使神灵信服、神不会降福的句子是：", "a": "小信未孚，神弗福也。"}, {"q": "文中曹刿肯定鲁庄公“以情断案”、认为这是尽职分之类、可以凭此作战的句子是：", "a": "忠之属也。可以一战。战则请从。"}, {"q": "文中写曹刿在齐军三鼓之后才下令进军、在察看车辙与旗帜之后才下令追击的句子是：", "a": "齐人三鼓。刿曰：“可矣。”齐师败绩。"}, {"q": "文中曹刿说明取胜原因在于士气，指出作战靠勇气、一鼓振作士气、再而衰、三而竭的句子是：", "a": "夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。"}, {"q": "文中曹刿说明追击前下车察看车辙、登轼远望的原因，防止大国设伏的句子是：", "a": "夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。"}], "trans": [{"q": "肉食者鄙，未能远谋。", "a": "当权的人目光短浅，不能深谋远虑。"}, {"q": "衣食所安，弗敢专也，必以分人。", "a": "衣食这类用来养生的东西，我不敢独自享用，一定把它们分给别人。"}, {"q": "小惠未遍，民弗从也。", "a": "这种小恩小惠不能遍及百姓，老百姓是不会听从您的。"}, {"q": "牺牲玉帛，弗敢加也，必以信。", "a": "祭祀用的牛羊玉帛，我从来不敢虚报数目，一定对神说实话。"}, {"q": "小大之狱，虽不能察，必以情。", "a": "大大小小的诉讼案件，即使不能一一明察，也一定按照实情处理。"}, {"q": "忠之属也。可以一战。战则请从。", "a": "这是尽职分之类的事，可以凭这个条件打一仗。作战时请让我跟随。"}, {"q": "一鼓作气，再而衰，三而竭。", "a": "第一次击鼓能振作士气，第二次击鼓士气就减弱，第三次就枯竭了。"}, {"q": "吾视其辙乱，望其旗靡，故逐之。", "a": "我看到他们车轮的痕迹混乱，望见他们的旗帜倒下，所以才追击他们。"}], "book": "9b", "grade": "九年级下册", "id": 113}, {"title": "邹忌讽齐王纳谏", "author": "《战国策》", "dynasty": "西汉", "genre": "文言文", "source": "课内", "unit": "第六单元 第21课 邹忌讽齐王纳谏", "text": "邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：“我孰与城北徐公美？”其妻曰：“君美甚，徐公何能及君也？”城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：“吾孰与徐公美？”妾曰：“徐公何能及君也？”旦日，客从外来，与坐谈，问之客曰：“吾与徐公孰美？”客曰：“徐公不若君之美也。”明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之，曰：“吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。”\n于是入朝见威王，曰：“臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”\n王曰：“善。”乃下令：“群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。”令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。", "theme": "由邹忌比美悟出受蒙蔽之理，讽齐王广开言路，终使齐国大治、战胜于朝廷。", "notes": ["修：长，这里指身高。昳丽：光艳美丽。服：穿戴。窥镜：照镜子。", "旦日：第二天。明日：次日，又过了一天。孰：同“熟”，仔细。", "私：偏爱。美我：认为我美。蔽：所受的蒙蔽。", "面刺：当面指责。谤讥：指责讥刺。市朝：指公共场所。闻：使……听到。", "间进：偶然进谏。间，间或、偶然。期年：满一年。", "门庭若市：门前院内像集市一样，形容进谏者众多。"], "dict": [{"q": "文中写邹忌早晨穿戴衣帽照镜子，向妻子询问自己与城北徐公谁美的句子是：", "a": "朝服衣冠，窥镜，谓其妻曰：“我孰与城北徐公美？”"}, {"q": "文中写邹忌见到徐公后仔细观察、照镜自省，自愧远远不如的句子是：", "a": "明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。"}, {"q": "文中邹忌暮寝而思，指出妻、妾、客赞美自己分别出于偏爱、畏惧和有所求的句子是：", "a": "吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。"}, {"q": "文中写邹忌以家事比国事，指出宫妇左右、朝廷之臣、四境之内对王各有私、畏、求的句子是：", "a": "宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王"}, {"q": "文中点明齐王所受蒙蔽之深，为进谏结论的句子是：", "a": "由此观之，王之蔽甚矣。"}, {"q": "文中写齐威王下令奖赏当面指责、上书进谏、在公共场所议论并传入耳中的三类人，其中受下赏的句子是：", "a": "能谤讥于市朝，闻寡人之耳者，受下赏。"}, {"q": "文中写政令初下时群臣争相进谏、宫廷像集市一样热闹的句子是：", "a": "令初下，群臣进谏，门庭若市"}, {"q": "文中写一年之后进谏者无话可进、齐国内政修明，并点明他国来朝、不战而胜的句子是：", "a": "期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。"}], "trans": [{"q": "邹忌修八尺有余，而形貌昳丽。", "a": "邹忌身高八尺多，体形容貌光艳美丽。"}, {"q": "吾妻之美我者，私我也；妾之美我者，畏我也", "a": "我的妻子认为我美，是偏爱我；我的妾认为我美，是害怕我。"}, {"q": "臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。", "a": "我的妻子偏爱我，我的妾害怕我，我的客人有求于我，都认为我比徐公美。"}, {"q": "今齐地方千里，百二十城", "a": "如今齐国的土地方圆千里，有一百二十座城池。"}, {"q": "由此观之，王之蔽甚矣。", "a": "从这些情形来看，大王您所受的蒙蔽太严重了。"}, {"q": "能谤讥于市朝，闻寡人之耳者，受下赏。", "a": "能够在公共场所议论我的过失，并让我听到的，可得下等奖赏。"}, {"q": "期年之后，虽欲言，无可进者。", "a": "满一年以后，即使有人想进谏，也没有什么可说的了。"}, {"q": "此所谓战胜于朝廷。", "a": "这就是人们所说的在朝廷上战胜别国。"}], "book": "9b", "grade": "九年级下册", "id": 114}, {"title": "陈涉世家", "author": "司马迁", "dynasty": "汉", "genre": "文言文", "source": "课内", "unit": "第六单元 第22课 陈涉世家", "text": "陈胜者，阳城人也，字涉。吴广者，阳夏人也，字叔。陈涉少时，尝与人佣耕，辍耕之垄上，怅恨久之，曰：“苟富贵，无相忘。”佣者笑而应曰：“若为佣耕，何富贵也？”陈涉太息曰：“嗟乎！燕雀安知鸿鹄之志哉！”\n二世元年七月，发闾左適戍渔阳，九百人屯大泽乡。陈胜、吴广皆次当行，为屯长。会天大雨，道不通，度已失期。失期，法皆斩。陈胜、吴广乃谋曰：“今亡亦死，举大计亦死；等死，死国可乎？”陈胜曰：“天下苦秦久矣。吾闻二世少子也，不当立，当立者乃公子扶苏。扶苏以数谏故，上使外将兵。今或闻无罪，二世杀之。百姓多闻其贤，未知其死也。项燕为楚将，数有功，爱士卒，楚人怜之。或以为死，或以为亡。今诚以吾众诈自称公子扶苏、项燕，为天下唱，宜多应者。”吴广以为然。乃行卜。卜者知其指意，曰：“足下事皆成，有功。然足下卜之鬼乎！”陈胜、吴广喜，念鬼，曰：“此教我先威众耳。”乃丹书帛曰“陈胜王”，置人所罾鱼腹中。卒买鱼烹食，得鱼腹中书，固以怪之矣。又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰：“大楚兴，陈胜王。”卒皆夜惊恐。旦日，卒中往往语，皆指目陈胜。\n吴广素爱人，士卒多为用者。将尉醉，广故数言欲亡，忿恚尉，令辱之，以激怒其众。尉果笞广。尉剑挺，广起，夺而杀尉。陈胜佐之，并杀两尉。召令徒属曰：“公等遇雨，皆已失期，失期当斩。藉第令毋斩，而戍死者固十六七。且壮士不死即已，死即举大名耳，王侯将相宁有种乎！”徒属皆曰：“敬受命。”乃诈称公子扶苏、项燕，从民欲也。袒右，称大楚。为坛而盟，祭以尉首。陈胜自立为将军，吴广为都尉。攻大泽乡，收而攻蕲。蕲下，乃令符离人葛婴将兵徇蕲以东。攻铚、酂、苦、柘、谯皆下之。行收兵。比至陈，车六七百乘，骑千余，卒数万人。攻陈，陈守令皆不在，独守丞与战谯门中。弗胜，守丞死，乃入据陈。数日，号令召三老、豪杰与皆来会计事。三老、豪杰皆曰：“将军身被坚执锐，伐无道，诛暴秦，复立楚国之社稷，功宜为王。”陈涉乃立为王，号为张楚。当此时，诸郡县苦秦吏者，皆刑其长吏，杀之以应陈涉。", "theme": "记叙陈胜吴广起义的原因、谋划与发动过程，赞颂其反抗暴秦的首事之功与鸿鹄之志。", "notes": ["辍：停止。之：去、往。怅恨：惆怅，极端不满。苟：如果。", "適戍：强迫去守边。適，同“谪”。屯：停驻。会：适逢，恰巧遇到。", "亡：逃走。等死：同样是死。死国：为国事而死。唱：同“倡”，倡导。", "罾：渔网，这里用作动词，用网捕。间：私下。篝火：用竹笼罩着火。狐鸣：模仿狐狸嗥叫。", "忿恚：恼怒，使……恼怒。笞：用鞭、杖或竹板打。并：一齐。", "藉第令毋斩：即使能免于斩刑。宁：难道。比：等到。刑：惩处。"], "dict": [{"q": "文中写陈涉年轻时与人佣耕，表达若富贵后不忘记同伴的句子是：", "a": "苟富贵，无相忘。"}, {"q": "文中用比喻表现陈涉远大志向、感叹平凡人不能理解英雄抱负的名句是：", "a": "嗟乎！燕雀安知鸿鹄之志哉！"}, {"q": "文中点明起义直接原因：遇上大雨误期、按秦法皆当斩的句子是：", "a": "会天大雨，道不通，度已失期。失期，法皆斩。"}, {"q": "文中写陈胜吴广分析形势，认为逃亡与起义都是死，不如为国事而死一句是：", "a": "今亡亦死，举大计亦死；等死，死国可乎？"}, {"q": "文中揭示起义根本原因，指出天下百姓长期受秦暴政之苦的句子是：", "a": "天下苦秦久矣。"}, {"q": "文中写起义前制造舆论，在帛上写“陈胜王”置于鱼腹之中，士卒买鱼得书的句子是：", "a": "乃丹书帛曰“陈胜王”，置人所罾鱼腹中。卒买鱼烹食，得鱼腹中书，固以怪之矣。"}, {"q": "文中写起义前夜在丛祠中燃篝火、学狐鸣呼喊“大楚兴，陈胜王”的句子是：", "a": "又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰：“大楚兴，陈胜王。”"}, {"q": "文中陈胜号召徒属，喊出打破血统论、表现反抗精神的千古名句是：", "a": "且壮士不死即已，死即举大名耳，王侯将相宁有种乎！"}], "trans": [{"q": "苟富贵，无相忘。", "a": "如果将来谁富贵了，彼此不要忘记对方。"}, {"q": "嗟乎！燕雀安知鸿鹄之志哉！", "a": "唉！燕雀怎么能知道鸿鹄的远大志向呢！"}, {"q": "会天大雨，道不通，度已失期。失期，法皆斩。", "a": "正碰上下大雨，道路不通，估计已经误了期限。误了期限，按法律都要杀头。"}, {"q": "今亡亦死，举大计亦死；等死，死国可乎？", "a": "现在逃跑也是死，发动起义也是死；同样是死，为国事而死可以吗？"}, {"q": "旦日，卒中往往语，皆指目陈胜。", "a": "第二天，戍卒中到处谈论这件事，都指指点点地注视着陈胜。"}, {"q": "藉第令毋斩，而戍死者固十六七。", "a": "即使能免于斩刑，而戍守边塞死去的本来也有十分之六七。"}, {"q": "且壮士不死即已，死即举大名耳，王侯将相宁有种乎！", "a": "况且壮士不死便罢，要死就要成就大名声，王侯将相难道是天生的贵种吗！"}, {"q": "将军身被坚执锐，伐无道，诛暴秦", "a": "将军亲自披着坚固的铠甲，手拿锐利的武器，讨伐无道的暴君，诛灭残暴的秦朝。"}], "book": "9b", "grade": "九年级下册", "id": 115}, {"title": "出师表", "author": "诸葛亮", "dynasty": "三国", "genre": "文言文", "source": "课内", "unit": "第六单元 第23课 出师表", "text": "先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。\n宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。\n侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。\n将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。\n亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。\n臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。\n先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。\n愿陛下托臣以讨贼兴复之效；不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎。陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。今当远离，临表涕零，不知所言。", "theme": "诸葛亮出师北伐前上书后主，劝其广开言路、严明赏罚、亲贤远佞，并抒发报先帝忠陛下的深情。", "notes": ["崩殂：指帝王之死。秋：时候。殊遇：特殊的礼遇。开张圣听：扩大皇上听闻的范围。", "陟罚臧否：晋升、处罚、赞扬、批评。异同：这里指不同。作奸犯科：做奸邪事情，触犯科条。", "简拔：选拔。遗：给予。裨补阙漏：弥补缺失疏漏。阙，同“缺”。", "淑均：善良公正。行阵：行伍，部队。痛恨：痛心、遗憾。", "卑鄙：社会地位低微，见识短浅（古今异义）。猥：辱，谦辞。驱驰：奔走效劳。", "驽钝：比喻才能平庸。攘除：排除，铲除。咨诹：询问。雅言：正确合理的言论。"], "dict": [{"q": "文中指出蜀汉正处于危急存亡时刻，点明形势严峻的句子是：", "a": "今天下三分，益州疲弊，此诚危急存亡之秋也。"}, {"q": "文中劝勉后主广泛听取意见、发扬先帝遗德、振奋志士之气的句子是：", "a": "诚宜开张圣听，以光先帝遗德，恢弘志士之气"}, {"q": "文中提出赏罚应一视同仁，不宜偏私、使宫内与丞相府法度不同的句子是：", "a": "宫中府中，俱为一体，陟罚臧否，不宜异同。"}, {"q": "文中总结两汉兴衰教训，提出亲贤远佞建议的句子是：", "a": "亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。"}, {"q": "文中写作者本为一介平民、在乱世中只求保全性命、不图显达的句子是：", "a": "臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。"}, {"q": "文中写先帝不以作者身份低微而屈尊三顾茅庐、询问当世大事的句子是：", "a": "先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事"}, {"q": "文中写作者在兵败危难之际接受重任，至今已二十一载的句子是：", "a": "后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。"}, {"q": "文中写作者受命以来日夜忧虑、唯恐辜负先帝托付，故五月渡泸深入荒远之地的句子是：", "a": "受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。"}, {"q": "文中写作者要统率三军北定中原、竭尽驽钝、兴复汉室、还于旧都的句子是：", "a": "当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。"}, {"q": "文末写作者即将远征、面对奏表泪落不止、不知所言，表现眷恋之情的句子是：", "a": "今当远离，临表涕零，不知所言。"}], "trans": [{"q": "此诚危急存亡之秋也。", "a": "这确实是形势危急、决定国家存亡的时刻啊。"}, {"q": "陟罚臧否，不宜异同。", "a": "晋升、处罚、表扬、批评，不应该因在宫中或在府中而标准不同。"}, {"q": "亲贤臣，远小人，此先汉所以兴隆也", "a": "亲近贤臣，疏远小人，这是西汉兴盛的原因。"}, {"q": "苟全性命于乱世，不求闻达于诸侯。", "a": "在乱世中苟且保全性命，不希求在诸侯中显身扬名。"}, {"q": "先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中", "a": "先帝不嫌我身份低微、见识短浅，降低身份委屈自己，三次到草庐中来看望我。"}, {"q": "受任于败军之际，奉命于危难之间", "a": "在军队失败的时候接受任命，在危难紧迫的时刻奉命出使。"}, {"q": "故五月渡泸，深入不毛。", "a": "所以我在五月渡过泸水，深入到荒凉贫瘠、不长草木的地方。"}, {"q": "庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。", "a": "希望竭尽我平庸的才能，铲除奸邪凶恶的敌人，复兴汉室，回到原来的都城。"}], "book": "9b", "grade": "九年级下册", "id": 116}, {"title": "十五从军征", "author": "佚名（《乐府诗集》）", "dynasty": "汉", "genre": "民歌", "source": "课内", "unit": "第六单元 第24课 诗词曲五首", "text": "十五从军征，八十始得归。\n道逢乡里人：“家中有阿谁？”\n“遥看是君家，松柏冢累累。”\n兔从狗窦入，雉从梁上飞。\n中庭生旅谷，井上生旅葵。\n舂谷持作饭，采葵持作羹。\n羹饭一时熟，不知饴阿谁。\n出门东向看，泪落沾我衣。", "theme": "叙写老兵十五从军、八十始归却家破人亡的遭遇，控诉兵役制度的残酷。", "notes": ["始：才。阿谁：谁。阿，语助词。", "冢：坟墓。累累：连续不断的样子。狗窦：给狗出入的墙洞。", "雉：野鸡。中庭：屋前的院子。旅谷、旅葵：野生的谷子和葵菜。", "舂：把谷物放在石臼里捣去外壳。羹：用菜做成的汤。", "饴：同“贻”，送给。一时：一会儿就。", "“兔从狗窦入，雉从梁上飞，中庭生旅谷，井上生旅葵”以白描写家园荒芜。"], "dict": [{"q": "诗中用两个数字极言从军时间之久、揭露兵役制度残酷的句子是：", "a": "十五从军征，八十始得归。"}, {"q": "诗中写老兵归途中向乡人打听家中还有谁、急切盼归的句子是：", "a": "道逢乡里人：“家中有阿谁？”"}, {"q": "诗中乡人回答老兵，指出其家已是松柏成林、坟冢相连的句子是：", "a": "遥看是君家，松柏冢累累。"}, {"q": "诗中以野兔入狗洞、野鸡飞屋梁，写家中久无人居、一片荒凉的句子是：", "a": "兔从狗窦入，雉从梁上飞。"}, {"q": "诗中写院中井边长出野生谷物和葵菜，进一步写家园荒芜的句子是：", "a": "中庭生旅谷，井上生旅葵。"}, {"q": "诗中写老兵做饭做羹后无人可赠、孤苦无依的句子是：", "a": "羹饭一时熟，不知饴阿谁。"}, {"q": "诗中写老兵出门东望、泪落沾衣，极写悲怆绝望的句子是：", "a": "出门东向看，泪落沾我衣。"}], "trans": [{"q": "十五从军征，八十始得归。", "a": "十五岁就应征去打仗，八十岁才得以回到家乡。"}, {"q": "遥看是君家，松柏冢累累。", "a": "远远看去那就是你的家，如今已是松柏成林、坟冢相连。"}, {"q": "兔从狗窦入，雉从梁上飞。", "a": "野兔从狗洞里钻进钻出，野鸡在屋梁上飞来飞去。"}, {"q": "舂谷持作饭，采葵持作羹。", "a": "捣去谷壳拿来做饭，采摘葵叶拿来煮菜羹。"}, {"q": "羹饭一时熟，不知饴阿谁。", "a": "汤和饭一会儿就做好了，却不知道该送给谁吃。"}], "book": "9b", "grade": "九年级下册", "id": 117}, {"title": "白雪歌送武判官归京", "author": "岑参", "dynasty": "唐", "genre": "诗", "source": "课内", "unit": "第六单元 第24课 诗词曲五首", "text": "北风卷地白草折，胡天八月即飞雪。\n忽如一夜春风来，千树万树梨花开。\n散入珠帘湿罗幕，狐裘不暖锦衾薄。\n将军角弓不得控，都护铁衣冷难着。\n瀚海阑干百丈冰，愁云惨淡万里凝。\n中军置酒饮归客，胡琴琵琶与羌笛。\n纷纷暮雪下辕门，风掣红旗冻不翻。\n轮台东门送君去，去时雪满天山路。\n山回路转不见君，雪上空留马行处。", "theme": "以奇丽雪景写边塞奇寒与饯别场面，抒发对友人离去的不舍与绵绵怅惘。", "notes": ["白草：西北地区的一种牧草，干熟时变白。胡天：指塞北一带的天空。", "珠帘：用珍珠缀成的帘子。罗幕：丝绸制的帐幕。锦衾：锦缎被子。", "角弓：两端用兽角装饰的硬弓。控：拉开。都护：镇守边疆的长官。着：穿。", "瀚海：指沙漠。阑干：纵横交错的样子。惨淡：暗淡无光。", "掣：拉，扯。这里指风吹。冻不翻：红旗被冻硬，风也不能吹动。", "“忽如一夜春风来，千树万树梨花开”以春花喻冬雪，为咏雪名句。"], "dict": [{"q": "诗中写北风席卷大地、塞北八月就大雪纷飞，突出边塞奇寒的诗句是：", "a": "北风卷地白草折，胡天八月即飞雪。"}, {"q": "诗中以春花喻冬雪，写雪花挂满枝头如梨花盛开的千古名句是：", "a": "忽如一夜春风来，千树万树梨花开。"}, {"q": "诗中从帐内写雪后奇寒，狐裘不暖、锦被单薄的句子是：", "a": "散入珠帘湿罗幕，狐裘不暖锦衾薄。"}, {"q": "诗中从人物动作侧面写严寒，将军拉不开角弓、都护铠甲冷得难穿的句子是：", "a": "将军角弓不得控，都护铁衣冷难着。"}, {"q": "诗中写沙漠纵横的百丈冰层与万里凝滞的愁云，为送别营造悲壮氛围的句子是：", "a": "瀚海阑干百丈冰，愁云惨淡万里凝。"}, {"q": "诗中写主帅营帐设酒奏乐为归客饯行的句子是：", "a": "中军置酒饮归客，胡琴琵琶与羌笛。"}, {"q": "诗中写红旗被冻硬、狂风也吹不动，以反常之景突出奇寒的句子是：", "a": "纷纷暮雪下辕门，风掣红旗冻不翻。"}, {"q": "诗中写友人已去、只留雪上马蹄印迹，表现依依不舍与绵绵怅惘的句子是：", "a": "山回路转不见君，雪上空留马行处。"}], "trans": [{"q": "忽如一夜春风来，千树万树梨花开。", "a": "仿佛一夜之间春风吹来，千万棵树上好像都开满了洁白的梨花。"}, {"q": "散入珠帘湿罗幕，狐裘不暖锦衾薄。", "a": "雪花飘进珠帘沾湿了丝罗帐幕，狐皮袍子也不保暖，锦缎被子显得单薄。"}, {"q": "将军角弓不得控，都护铁衣冷难着。", "a": "将军的兽角弓冻得拉不开，都护的铁甲冰冷得难以穿上身。"}, {"q": "瀚海阑干百丈冰，愁云惨淡万里凝。", "a": "浩瀚的沙海中纵横着百丈坚冰，万里长空凝聚着惨淡的愁云。"}, {"q": "山回路转不见君，雪上空留马行处。", "a": "山路迂回曲折，早已看不见你的身影，雪地上只留下马蹄的印迹。"}], "book": "9b", "grade": "九年级下册", "id": 118}, {"title": "南乡子·登京口北固亭有怀", "author": "辛弃疾", "dynasty": "宋", "genre": "词", "source": "课内", "unit": "第六单元 第24课 诗词曲五首", "text": "何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。\n年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。", "theme": "登北固亭怀古，借赞孙权抗敌，抒发对苟安朝廷的不满与收复失地的渴望。", "notes": ["神州：这里指中原地区。北固楼：在今镇江北固山上。", "悠悠：连绵不尽的样子。兜鍪：古代作战时戴的头盔，这里代指士兵。", "坐断：占据，割据。东南：指孙权据有的江东地区。战未休：抗战不止。", "曹刘：指曹操与刘备。孙仲谋：孙权，字仲谋。", "上片即景抒情，以“不尽长江滚滚流”写千古兴亡之叹。", "下片借歌颂孙权，暗讽南宋朝廷无北伐之志，用典含蓄而尖锐。"], "dict": [{"q": "词中写词人登楼远望中原、满眼北固楼风光，抒发故土难收之慨的句子是：", "a": "何处望神州？满眼风光北固楼。"}, {"q": "词中以设问写千古兴亡往事悠悠难尽，并以长江滚滚东流喻历史无情的句子是：", "a": "千古兴亡多少事？悠悠。不尽长江滚滚流。"}, {"q": "词中赞颂孙权年纪轻轻就统率千军万马、占据东南抗战不息的句子是：", "a": "年少万兜鍪，坐断东南战未休。"}, {"q": "词中以设问点出曹操刘备为天下英雄，并借曹操语赞美孙权的句子是：", "a": "天下英雄谁敌手？曹刘。生子当如孙仲谋。"}, {"q": "词中借古讽今，暗讽南宋朝廷无人如孙权般坚决抗敌的句子是：", "a": "生子当如孙仲谋。"}], "trans": [{"q": "何处望神州？满眼风光北固楼。", "a": "哪里能眺望到沦陷的中原大地？满眼都是北固楼一带的风光。"}, {"q": "千古兴亡多少事？悠悠。不尽长江滚滚流。", "a": "千百年来有多少兴亡大事？连绵不断，就像这奔流不息的长江水。"}, {"q": "年少万兜鍪，坐断东南战未休。", "a": "孙权年轻时就统率千军万马，占据东南，与敌人作战从不罢休。"}, {"q": "天下英雄谁敌手？曹刘。生子当如孙仲谋。", "a": "天下英雄谁能做他的对手？只有曹操和刘备。生儿子就应当像孙仲谋一样。"}], "book": "9b", "grade": "九年级下册", "id": 119}, {"title": "过零丁洋", "author": "文天祥", "dynasty": "宋", "genre": "诗", "source": "课内", "unit": "第六单元 第24课 诗词曲五首", "text": "辛苦遭逢起一经，干戈寥落四周星。\n山河破碎风飘絮，身世浮沉雨打萍。\n惶恐滩头说惶恐，零丁洋里叹零丁。\n人生自古谁无死？留取丹心照汗青。", "theme": "回顾身世与抗元历程，抒写国破家亡之痛，表达以身殉国、青史留名的决心。", "notes": ["遭逢：指遇到朝廷选拔。起一经：因精通一种经书而通过科举被起用。", "干戈：指战争。寥落：冷清，这里指抗元战事稀疏。四周星：四年。", "风飘絮：形容国势如风中柳絮，破碎飘散。雨打萍：形容身世如雨中浮萍，漂泊无根。", "惶恐滩：赣江险滩名，文天祥曾兵败经此。零丁：孤苦无依的样子。", "丹心：赤诚的心。汗青：指史册。", "“人生自古谁无死？留取丹心照汗青”为千古名句，表达视死如归的民族气节。"], "dict": [{"q": "诗中回顾自己因科举入仕、又在抗元战火中度过四年的诗句是：", "a": "辛苦遭逢起一经，干戈寥落四周星。"}, {"q": "诗中以风中柳絮比喻国家破碎、以雨中浮萍比喻身世浮沉的诗句是：", "a": "山河破碎风飘絮，身世浮沉雨打萍。"}, {"q": "诗中巧借两个地名，双关地写出诗人昔日兵败的惶恐与今日被俘的孤苦的诗句是：", "a": "惶恐滩头说惶恐，零丁洋里叹零丁。"}, {"q": "诗中直抒胸臆，表现诗人以死明志、赤诚之心永照史册的千古名句是：", "a": "人生自古谁无死？留取丹心照汗青。"}], "trans": [{"q": "辛苦遭逢起一经，干戈寥落四周星。", "a": "我靠熟读经书得以入仕，历尽辛苦；如今战事冷落，已经度过四个年头。"}, {"q": "山河破碎风飘絮，身世浮沉雨打萍。", "a": "国家破碎得像风中飘散的柳絮，自己的身世浮沉如同被雨打着的浮萍。"}, {"q": "惶恐滩头说惶恐，零丁洋里叹零丁。", "a": "在惶恐滩头诉说当年的惶恐，在零丁洋里慨叹如今孤苦零丁。"}, {"q": "人生自古谁无死？留取丹心照汗青。", "a": "自古以来哪个人能不死？我要留下一颗赤诚的心照耀史册。"}], "book": "9b", "grade": "九年级下册", "id": 120}, {"title": "山坡羊·潼关怀古", "author": "张养浩", "dynasty": "元", "genre": "曲", "source": "课内", "unit": "第六单元 第24课 诗词曲五首", "text": "峰峦如聚，波涛如怒，山河表里潼关路。\n望西都，意踌躇。\n伤心秦汉经行处，宫阙万间都做了土。\n兴，百姓苦；亡，百姓苦！", "theme": "途经潼关怀古伤今，揭示王朝兴亡皆给百姓带来苦难，表达对人民的深切同情。", "notes": ["峰峦如聚：形容群峰攒集。聚，聚拢、包围。波涛如怒：形容黄河波涛汹涌澎湃。", "山河表里：外有黄河，内有华山，形容地势险要。潼关：古关口名。", "西都：指长安。踌躇：犹豫、徘徊不定，这里指思潮起伏。", "经行处：经过的地方，这里指秦汉故都遗址。宫阙：宫殿。", "“聚”“怒”二字化静为动，赋予山河以人的情感与气势。", "“兴，百姓苦；亡，百姓苦”为全曲主旨句，揭示封建王朝与人民的对立。"], "dict": [{"q": "曲中描写潼关群峰攒集、黄河波涛汹涌，地势险要的句子是：", "a": "峰峦如聚，波涛如怒，山河表里潼关路。"}, {"q": "曲中写作者遥望西都长安、心潮起伏、陷入沉思的句子是：", "a": "望西都，意踌躇。"}, {"q": "曲中写经过秦汉故地，万间宫殿早已化为尘土，抒发无限伤感之情的句子是：", "a": "伤心秦汉经行处，宫阙万间都做了土。"}, {"q": "曲中揭示无论王朝兴衰、受苦的总是百姓，点明全曲主旨的名句是：", "a": "兴，百姓苦；亡，百姓苦！"}, {"q": "曲中表现作者对百姓疾苦深切同情、对封建统治者强烈愤慨的句子是：", "a": "兴，百姓苦；亡，百姓苦！"}], "trans": [{"q": "峰峦如聚，波涛如怒，山河表里潼关路。", "a": "山峰像从四面八方会聚，波涛像在愤怒咆哮，潼关外有黄河、内有华山，地势险要。"}, {"q": "望西都，意踌躇。", "a": "遥望西都长安，我心中思绪翻涌，久久拿不定主意。"}, {"q": "伤心秦汉经行处，宫阙万间都做了土。", "a": "令人伤心的是经过秦汉故地，成千上万间宫殿都已化作了尘土。"}, {"q": "兴，百姓苦；亡，百姓苦！", "a": "朝代兴盛，百姓受苦；朝代灭亡，百姓还是受苦！"}], "book": "9b", "grade": "九年级下册", "id": 121}, {"title": "南安军", "author": "文天祥", "dynasty": "宋", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "梅花南北路，风雨湿征衣。\n出岭同谁出？归乡如此归！\n山河千古在，城郭一时非。\n饿死真吾志，梦中行采薇。", "theme": "写被俘北行途经南安的沉痛心情，表明山河永在、决心饿死殉国的民族气节。", "notes": ["梅花南北路：指经过大庾岭（梅岭）南北两路。征衣：远行者的衣裳。", "出岭：指越过大庾岭。归乡如此归：身为囚徒回到故乡，等于不如不归。", "城郭一时非：城郭一时落入敌手，暗用“城郭犹是人民非”之意。", "采薇：用伯夷、叔齐不食周粟、采薇首阳山而饿死的典故。", "颈联以“千古在”与“一时非”对比，表达对恢复河山的信念。", "尾联化用典故，表明以死殉国、决不投降的决心。"], "dict": [{"q": "诗中写作者途经梅岭南北路、风雨打湿征衣，渲染行程凄苦的句子是：", "a": "梅花南北路，风雨湿征衣。"}, {"q": "诗中写作者被俘北行、越过梅岭无人同行，回到故乡却身系囚笼、不如不归的句子是：", "a": "出岭同谁出？归乡如此归！"}, {"q": "诗中以祖国山河万古长存与城郭一时沦陷作对比，表达恢复信念与对敌人蔑视的句子是：", "a": "山河千古在，城郭一时非。"}, {"q": "诗中化用伯夷叔齐采薇典故，表明饿死殉国、决不降敌决心的句子是：", "a": "饿死真吾志，梦中行采薇。"}], "trans": [{"q": "梅花南北路，风雨湿征衣。", "a": "经过梅岭南北两面的路口，凄风苦雨打湿了出征人的衣衫。"}, {"q": "出岭同谁出？归乡如此归！", "a": "当初出梅岭时是同谁一起走的？回到家乡却是这样被俘而归！"}, {"q": "山河千古在，城郭一时非。", "a": "大好河山将千古长存，城郭却暂时落入了敌人手中。"}, {"q": "饿死真吾志，梦中行采薇。", "a": "饿死在家乡确实是我的心愿，梦中也要像伯夷叔齐那样采薇而食。"}], "book": "9b", "grade": "九年级下册", "id": 122}, {"title": "别云间", "author": "夏完淳", "dynasty": "明", "genre": "诗", "source": "课外诵读", "unit": "课外古诗词诵读（二）", "text": "三年羁旅客，今日又南冠。\n无限山河泪，谁言天地宽。\n已知泉路近，欲别故乡难。\n毅魄归来日，灵旗空际看。", "theme": "诀别故乡之作，抒发山河沦丧的悲愤、对故乡亲人的眷恋与抗清到底的信念。", "notes": ["云间：松江的古称，作者家乡。羁旅：寄居他乡，漂泊不定。", "南冠：被囚禁的人，代指俘虏（用《左传》钟仪典故）。", "泉路：黄泉路，指死亡。毅魄：坚强不屈的魂魄（语出屈原《国殇》）。", "灵旗：战旗，这里指后继抗清队伍的旗帜。", "“无限山河泪，谁言天地宽”抒写亡国之痛与无路可走的悲愤。", "尾联表达死后仍要看到抗清义旗的坚贞信念。"], "dict": [{"q": "诗中回顾自己三年来辗转漂泊、坚持抗清，如今又被囚禁的句子是：", "a": "三年羁旅客，今日又南冠。"}, {"q": "诗中抒发山河沦丧之痛、悲愤天地之大竟无容身之处的句子是：", "a": "无限山河泪，谁言天地宽。"}, {"q": "诗中写作者自知死期将近，却难以割舍故乡与亲人的句子是：", "a": "已知泉路近，欲别故乡难。"}, {"q": "诗中写死后英魂归来之日，仍要仰望抗清战旗，表达至死不渝信念的句子是：", "a": "毅魄归来日，灵旗空际看。"}], "trans": [{"q": "三年羁旅客，今日又南冠。", "a": "三年来为抗清四处漂泊奔走，今天又成了被俘的囚徒。"}, {"q": "无限山河泪，谁言天地宽。", "a": "为沦陷的山河流下无尽的泪水，谁还说天地广阔可以容
