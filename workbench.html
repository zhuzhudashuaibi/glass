<title>时空管理局 · 调度系统</title>
<style>
  /* ============================================================
     THEME TOKENS — 一处改色，整站换肤（简约·墨色中性默认）
     ============================================================ */
  :root {
    /* ---- 页面与表面（液态玻璃） ---- */
    --page-bg: #e9eef5;              /* 页面底色：冷白科技底 */
    --surface-card: rgba(255,255,255,0.62);  /* 卡片：半透明玻璃 */
    --surface-nested: rgba(255,255,255,0.38); /* 嵌套：更通透的玻璃 */

    /* ---- 边框 ---- */
    --border: rgba(255,255,255,0.55);          /* 玻璃边框：白色高光 */
    --border-input: rgba(99,102,241,0.2);      /* 强边框：靛蓝调 */

    /* ---- 文本层级 ---- */
    --text: #131a2e;                 /* 主文本：深靛蓝 */
    --text-secondary: #5562a0;       /* 次文本：蓝灰 */
    --text-tertiary: #8a96c4;        /* 弱文本：浅蓝灰 */

    /* ---- 主色（电光蓝） ---- */
    --accent: #3b5bdb;               /* 主色：电光蓝 */
    --accent-muted: rgba(59,91,219,0.1); /* 主色浅底 */
    --on-accent: #ffffff;            /* 主色上的前景文字 */

    /* ---- 模块色（高饱和点缀色） ---- */
    --module-1: #0fb978;             /* 翡翠绿 — 校准/打卡 */
    --module-2: #6366f1;             /* 靛蓝 — 知识/阅读 */
    --module-3: #f59e0b;             /* 琥珀 — 能量/运动 */
    --module-4: #f43f5e;             /* 珊瑚红 — 账目 */
    --module-5: #8b5cf6;             /* 紫罗兰 — 日志 */

    /* ---- 危险色 ---- */
    --danger: #f43f5e;               /* 删除/危险操作 */
    --danger-muted: rgba(244,63,94,0.1); /* 危险浅底 */

    /* ---- 抽屉（深色液态玻璃） ---- */
    --drawer-bg: #0a0f1e;            /* 抽屉底色：深空蓝 */
    --drawer-bg-top: #161e38;        /* 抽屉渐变上色 */
    --drawer-text: #e8edf5;          /* 抽屉前景文字 */
    --drawer-text-mute: rgba(232,237,245,.5);  /* 抽屉次要文字/图标 */
    --drawer-hover: rgba(255,255,255,.07);     /* 抽屉悬停底 */
    --drawer-active: rgba(99,102,241,.18);     /* 抽屉选中底 */

    /* ---- 背景图 ---- */
    --greet-image: url("assets/greet-banner.jpg");
    --page-texture: none;

    /* ---- 圆角 ---- */
    --radius-control: 9px;           /* 勾选框、步进按钮、日历格 */
    --radius-tile: 14px;             /* 图标瓦、输入框、按钮、chip */
    --radius-card: 20px;             /* 卡片、面板、hero */
    --radius-sheet: 26px;            /* 底部弹窗顶部圆角 */

    /* ---- 阴影 ---- */
    --shadow-card: 0 1px 2px rgba(19,26,46,.03), 0 8px 24px rgba(59,91,219,.07);
    --shadow-overlay: 0 12px 40px rgba(19,26,46,.16);

    /* ---- 字体与布局 ---- */
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --nav-h: 64px;

    /* ---- 动画曲线（贝塞尔） ---- */
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out-circ: cubic-bezier(0.85, 0, 0.15, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-smooth: cubic-bezier(0.45, 0, 0.25, 1);
    --dur-page: 0.42s;
    --dur-card: 0.32s;
    --dur-ctrl: 0.18s;
  }

  /* ============================================================
     深色主题 — 覆盖 :root 变量
     ============================================================ */
  [data-theme="dark"] {
    --page-bg: #0a0e1a;
    --surface-card: rgba(255,255,255,0.05);
    --surface-nested: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08);
    --border-input: rgba(99,102,241,0.25);
    --text: #e8edf5;
    --text-secondary: #9ba8c8;
    --text-tertiary: #5a6a8e;
    --accent-muted: rgba(99,102,241,0.15);
    --shadow-card: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.15);
    --shadow-overlay: 0 12px 40px rgba(0,0,0,.4);
    --drawer-bg: #060912;
    --drawer-bg-top: #0d1424;
    --drawer-text: #e8edf5;
    --drawer-text-mute: rgba(232,237,245,.4);
    --drawer-hover: rgba(255,255,255,.05);
    --drawer-active: rgba(99,102,241,.15);
  }
  [data-theme="dark"] body {
    background-image:
      linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px),
      radial-gradient(circle at 12% 8%, rgba(99,102,241,0.08), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(15,185,120,0.05), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(139,92,246,0.06), transparent 40%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--module-2); outline-offset: 2px; border-radius: 4px; }
  button { -webkit-focus-ring-color: var(--module-2); }
  html, body { height: 100%; }
  body {
    background: var(--page-bg);
    background-image:
      linear-gradient(rgba(59,91,219,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,91,219,0.04) 1px, transparent 1px),
      radial-gradient(circle at 12% 8%, rgba(99,102,241,0.07), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(15,185,120,0.06), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(139,92,246,0.05), transparent 40%);
    background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%, 100% 100%;
    background-attachment: fixed;
    color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    max-width: 480px; margin: 0 auto; position: relative;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: var(--page-texture); background-size: cover; background-position: center; opacity:.5; }

  /* ---- 液态玻璃特效层 ---- */
  .card, .panel, .hero, .quote, .qbtn, .pin, .mini, .cal-panel {
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .cal-cell, .cal-chip, .cal-nav, .seg .opt {
    backdrop-filter: blur(12px) saturate(1.3);
    -webkit-backdrop-filter: blur(12px) saturate(1.3);
  }
  .topbar { backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); }
  .nav { backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    background: rgba(255,255,255,0.7); }
  .drawer { backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2); }
  .modal { backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3);
    background: rgba(255,255,255,0.85); }
  .app { padding: 0 16px calc(var(--nav-h) + 26px); }
  svg { display: block; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 14px 2px 12px; backdrop-filter: blur(10px);
    background: linear-gradient(180deg, color-mix(in srgb, var(--page-bg) 94%, transparent), color-mix(in srgb, var(--page-bg) 50%, transparent)); }
  .topbar .menu-btn { width: 38px; height: 38px; border: none; border-radius: var(--radius-tile); background: var(--surface-card);
    box-shadow: var(--shadow-card); display: grid; place-items: center; cursor: pointer; color: var(--text); }
  .topbar .title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; flex: 1; line-height: 1.2; }
  .topbar .title small { display:block; font-size: 11px; font-weight: 500; color: var(--text-secondary); letter-spacing:.02em; margin-top: 2px; }
  .date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- generic card / section ---------- */
  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size: 14px; font-weight: 700; margin: 24px 2px 12px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .sec-title .more { margin-left:auto; font-size: 12px; color: var(--text-secondary); font-weight: 500; cursor: pointer; display:inline-flex; align-items:center; gap:2px; }
  .sec-title .more svg { color: var(--text-tertiary); }

  /* ---------- greeting ---------- */
  .greet { position: relative; overflow: hidden; margin-top: 10px; padding: 22px 20px 24px; border-radius: var(--radius-card);
    border: 1px solid var(--border); box-shadow: var(--shadow-card); min-height: 132px;
    background: var(--surface-nested) var(--greet-image) right center / cover no-repeat; }
  .greet::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, var(--surface-nested) 30%, color-mix(in srgb, var(--surface-nested) 70%, transparent) 48%, transparent 70%); }
  .greet > * { position: relative; z-index: 1; }
  .greet h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .greet p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .greet .add { position: absolute; top: 16px; right: 16px; z-index: 2; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; background: var(--accent); color:var(--on-accent);
    font-size: 13px; font-weight: 700; padding: 9px 15px 9px 12px; border-radius: 999px; box-shadow: var(--shadow-overlay);
    transition: transform .12s, filter .15s; }
  .greet .add:active { transform: scale(.95); filter: brightness(1.15); }
  .greet .add svg { margin-top: -1px; }

  /* ---------- quote card ---------- */
  .quote { margin-top: 16px; padding: 16px 18px; border-radius: var(--radius-card);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position: relative; }
  .quote::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size: 11px; font-weight: 700; color: var(--text-secondary);
    letter-spacing: .04em; margin-bottom: 9px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size: 16px; font-weight: 600; line-height: 1.55; color: var(--text); }

  /* ---------- overview rings ---------- */
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 20px 6px; margin-top: 14px; }
  .ring { display:flex; flex-direction:column; align-items:center; gap: 8px; }
  .ring .dial { position: relative; width: 68px; height: 68px; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width: 68px; height: 68px; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .ring .lbl { font-size: 12px; color: var(--text); font-weight: 600; }
  .ring .sub { font-size: 11px; color: var(--text-secondary); }

  /* ---------- trend + quick record ---------- */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 14px; }
  .panel.trend-panel { margin-top: 12px; }
  .panel .ph { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:11px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height: auto; margin-top: 12px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:4px; padding: 0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height: 120px;
    color: var(--text-tertiary); font-size: 12px; margin-top: 8px; }
  .quick-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .qbtn { display:flex; flex-direction:column; align-items:center; gap:9px; padding: 15px 6px 12px; border:none; cursor:pointer;
    border-radius: var(--radius-tile); background: var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card);
    text-align:center; transition: transform .12s, border-color .15s, box-shadow .15s; }
  .qbtn:active { transform: scale(.95); border-color: var(--border-input); box-shadow: var(--shadow-overlay); }
  .qbtn .e { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); display:grid; place-items:center; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size: 12px; font-weight: 600; color: var(--text); }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:flex; flex-direction:column; gap: 8px; }
  .pin { display:flex; align-items:center; gap: 11px; padding: 12px 14px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .pin-ic { width: 32px; height: 32px; border-radius: var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .pin .arw { color: var(--text-tertiary); flex:0 0 auto; }
  .pin-chk { flex:0 0 auto; width: 24px; height: 24px; border-radius: var(--radius-control); border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 6px; }
  .pin-step button { width: 28px; height: 28px; border-radius: var(--radius-control); border: 1px solid var(--border-input);
    background: var(--surface-nested); color: var(--text); font-size: 17px; line-height: 1; cursor:pointer;
    display:grid; place-items:center; transition: all .15s; }
  .pin-step button:active { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { padding: 20px 16px; text-align:center; color: var(--text-secondary); font-size: 12px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- record list (inside a module) ---------- */
  .rec { position: relative; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile);
    box-shadow: var(--shadow-card); padding: 13px 14px; margin-bottom: 9px; transition: border-color .15s; }
  .rec:active { border-color: var(--border-input); }
  .rec .top { display:flex; align-items:flex-start; gap: 11px; }
  .rec .chk { flex:0 0 auto; width: 22px; height: 22px; border-radius: var(--radius-control); border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition: all .15s; margin-top: 1px; }
  .rec .chk.on { background: var(--module-1); border-color: var(--module-1); }
  .rec .chk svg { opacity: 0; }
  .rec .chk.on svg { opacity: 1; }
  .rec .body { flex:1; min-width:0; padding-right: 52px; }
  .rec .rname { font-weight: 600; font-size: 14.5px; letter-spacing: -.01em; }
  .rec .rname.done { text-decoration: line-through; color: var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap: 7px; margin-top: 7px; align-items:center; }
  .rec .rnote { color: var(--text-secondary); font-size: 12.5px; margin-top: 7px; white-space: pre-wrap; line-height: 1.55; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge .dot { width:6px;height:6px;border-radius:50%;background:currentColor; }
  .rec .acts { position:absolute; top: 8px; right: 8px; display:flex; gap: 2px; }
  .rec .acts button { border:none; background:transparent; color: var(--text-tertiary); cursor:pointer;
    width: 30px; height: 30px; border-radius: var(--radius-control); display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background: var(--surface-nested); color: var(--module-3); }
  .rec .pin-btn.on { color: var(--module-3); }
  .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec .del:hover { background: var(--danger-muted); color: var(--danger); }
  .rec .pbar { height: 5px; border-radius:999px; background: var(--border); overflow:hidden; margin-top: 10px; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size: 16px; font-weight: 700; letter-spacing:-.02em; margin-right: 56px; white-space:nowrap; }
  .rec .amt.exp { color: var(--danger); }
  .rec .amt.inc { color: var(--module-1); }
  .rec .streak { font-size:12px; color: var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }

  .empty { text-align:center; color: var(--text-secondary); padding: 48px 20px; }
  .empty .e { display:inline-grid; place-items:center; width: 58px; height:58px; border-radius: var(--radius-card); background: var(--surface-card); border:1px solid var(--border); color: var(--text-tertiary); margin-bottom: 14px; }

  /* module header (finance summary) */
  .mod-summary { display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
  .mini { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile); box-shadow: var(--shadow-card); padding: 12px; }
  .mini .l { font-size: 11px; color: var(--text-secondary); }
  .mini .v { font-size: 18px; font-weight: 800; margin-top: 3px; letter-spacing: -.02em; }

  /* module hero header (per-type summary) — compact strip */
  .hero { display:flex; align-items:center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 88px; }
  .hero.has-cover .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }
  .hero.has-cover > .hero-inner { position:relative; z-index:1; padding: 12px 14px; display:flex; align-items:center; gap:12px; }
  .hero-ic { width: 36px; height: 36px; border-radius: var(--radius-tile); display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; display:flex; align-items:baseline; gap: 7px; flex-wrap:wrap; }
  .hero-v { font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .hero-l { font-size: 12px; color: var(--text-secondary); }
  .hero-bar { height: 5px; border-radius: 999px; background: var(--border); overflow:hidden; margin-top: 10px; }
  .hero-bar i { display:block; height:100%; border-radius:999px; }

  /* record thumbnail */
  .rec .thumb { width:48px; height:48px; border-radius:var(--radius-tile); object-fit:cover; flex:0 0 auto; margin-right:2px; }
  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */
  /* feature: 大图在上 + 标题覆盖 + 正文在下 */
  .rec.rec-layout-feature { flex-direction:column; padding:0; overflow:hidden; }
  .rec.rec-layout-feature .thumb { width:100%; height:140px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:10px 12px 4px; font-size:15px; font-weight:700; color:var(--text); }
  .rec.rec-layout-feature .feat-body { padding:0 12px 12px; font-size:13px; color:var(--text-secondary); }
  /* quote: 大字居中 + 留白 */
  .rec.rec-layout-quote { flex-direction:column; align-items:center; text-align:center; padding:20px 16px; }
  .rec.rec-layout-quote .quote-text { font-size:16px; font-weight:600; line-height:1.6; color:var(--text); }
  .rec.rec-layout-quote .quote-meta { margin-top:8px; font-size:12px; color:var(--text-tertiary); }

  /* ---------- bottom nav ---------- */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; height: var(--nav-h);
    background: rgba(252,251,248,.92); backdrop-filter: blur(14px); border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(3,1fr); align-items: center; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .nav .n { display:flex; flex-direction:column; align-items:center; gap: 4px; cursor:pointer; color: var(--text-tertiary); font-size: 10px; font-weight: 500; }
  .nav .n.active { color: var(--accent); font-weight: 700; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--text) 42%, transparent); backdrop-filter: blur(2px); z-index: 40; opacity:0; pointer-events:none; transition: opacity .22s; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .drawer { position: fixed; top:0; bottom:0; left:0; width: 296px; max-width: 82vw; z-index: 50; transform: translateX(-104%);
    transition: transform .26s cubic-bezier(.2,.8,.25,1); overflow-y:auto;
    background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color:var(--drawer-text); }
  .drawer.show { transform: translateX(0); }
  .drawer .dh { padding: 26px 22px 18px; display:flex; align-items:center; gap: 12px; position: relative; }
  .drawer .dh .brand { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); box-shadow: 0 0 0 1px var(--drawer-active); cursor: pointer; }
  .drawer .dh .brand img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .drawer .dh .brand .brand-cam { position:absolute; inset:0; display:grid; place-items:center; opacity:0;
    background: color-mix(in srgb, var(--text) 50%, transparent); color:var(--drawer-text); transition: opacity .15s; }
  .drawer .dh .brand:active .brand-cam { opacity:1; }
  .drawer .dh h2 { font-size: 17px; font-weight: 800; }
  .drawer .dh p { font-size: 11px; opacity: .55; margin-top: 3px; letter-spacing: .05em; }
  .drawer .dclose { position:absolute; top:18px; right:16px; width:32px;height:32px;border-radius:var(--radius-tile); border:none; cursor:pointer;
    background: var(--drawer-hover); color:var(--drawer-text); display:grid; place-items:center; }
  .drawer .dsep { height:1px; background: var(--drawer-active); margin: 6px 22px 8px; }
  .drawer .ditem { display:flex; align-items:center; gap: 13px; padding: 12px 22px; cursor:pointer; font-size: 15px; font-weight: 500; color: color-mix(in srgb, var(--drawer-text) 82%, transparent); }
  .drawer .ditem svg { color: var(--drawer-text-mute); }
  .drawer .ditem.active { background: var(--drawer-active); color:var(--drawer-text); font-weight: 700; }
  .drawer .ditem.active svg { color:var(--drawer-text); }
  .drawer .dfoot { font-size: 11px; opacity:.45; padding: 20px 22px 28px; }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--text) 44%, transparent); backdrop-filter: blur(3px); z-index: 60;
    display:flex; align-items:flex-end; justify-content:center; animation: fade .16s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background: var(--surface-card); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    width: 100%; max-width: 480px; box-shadow: 0 -20px 50px color-mix(in srgb, var(--text) 24%, transparent); animation: up .24s cubic-bezier(.2,.8,.25,1); max-height: 88vh; overflow-y:auto; }
  @keyframes up { from { transform: translateY(30px); opacity:0; } }
  .modal .grab { width: 40px; height: 4px; border-radius:999px; background: var(--border-input); margin: 0 auto 16px; }
  .modal h2 { font-size: 18px; font-weight: 800; letter-spacing:-.01em; }
  .modal .sub { color: var(--text-secondary); font-size: 13px; margin: 4px 0 16px; }
  .field { margin-bottom: 13px; }
  .field label { display:block; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  input, select, textarea { font-family: var(--font); font-size: 15px; border: 1px solid var(--border-input); border-radius: var(--radius-tile);
    padding: 11px 12px; background: var(--surface-card); color: var(--text); outline:none; width: 100%; transition: border-color .15s, box-shadow .15s; }
  textarea { resize: vertical; min-height: 74px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
  .frow { display:flex; gap: 10px; }
  .frow .field { flex:1; }
  .seg { display:flex; gap: 8px; }
  .seg .opt { flex:1; text-align:center; padding: 10px; border-radius: var(--radius-tile); border: 1px solid var(--border-input);
    cursor:pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .seg .opt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .modal-actions { display:flex; align-items:center; gap: 10px; margin-top: 18px; }
  .btn { flex:1; background: var(--accent); color:var(--on-accent); border:none; border-radius: var(--radius-tile); padding: 13px; font-size: 15px; font-weight: 700; cursor:pointer; }
  .btn.ghost { flex: 0 0 auto; background: var(--surface-nested); color: var(--text-secondary); border: 1px solid var(--border-input); padding: 13px 20px; }
  .btn.danger { background: var(--danger); }
  .link-danger { color: var(--danger); background:none; border:none; font-size: 14px; font-weight: 600; cursor:pointer; }

  /* ---------- insight charts ---------- */
  .bar-list { display:flex; flex-direction:column; gap:11px; margin-top:14px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-ic { width:30px; height:30px; border-radius:var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .bar-name { font-size:13px; font-weight:600; width:64px; flex:0 0 auto; color:var(--text); }
  .bar-row .pbar { flex:1; margin:0; height:7px; }
  .bar-pct { font-size:12px; font-weight:600; color:var(--text-secondary); width:54px; text-align:right; flex:0 0 auto; }

  .donut-wrap { display:flex; gap:18px; align-items:center; margin-top:14px; }
  .donut { position:relative; width:104px; height:104px; flex:0 0 auto; }
  .donut svg { transform:rotate(-90deg); width:104px; height:104px; }
  .donut-mid { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:800; color:var(--text); text-align:center; line-height:1.2; }
  .donut-legend { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .legend-dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .legend-name { color:var(--text); font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-amt { color:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
  .legend-pct { color:var(--text-secondary); width:38px; text-align:right; font-variant-numeric:tabular-nums; }
  .donut-empty { width:68px; height:68px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:var(--text-tertiary); font-size:10px; }

  /* ---------- calendar grid ---------- */
  .cal-panel { margin-top:12px; }
  .cal-hd { display:flex; align-items:center; gap:10px; }
  .cal-nav { width:30px; height:30px; border-radius:var(--radius-tile); border:1px solid var(--border-input); background:var(--surface-nested);
    color:var(--text); cursor:pointer; display:grid; place-items:center; transition: all .15s; }
  .cal-nav:active { background:var(--accent-muted); border-color:var(--accent); }
  .cal-nav[data-cal="prev"] svg { transform: scaleX(-1); }
  .cal-title { flex:1; text-align:center; font-size:14px; font-weight:700; color:var(--text); }
  .cal-chips { display:flex; gap:6px; overflow-x:auto; margin:12px 0 10px; padding-bottom:2px; scrollbar-width:none; }
  .cal-chips::-webkit-scrollbar { display:none; }
  .cal-chip { flex:0 0 auto; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border-input); background:var(--surface-card); color:var(--text-secondary); cursor:pointer; white-space:nowrap; transition: all .15s;
    font-family:var(--font); }
  .cal-chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .cal-dow { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--text-tertiary); font-weight:600; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell { aspect-ratio:1; border-radius:var(--radius-control); display:grid; place-items:center; font-size:12px; font-weight:600;
    color:var(--text-secondary); background:var(--surface-nested); border:1px solid var(--border); cursor:pointer; transition: all .15s;
    font-family:var(--font); }
  .cal-cell.blank { background:transparent; border:none; cursor:default; }
  .cal-cell.on { color:#fff; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell:active { transform: scale(.92); }
  .cal-toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%) translateY(16px);
    background:var(--text); color:var(--surface-card); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px;
    box-shadow:var(--shadow-overlay); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; display:flex; align-items:center; gap:10px; }
  .cal-toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .cal-toast button { background:var(--module-2); color:#fff; border:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font); }
  .cal-foot { margin-top:12px; font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .cal-foot svg { color:var(--module-3); }

  /* ---- 时空管理局装饰层 ---- */
  .greet::after { content:""; position:absolute; right:-40px; top:50%; transform:translateY(-50%);
    width:180px; height:180px; border-radius:50%; pointer-events:none; z-index:0;
    background: radial-gradient(circle, rgba(99,102,241,0.18), rgba(139,92,246,0.08) 40%, transparent 70%); }
  .greet h1 { background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .dispatch-no { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    color:var(--accent); background:var(--accent-muted); padding:3px 11px; border-radius:999px;
    margin-bottom:10px; letter-spacing:.06em; }
  .dispatch-no::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent);
    animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.3)} }
  .sec-title::before { background: linear-gradient(180deg, var(--accent), var(--module-5)); border-radius:2px; }
  .quote::before { background: linear-gradient(180deg, var(--module-2), var(--module-5)); }
  .quote .txt { background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .drawer .dh h2 { background: linear-gradient(135deg, var(--drawer-text), var(--module-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .nav .n.active { color: var(--accent); }
  .nav .n.active svg { filter: drop-shadow(0 0 6px rgba(59,91,219,0.3)); }

  .hidden { display: none !important; }

  /* ============================================================
     贝塞尔曲线动画系统
     ============================================================ */
  @keyframes pageEnter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes ringFill {
    from { stroke-dashoffset: var(--ring-circ); }
  }
  @keyframes barGrow {
    from { width: 0 !important; }
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes modalIn {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes pulseRing {
    0% { transform: scale(0.95); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 0.3; }
    100% { transform: scale(0.95); opacity: 0.7; }
  }

  #screen { animation: pageEnter var(--dur-page) var(--ease-out-expo) both; }
  #screen > * { animation: cardEnter var(--dur-card) var(--ease-out-expo) both; }
  #screen > *:nth-child(1) { animation-delay: 0.02s; }
  #screen > *:nth-child(2) { animation-delay: 0.06s; }
  #screen > *:nth-child(3) { animation-delay: 0.10s; }
  #screen > *:nth-child(4) { animation-delay: 0.14s; }
  #screen > *:nth-child(5) { animation-delay: 0.18s; }
  #screen > *:nth-child(6) { animation-delay: 0.22s; }
  #screen > *:nth-child(7) { animation-delay: 0.26s; }
  #screen > *:nth-child(8) { animation-delay: 0.30s; }

  .overlay { animation: overlayIn 0.2s var(--ease-smooth) both; }
  .overlay .modal { animation: modalIn 0.36s var(--ease-spring) both; }
  .pbar > i { animation: barGrow 0.6s var(--ease-out-expo) both; }
  .chk, .pin-chk, button, .opt, .ditem, .nav .n, .cal-cell {
    transition: all var(--dur-ctrl) var(--ease-spring) !important;
  }
  .rec { transition: transform var(--dur-ctrl) var(--ease-smooth), box-shadow var(--dur-ctrl) var(--ease-smooth); }
  .rec:active { transform: scale(0.97); }

  /* ============================================================
     设置底部大抽屉
     ============================================================ */
  .set-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface-card);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    box-shadow: 0 -8px 40px rgba(19,26,46,.12);
    transform: translateY(100%);
    transition: transform 0.5s var(--ease-out-expo);
    padding: 0 0 calc(20px + env(safe-area-inset-bottom));
  }
  .set-sheet.show { transform: translateY(0); }
  .set-sheet::-webkit-scrollbar { width: 3px; }
  .set-sheet::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .set-grab {
    width: 40px; height: 4px; border-radius: 4px;
    background: var(--text-tertiary); opacity: 0.3;
    margin: 10px auto 6px;
  }
  .set-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px 14px;
  }
  .set-head h2 {
    font-size: 19px; font-weight: 800;
    background: linear-gradient(135deg, var(--text), var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .set-close {
    width: 32px; height: 32px; border-radius: var(--radius-tile);
    border: none; cursor: pointer; background: var(--accent-muted); color: var(--accent);
    display: grid; place-items: center; flex: 0 0 auto;
  }

  .set-section { padding: 0 20px; margin-bottom: 22px; }
  .set-label {
    font-size: 12px; font-weight: 700; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;
  }

  /* 头像选择器 */
  .set-avatar-row {
    display: flex; align-items: center; gap: 14px;
  }
  .set-avatar-preview {
    width: 64px; height: 64px; border-radius: 18px; overflow: hidden;
    border: 2px solid var(--border); flex: 0 0 auto;
    position: relative; cursor: pointer;
    box-shadow: var(--shadow-card);
  }
  .set-avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .set-avatar-preview .cam-overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.4); color: #fff; opacity: 0;
    transition: opacity var(--dur-ctrl) var(--ease-smooth);
  }
  .set-avatar-preview:active .cam-overlay { opacity: 1; }
  .set-avatar-info { flex: 1; }
  .set-avatar-info .name-input {
    font-size: 16px; font-weight: 700; color: var(--text);
    border: none; background: transparent; outline: none; width: 100%;
    border-bottom: 1px solid var(--border); padding: 4px 0; margin-bottom: 4px;
  }
  .set-avatar-info .slogan-input {
    font-size: 12px; color: var(--text-secondary);
    border: none; background: transparent; outline: none; width: 100%;
    border-bottom: 1px solid var(--border); padding: 2px 0;
  }

  /* 主题切换 */
  .set-theme-row {
    display: flex; gap: 8px;
  }
  .set-theme-opt {
    flex: 1; padding: 12px 8px; border-radius: var(--radius-tile);
    border: 1.5px solid var(--border); background: var(--surface-nested);
    cursor: pointer; text-align: center; font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
    transition: all var(--dur-ctrl) var(--ease-spring);
  }
  .set-theme-opt.active {
    border-color: var(--accent); background: var(--accent-muted);
    color: var(--accent);
  }
  .set-theme-opt svg { display: block; margin: 0 auto 4px; }

  /* 颜色选择器 */
  .set-color-grid {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .set-color-dot {
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; flex: 0 0 auto;
    transition: all var(--dur-ctrl) var(--ease-spring);
    position: relative;
  }
  .set-color-dot.active {
    border-color: var(--text);
    transform: scale(1.1);
  }
  .set-color-dot.active::after {
    content: ""; position: absolute; inset: -6px;
    border: 2px solid var(--text); border-radius: 50%;
    animation: pulseRing 2s var(--ease-in-out-circ) infinite;
  }

  /* 背景图案 */
  .set-bg-grid {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  }
  .set-bg-opt {
    width: 56px; height: 56px; border-radius: var(--radius-tile);
    border: 1.5px solid var(--border); cursor: pointer; flex: 0 0 auto;
    transition: all var(--dur-ctrl) var(--ease-spring);
  }
  .set-bg-opt.active { border-color: var(--accent); transform: scale(1.05); }

  /* 滑块 */
  .set-slider-row {
    display: flex; align-items: center; gap: 10px;
  }
  .set-slider-row input[type="range"] {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 4px; outline: none;
  }
  .set-slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 1px 4px rgba(59,91,219,.3);
    transition: transform var(--dur-ctrl) var(--ease-spring);
  }
  .set-slider-row input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }
  .set-slider-val {
    font-size: 13px; font-weight: 700; color: var(--accent);
    min-width: 36px; text-align: right;
  }

  /* 图片 URL 输入 */
  .set-img-input {
    width: 100%; padding: 10px 14px; border-radius: var(--radius-tile);
    border: 1px solid var(--border-input); background: var(--surface-nested);
    font-size: 13px; color: var(--text); outline: none;
    transition: border-color var(--dur-ctrl) var(--ease-smooth);
  }
  .set-img-input:focus { border-color: var(--accent); }

  /* 开关 */
  .set-toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
  }
  .set-toggle-row .lbl { font-size: 14px; font-weight: 600; color: var(--text); }
  .set-toggle-row .sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .set-toggle {
    width: 44px; height: 26px; border-radius: 13px;
    background: var(--border); cursor: pointer; flex: 0 0 auto;
    position: relative; transition: background var(--dur-ctrl) var(--ease-smooth);
  }
  .set-toggle.on { background: var(--accent); }
  .set-toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: transform var(--dur-ctrl) var(--ease-spring);
  }
  .set-toggle.on::after { transform: translateX(18px); }

  /* 更新提示 */
  .set-update-box {
    border: 1px solid var(--border); border-radius: var(--radius-card);
    padding: 14px 16px; background: var(--surface-nested);
  }
  .set-update-box .ver { font-size: 13px; color: var(--text-secondary); }
  .set-update-box .ver strong { color: var(--text); }
  .set-update-box .upd-btn {
    margin-top: 10px; padding: 8px 18px; border-radius: var(--radius-tile);
    border: none; background: var(--accent); color: var(--on-accent);

  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;

/* ============================================================

   ============================================================ */
function isoToday(){ return new Date().toISOString().slice(0,10); }
function today(){ return isoToday(); }
function avgProgress(list){
  if(!list||!list.length) return { value: 0, sub: "0" };
  const v = Math.round(list.reduce((s,x)=>s+Math.min(100,(x.current/x.target)*100||0),0)/list.length);
  return { value: v, sub: `${list.length} 项` };
}
const modOf = k => CONFIG.modules.find(m=>m.key===k);
const $ = s => document.querySelector(s);

const store = {
  load(){
    const raw = localStorage.getItem(CONFIG.storageKey);
    if(raw){ try { return JSON.parse(raw); } catch(e){} }
    const d = {};
    CONFIG.modules.forEach(m => d[m.key] = structuredClone(m.seed||[]));
    return d;
  },
  save(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(data)); },
};

let view = "home";            // home | insight | <moduleKey>

function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

/* ---------- calendar grid (打卡月视图) ---------- */
let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const item=it.find(x=>x.id===calItemId)||it[0]; if(!item) return;
    const ds=el.dataset.date; item.log=item.log||{};
    const wasOn=!!item.log[ds];
    const todayIso=isoToday();
    // 今天之前的日期取消打卡：高风险（会断连续），先确认
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(wasOn) delete item.log[ds]; else item.log[ds]=true;
    persist();
    if(wasOn) showCalUndo(item, ds);
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button type="button" id="calUndo">撤销</button>`;
  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(hideCalToast, 4000);
}
function hideCalToast(){ const t=$("#calToast"); if(t) t.classList.remove("show"); }
function confirmCalUncheck(item, ds){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>取消打卡</h2>
    <div class="sub">取消 ${ds} 的打卡可能会中断连续天数，确定吗？</div>
    <div class="modal-actions"><button class="btn ghost" id="cu-cancel">保留</button><button class="btn danger" id="cu-ok">取消打卡</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cu-cancel").onclick=close;
  overlay.querySelector("#cu-ok").onclick=()=>{ delete item.log[ds]; persist(); close(); showCalUndo(item, ds); };
}

/* ---------- INSIGHT ---------- */
function renderInsight(){

    return {m, pct, label};

    .filter(s=>s.amount>0).sort((a,b)=>b.amount-a.amount);

    return `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>

  $("#screen").innerHTML = `<div class="greet"><div><h1>时空洞察</h1><p>各维度进展一览 · 记录—执行—统计—反馈</p></div></div>

      <div class="bar-list">${barList}</div></div>

        <div class="donut-legend">${legend}</div></div></div>`;

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const it=data[key]||[];
  const t=today();
  let head="", extra="";
  if(m.type==="finance"){
    const inc=it.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
    const exp=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=it.filter(x=>x.done).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已完成", pct);
  } else if(m.type==="checkin"){
    const done=it.filter(x=>x.log&&x.log[t]).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type==="progress"){
    const p=avgProgress(it);
    head=headHero(m, `${p.value}%`, `平均进度 · ${it.length} 项`, p.value);
  } else if(m.type==="note"){
    const todayN=it.filter(x=>x.date===t).length;
    head=headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }
  if(m.type==="checkin") extra=renderCalendar(m,it);
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>该部门暂无记录，点上方「新建」下达第一条指令</div></div>`;
  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:16px">${head}${extra}
      <div class="sec-title">调度记录</div>${body}</div>`;
  wireModule(key);
}

/* per-module hero header: compact strip — icon + big number + label + optional progress bar */
function headHero(m, big, label, pct){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
    <div style="flex:1;min-width:0"><div class="hero-tx"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div>
    ${pct!=null?`<div class="hero-bar"><i style="width:${Math.min(100,pct)}%;background:${m.color}"></i></div>`:''}</div>`;
  if(m.cover) return `<div class="hero has-cover"><div class="hero-bg" style="background-image:url('${attr(m.cover)}')"></div><div class="hero-inner">${inner}</div></div>`;
  return `<div class="hero">${inner}</div>`;

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",14,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 12px 12px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout (原有逻辑)
  if(m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div>
      <div class="rmeta">${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}</div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="checkin"){
    const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}</div>${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="finance"){
    const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span><span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}" style="margin-left:auto">${inc?'+':'-'}¥${x.amount}</div></div></div>`;
  }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key, item){
  const m=modOf(key); const editing=!!item;
  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在列表点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }

  // layout variant selector
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;

  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image URL field (all types)
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---------- router / nav ---------- */
function go(v){ view=v; closeDrawer(); render(); window.scrollTo({top:0}); }
function render(){
  // top title
  if(view==="home"){ $("#topTitle").firstChild.textContent="时空管理局"; $("#topSub").textContent=CONFIG.slogan; }
  else if(view==="insight"){ $("#topTitle").firstChild.textContent="时空洞察"; $("#topSub").textContent="统计与复盘"; }
  else { const m=modOf(view); $("#topTitle").firstChild.textContent=m?m.name:"时空管理局"; $("#topSub").textContent=m?m.desc:""; }
  // nav active
  $("#nav").querySelector('[data-nav="home"]').classList.toggle("active", view==="home");
  $("#nav").querySelector('[data-nav="insight"]').classList.toggle("active", view==="insight");
  // render body
  if(view==="home") renderHome();
  else if(view==="insight") renderInsight();
  else renderModule(view);
}

/* ---------- drawer ---------- */
function buildDrawer(){
  $("#drawerName").textContent=CONFIG.owner;
  $("#drawerSlogan").textContent=CONFIG.slogan;
  const items=[`<div class="ditem" data-go="home">${icon("home",20)}首页</div>`]
    .concat(CONFIG.modules.map(m=>`<div class="ditem" data-go="${m.key}">${icon(m.icon,20)}${m.name}</div>`))
    .concat([`<div class="ditem" data-go="insight">${icon("chart",20)}洞察</div>`]);
  $("#drawerList").innerHTML=items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===view));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ---------- wire chrome ---------- */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else go(t);
});

function applyPrefs() {
  const d = prefs.data;
  const root = document.documentElement;

  // 主题
  let theme = d.theme;
  if (theme === "auto") {
    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  root.setAttribute("data-theme", theme);

  // 主色
  root.style.setProperty("--accent", d.accent);
  root.style.setProperty("--accent-muted", hexToRgba(d.accent, 0.1));

  // 玻璃透明度
  const op = d.glassOpacity / 100;
  root.style.setProperty("--surface-card", `rgba(255,255,255,${op})`);
  root.style.setProperty("--surface-nested", `rgba(255,255,255,${op*0.6})`);
  if (theme === "dark") {
    root.style.setProperty("--surface-card", `rgba(255,255,255,${op*0.08})`);
    root.style.setProperty("--surface-nested", `rgba(255,255,255,${op*0.04})`);
  }

  // 模糊强度
  const blur = d.blurStrength;
  root.style.setProperty("--blur-val", `${blur}px`);

  // 动画速度
  const sp = d.animSpeed / 100;
  root.style.setProperty("--dur-page", `${0.42 * sp}s`);
  root.style.setProperty("--dur-card", `${0.32 * sp}s`);
  root.style.setProperty("--dur-ctrl", `${0.18 * sp}s`);

  // 背景图案
  applyBgPattern(d.bgPattern, theme);

  // 头像
  if (d.avatar) {
    $("#brandImg").src = d.avatar;
    const sa = $("#setAvatarImg"); if (sa) sa.src = d.avatar;
  }
  // 名称
  CONFIG.owner = d.ownerName || "时空管理局";
  CONFIG.slogan = d.slogan || "Temporal Affairs Bureau";
  $("#drawerName").textContent = CONFIG.owner;
  $("#drawerSlogan").textContent = CONFIG.slogan;
  const sn = $("#setName"); if (sn) sn.value = CONFIG.owner;
  const ss = $("#setSlogan"); if (ss) ss.value = CONFIG.slogan;

  // 自定义语录
  if (d.quotes && d.quotes.length === 7) CONFIG.quotes = d.quotes;

  // 模块颜色
  if (d.moduleColors) {
    CONFIG.modules.forEach(m => {
      if (d.moduleColors[m.key]) m.color = d.moduleColors[m.key];
    });
