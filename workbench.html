    const greet = document.querySelector(".greet");
    if (greet) greet.style.backgroundImage = `url('${attr(d.heroImage)}')`;
  }
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function applyBgPattern(pattern, theme) {
  const isDark = theme === "dark";
  const body = document.body;
  if (pattern === "grid") {
    body.style.backgroundImage = isDark
      ? `linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px), radial-gradient(circle at 12% 8%, rgba(99,102,241,0.08), transparent 45%), radial-gradient(circle at 88% 92%, rgba(15,185,120,0.05), transparent 45%), radial-gradient(circle at 90% 10%, rgba(139,92,246,0.06), transparent 40%)`
      : `linear-gradient(rgba(59,91,219,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,91,219,0.04) 1px, transparent 1px), radial-gradient(circle at 12% 8%, rgba(99,102,241,0.07), transparent 45%), radial-gradient(circle at 88% 92%, rgba(15,185,120,0.06), transparent 45%), radial-gradient(circle at 90% 10%, rgba(139,92,246,0.05), transparent 40%)`;
  } else if (pattern === "stars") {
    body.style.backgroundImage = `radial-gradient(1px 1px at 20% 30%, ${isDark?"rgba(255,255,255,.15)":"rgba(59,91,219,.15)"} 50%, transparent), radial-gradient(1px 1px at 60% 70%, ${isDark?"rgba(255,255,255,.1)":"rgba(99,102,241,.12)"} 50%, transparent), radial-gradient(1.5px 1.5px at 80% 20%, ${isDark?"rgba(255,255,255,.12)":"rgba(139,92,246,.1)"} 50%, transparent), radial-gradient(1px 1px at 30% 80%, ${isDark?"rgba(255,255,255,.08)":"rgba(15,185,120,.1)"} 50%, transparent), radial-gradient(circle at 50% 50%, ${isDark?"rgba(99,102,241,0.05)":"rgba(59,91,219,0.04)"} 50%, transparent 70%)`;
    body.style.backgroundSize = "200px 200px, 250px 250px, 300px 300px, 180px 180px, 100% 100%";
  } else if (pattern === "waves") {
    body.style.backgroundImage = `repeating-radial-gradient(circle at 50% 0%, ${isDark?"rgba(99,102,241,0.04)":"rgba(59,91,219,0.05)"} 0px, transparent 40px, transparent 80px), radial-gradient(circle at 20% 10%, ${isDark?"rgba(99,102,241,0.06)":"rgba(99,102,241,0.06)"} 50%, transparent 45%)`;
    body.style.backgroundSize = "100% 100%, 100% 100%";
  } else if (pattern === "glow") {
    body.style.backgroundImage = `radial-gradient(circle at 15% 15%, ${isDark?"rgba(99,102,241,0.12)":"rgba(99,102,241,0.1)"} 50%, transparent 40%), radial-gradient(circle at 85% 85%, ${isDark?"rgba(15,185,120,0.08)":"rgba(15,185,120,0.08)"} 50%, transparent 40%), radial-gradient(circle at 50% 50%, ${isDark?"rgba(139,92,246,0.06)":"rgba(139,92,246,0.05)"} 50%, transparent 60%)`;
    body.style.backgroundSize = "100% 100%, 100% 100%, 100% 100%";
  } else {
    body.style.backgroundImage = "none";
  }
  if (pattern !== "stars" && pattern !== "waves") body.style.backgroundSize = "";
}

/* ---------- 设置 UI 构建 ---------- */
function buildSettings() {
  // 设置按钮图标
  $("#btn-settings").innerHTML = icon("sliders", 20);
  $("#setClose").innerHTML = icon("close", 16);
  $("#setCamOverlay").innerHTML = icon("camera", 18);

  // 主题选项文字 + 图标
  const themeOpts = $("#setThemeRow").querySelectorAll(".set-theme-opt");
  const themeLabels = [
    { html: icon("sun", 22) + "明亮", val: "light" },
    { html: icon("auto", 22) + "自动", val: "auto" },
    { html: icon("moon", 22) + "暗黑", val: "dark" },
  ];
  themeOpts.forEach((el, i) => {
    el.innerHTML = themeLabels[i].html;
    el.classList.toggle("active", prefs.data.theme === themeLabels[i].val);
  });

  // 主色调
  $("#setAccentGrid").innerHTML = ACCENT_PRESETS.map(c =>
    `<div class="set-color-dot ${prefs.data.accent===c.val?'active':''}" data-color="${c.val}" style="background:${c.val}" title="${c.name}"></div>`
  ).join("");

  // 背景图案
  $("#setBgGrid").innerHTML = BG_PATTERNS.map(p => {
    const bg = p.val === "stars" ? "#1a1a2e" : p.val === "waves" ? "#e0e7ff" : p.val === "glow" ? "#ede9fe" : p.val === "plain" ? "#f1f5f9" : "#e9eef5";
    return `<div class="set-bg-opt ${prefs.data.bgPattern===p.val?'active':''}" data-bg="${p.val}" style="background:${bg}" title="${p.name}"></div>`;
  }).join("");

  // 滑块值
  $("#setGlassSlider").value = prefs.data.glassOpacity;
  $("#setGlassVal").textContent = prefs.data.glassOpacity + "%";
  $("#setBlurSlider").value = prefs.data.blurStrength;
  $("#setBlurVal").textContent = prefs.data.blurStrength + "px";
  $("#setAnimSlider").value = prefs.data.animSpeed;
  $("#setAnimVal").textContent = prefs.data.animSpeed + "%";

  // Hero 图
  $("#setHeroInput").value = prefs.data.heroImage || "";

  // 每日语录
  const qIds = ["setQuoteMon","setQuoteTue","setQuoteWed","setQuoteThu","setQuoteFri","setQuoteSat","setQuoteSun"];
  const qs = prefs.data.quotes.length === 7 ? prefs.data.quotes : CONFIG.quotes;
  qIds.forEach((id, i) => { $("#"+id).value = qs[i] || ""; });

  // 模块颜色
  $("#setModuleColors").innerHTML = CONFIG.modules.map(m => {
    const mc = prefs.data.moduleColors[m.key] || "";
    return `<div class="set-toggle-row" style="border-bottom:1px solid var(--border)">
      <div><div class="lbl">${icon(m.icon,16)} ${m.name}</div><div class="sub">${m.key}</div></div>
      <div class="set-color-grid" style="gap:6px" data-mkey="${m.key}">
        ${ACCENT_PRESETS.map(c => `<div class="set-color-dot ${mc===c.val?'active':''}" data-mcolor="${c.val}" data-mkey="${m.key}" style="background:${c.val};width:24px;height:24px"></div>`).join("")}
      </div></div>`;
  }).join("");

  // 版本号
  $("#setVer").textContent = "v" + APP_VERSION;

  // wire theme
  themeOpts.forEach(el => el.onclick = () => {
    prefs.data.theme = el.dataset.theme;
    prefs.save();
    themeOpts.forEach(x => x.classList.toggle("active", x === el));
    applyPrefs();
    render();
  });

  // wire accent colors
  $("#setAccentGrid").querySelectorAll(".set-color-dot").forEach(el => el.onclick = () => {
    prefs.data.accent = el.dataset.color;
    prefs.save();
    $("#setAccentGrid").querySelectorAll(".set-color-dot").forEach(x => x.classList.toggle("active", x === el));
    applyPrefs();
  });

  // wire bg patterns
  $("#setBgGrid").querySelectorAll(".set-bg-opt").forEach(el => el.onclick = () => {
    prefs.data.bgPattern = el.dataset.bg;
    prefs.save();
    $("#setBgGrid").querySelectorAll(".set-bg-opt").forEach(x => x.classList.toggle("active", x === el));
    applyPrefs();
  });

  // wire sliders
  $("#setGlassSlider").oninput = e => {
    prefs.data.glassOpacity = +e.target.value;
    $("#setGlassVal").textContent = e.target.value + "%";
    applyPrefs(); prefs.save();
  };
  $("#setBlurSlider").oninput = e => {
    prefs.data.blurStrength = +e.target.value;
    $("#setBlurVal").textContent = e.target.value + "px";
    prefs.save();
    // 模糊需要重新应用样式
    document.querySelectorAll(".card, .panel, .modal, .rec, .set-sheet, .set-fab").forEach(el => {
      el.style.backdropFilter = `blur(${e.target.value}px) saturate(1.5)`;
      el.style.webkitBackdropFilter = `blur(${e.target.value}px) saturate(1.5)`;
    });
  };
  $("#setAnimSlider").oninput = e => {
    prefs.data.animSpeed = +e.target.value;
    $("#setAnimVal").textContent = e.target.value + "%";
    applyPrefs(); prefs.save();
  };

  // wire hero input
  $("#setHeroInput").onchange = e => {
    prefs.data.heroImage = e.target.value.trim();
    prefs.save();
    applyPrefs();
  };

  // wire quotes
  qIds.forEach((id, i) => {
    $("#"+id).onchange = e => {
      if (!prefs.data.quotes || prefs.data.quotes.length !== 7) prefs.data.quotes = [...CONFIG.quotes];
      prefs.data.quotes[i] = e.target.value;
      prefs.save();
      applyPrefs();
    };
  });

  // wire module colors
  $("#setModuleColors").querySelectorAll("[data-mcolor]").forEach(el => el.onclick = () => {
    const key = el.dataset.mkey, color = el.dataset.mcolor;
    prefs.data.moduleColors = prefs.data.moduleColors || {};
    prefs.data.moduleColors[key] = color;
    prefs.save();
    el.parentElement.querySelectorAll(".set-color-dot").forEach(x => x.classList.toggle("active", x === el));
    applyPrefs();
    render();
  });

  // wire avatar upload
  $("#setAvatarPreview").onclick = () => $("#setAvatarInput").click();
  $("#setAvatarInput").onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      prefs.data.avatar = reader.result;
      prefs.save();
      applyPrefs();
    };
    reader.readAsDataURL(f);
    e.target.value = "";
  };

  // wire name/slogan
  $("#setName").onchange = e => {
    prefs.data.ownerName = e.target.value || "时空管理局";
    prefs.save(); applyPrefs(); buildDrawer(); render();
  };
  $("#setSlogan").onchange = e => {
    prefs.data.slogan = e.target.value || "Temporal Affairs Bureau";
    prefs.save(); applyPrefs(); render();
  };

  // wire update check
  $("#setCheckUpdate").onclick = checkUpdate;
  $("#setExport").onclick = exportData;
}

/* ---------- 打开/关闭设置抽屉 ---------- */
function openSettings() {
  $("#setSheet").classList.add("show");
  $("#setScrim").classList.add("show");
  buildSettings(); // 刷新 UI
}
function closeSettings() {
  $("#setSheet").classList.remove("show");
  $("#setScrim").classList.remove("show");
}

/* ---------- GitHub 自动更新 ---------- */
async function checkUpdate() {
  const info = $("#setUpdateInfo");
  const btn = $("#setCheckUpdate");
  info.textContent = "正在检测时空信号…";
  btn.disabled = true;
  try {
    const res = await fetch(UPDATE_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("网络");
    const json = await res.json();
    if (json.version && json.version !== APP_VERSION) {
      info.innerHTML = `发现新版本 <strong>v${json.version}</strong> · ${esc(json.note || "性能优化与体验提升")}`;
      btn.textContent = "立即更新";
      btn.onclick = () => {
        if (json.url) {
          window.open(json.url, "_blank");
        } else {
          info.textContent = "请前往 GitHub 下载最新版";
        }
      };
    } else {
      info.textContent = "已是最新版本，时空稳定。";
      btn.textContent = "检查更新";
    }
  } catch (e) {
    info.textContent = "无法连接更新源（需要网络），当前为离线版本。";
  }
  btn.disabled = false;
}

/* ---------- 数据导出 ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify({ data, prefs: prefs.data }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `时空管理局_${isoToday()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- 设置事件绑定 ---------- */
$("#btn-settings").onclick = openSettings;
$("#setClose").onclick = closeSettings;
$("#setScrim").onclick = closeSettings;

// 系统主题变化时自动刷新（auto 模式）
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (prefs.data.theme === "auto") { applyPrefs(); render(); }
});

// 首次应用设置
applyPrefs();

buildDrawer();
render();
</script>
